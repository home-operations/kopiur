# Credential projection — the consumer opt-in (docs/movers.md)
#
# The minimal form: flip `credentialProjection.enabled: true` on the CONSUMER
# (the SnapshotPolicy here — Restore and Maintenance take the same field) so the
# operator copies the shared ClusterRepository's credential Secret into this
# mover namespace before each run, instead of you hand-copying it.
#
# This is the consumer half only. For a foreign namespace it is necessary but NOT
# sufficient: the repository owner must also set `credentialProjection.allowed:
# true` on the ClusterRepository, and the operator needs the cluster-wide
# `secrets` RBAC (Helm `secretProjection.enabled`). See the full three-part
# bundle in deploy/examples/11-credential-projection.yaml.
#
# Field shape verified against crates/api: consumer `credentialProjection` is
# `{ enabled: bool }` on SnapshotPolicySpec / RestoreSpec / MaintenanceSpec.
---
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotPolicy
metadata:
  name: my-data
  namespace: media
spec:
  repository: { kind: ClusterRepository, name: shared-primary }
  sources:
    - pvc: { name: my-data }
  credentialProjection:
    enabled: true # off by default; flip this on to stop hand-copying Secrets
