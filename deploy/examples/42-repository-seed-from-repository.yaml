# Example 42 — Seed a new repository from another repository (migrate mode)
#
# The second shape of `spec.seed` (see example 41 for blob mode). MIGRATE MODE
# (`seed.from.repository`) points at another `Repository`/`ClusterRepository` CR
# and runs `kopia snapshot migrate`: source and destination are two INDEPENDENT
# repositories with their own formats and their own passwords. Kopiur creates the
# local repository itself (honoring `create.{splitter,hash,encryption,ecc}`) and
# then copies the source's snapshot manifests into it.
#
# Reach for migrate mode when:
#
#   * the surviving replica is a real repository CR you can still reach (a
#     ClusterRepository the platform team keeps, a peer cluster's repository),
#     not a bare blob mirror;
#   * you want the new repository to have its OWN password and format rather than
#     inheriting the source's.
#
# `kopia snapshot migrate` PRESERVES each snapshot's `username@hostname:path`
# identity and its times, so seeded history stays restorable by
# `Restore.source.identity` / `fromPolicy` — which is what makes a rebuilt
# cluster's policies find their own old snapshots.
#
# CROSS-NAMESPACE CREDENTIALS: the seeding Job runs in this Repository's
# namespace, and the SOURCE repository's Secrets usually live somewhere else.
# `seed.credentialProjection.enabled: true` lets the operator copy them in for
# the duration of the run — which needs the operator's
# `features.credentialProjection.enabled` Helm flag (see
# docs/feature-permissions.md). Without the flag the bootstrap fails closed with
# an actionable message rather than launching a Job that cannot authenticate.
#
# Field shapes verified against crates/api (crates/api/src/seed.rs):
# `seed.from.repository` is a RepositoryRef (kind defaults to Repository; an
# absent namespace resolves in this CR's own namespace); `seed.migrate` is
# migrate-mode-only tuning and is rejected alongside a `backend:` source;
# `policies` is the same enum SnapshotReplication uses and defaults to `none`
# (an explicit `--no-policies`); `seed.migrate.throttle` is the same per-side
# {source, destination} shape SnapshotReplication's `spec.migrate.throttle` uses.
#
# The `# --8<-- [start:…]` / `# --8<-- [end:…]` lines are snippet-section markers
# (docs/repositories.md pulls the Repository on its own). Plain YAML comments —
# the file stays `kubectl apply -f`-able as-is.
---
apiVersion: v1
kind: Secret
metadata:
  name: repo-creds
  namespace: billing
type: Opaque
stringData:
  # Credentials for THIS repository's own backend.
  AWS_ACCESS_KEY_ID: "REPLACE_ME"
  AWS_SECRET_ACCESS_KEY: "REPLACE_ME"
  # THIS repository's own password — in migrate mode it is a brand-new
  # repository, so this is independent of the source's password.
  KOPIA_PASSWORD: "REPLACE_ME"
---
# --8<-- [start:repository]
apiVersion: kopiur.home-operations.com/v1alpha1
kind: Repository
metadata:
  name: nas-primary
  namespace: billing
spec:
  backend:
    s3:
      bucket: rebuilt-primary
      prefix: prod/
      region: us-east-1
      auth:
        secretRef:
          name: repo-creds
  encryption:
    passwordSecretRef:
      name: repo-creds
      key: KOPIA_PASSWORD
  create:
    # Migrate mode creates the local repository itself, so these format knobs ARE
    # honored here (unlike blob mode, which inherits the mirror's format and
    # rejects them as inert).
    enabled: true
    splitter: DYNAMIC-4M-BUZHASH
  seed:
    from:
      # The surviving replica, as a repository CR. `kind` defaults to
      # `Repository`; a ClusterRepository is the usual DR source. A namespaced
      # `kind: Repository` with no `namespace` resolves in THIS CR's namespace.
      #
      # `ClusterRepository/offsite-archive` is ASSUMED PRE-EXISTING — it is the
      # surviving replica, not something this bundle creates. Seeding from it
      # makes this Repository a CONSUMER of it, so its `allowedNamespaces` must
      # admit THIS namespace (`billing`); the webhook otherwise rejects the apply
      # naming spec.seed.from.repository.
      repository:
        kind: ClusterRepository
        name: offsite-archive
    # Migrate-mode tuning. Rejected at admission alongside a `backend:` source.
    migrate:
      parallel: 4 # snapshots migrated concurrently (kopia default 1)
      latestOnly: false # copy the FULL history, not just each identity's newest
      # Do NOT import the source's kopia-side policies (the default). Retention in
      # a kopiur-managed repository is driven by Snapshot CRs and their GFS
      # window; imported kopia policies could delete manifests behind the
      # operator's back.
      policies: none
      # PER-SIDE bandwidth/ops caps for THIS seed. `kopia snapshot migrate` has
      # no speed flags of its own, so each side is applied as `kopia repository
      # throttle set` on that side's connection before the copy runs — and a
      # migrate seed is two repositories under two kopia configs, so the two caps
      # are independent. `source` is the REPLICA being read; `destination` is
      # THIS repository, the one being written.
      #
      # Each side OVERRIDES that side's repository's `moverDefaults.throttle`
      # field by field: a knob set here wins, a knob left unset keeps that
      # repository's value. Only applied while the seed is armed — later connects
      # to this (now-initialized) repository are capped by `moverDefaults.throttle`
      # alone.
      #
      # Every knob set must be >= 1 (a 0 is rejected: kopia's "no limit" is the
      # ABSENT knob). Caps bind only COLD backend traffic, and on small objects
      # bite far harder than the nominal rate — set them as a generous ceiling
      # for the bulk transfer, and remember a seed already runs against
      # failurePolicy.activeDeadlineSeconds below.
      throttle:
        source:
          # Protect the off-site link this replica lives behind.
          downloadBytesPerSecond: 10485760 # 10 MiB/s
          readOpsPerSecond: 200
        destination:
          # Writing into the new primary — usually the roomier side.
          uploadBytesPerSecond: 209715200 # 200 MiB/s
    allowEmptySource: false
    # Copy the SOURCE repository's credential Secrets into the seeding Job's
    # namespace for the duration of the run. Needed whenever the source's Secrets
    # live somewhere this namespace cannot read (the usual cross-namespace or
    # ClusterRepository case). Requires the operator's
    # `features.credentialProjection.enabled` Helm flag.
    credentialProjection:
      enabled: true
    failurePolicy:
      # Wall-clock cap for the SEEDING bootstrap Job (default 86400 = 24h).
      activeDeadlineSeconds: 43200
  catalog:
    # Bound the `discovered` Snapshot CRs a large seeded history materializes.
    retain:
      perIdentity: 100
      maxAgeDays: 365
# --8<-- [end:repository]
