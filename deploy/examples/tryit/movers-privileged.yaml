# Try it end-to-end — a privileged (root) mover (docs/src/content/docs/movers.mdx)
#
# A complete, self-contained arc that proves a ROOT mover runs only after the
# namespace opts in. It creates:
#   * a `media` Namespace carrying the privileged-movers opt-in annotation,
#   * a PVC,
#   * a one-shot seed Job that writes ROOT-owned `0600` files into it (data an
#     unprivileged UID-65532 mover could NOT read — the case that needs root),
#   * an S3 Repository,
#   * a SnapshotPolicy whose mover runs as root (`runAsUser: 0`,
#     `runAsNonRoot: false`), and
#   * a `generateName` manual Snapshot to invoke it.
#
# Fill in the two `REPLACE_ME` backend keys and a `KOPIA_PASSWORD`, then:
#   kubectl apply -f deploy/examples/tryit/movers-privileged.yaml
# (the manual Snapshot uses `generateName`, so create it with `kubectl create`).
#
# The `# region NAME` / `# endregion NAME` lines are region markers for
# docs/src/content/docs/movers.mdx. They are plain YAML comments — the file stays apply-ready.
#
# Field shapes verified against crates/api (externally-tagged backend: the bucket
# lives under `backend.s3`).
---
# region namespace
# The privileged-mover opt-in. Without this annotation, the root Snapshot below
# is REFUSED with a `MoverPermitted=False` condition until the namespace opts in.
apiVersion: v1
kind: Namespace
metadata:
  name: media
  annotations:
    kopiur.home-operations.com/privileged-movers: "true"
# endregion namespace
---
# region pvc
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: app-data
  namespace: media
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
# endregion pvc
---
# region seed
# Seed the PVC with ROOT-owned, owner-only (0600) files — exactly the data an
# unprivileged mover (UID 65532) gets "permission denied" on, so success here
# proves the ROOT mover read it.
apiVersion: batch/v1
kind: Job
metadata:
  name: seed-app-data
  namespace: media
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      # Run the seed as root so the files it writes are root-owned 0600.
      securityContext:
        runAsUser: 0
        runAsNonRoot: false
      containers:
        - name: seed
          image: busybox:1.36
          command: ["sh", "-c"]
          args:
            - |
              set -eu
              mkdir -p /data/config
              echo "owned by root, mode 0600" > /data/config/root-secret.key
              head -c 2097152 /dev/urandom > /data/blob.bin   # ~2 MiB so stats are non-trivial
              chown -R 0:0 /data
              chmod 0600 /data/config/root-secret.key
              ls -ln /data /data/config
          volumeMounts:
            - name: d
              mountPath: /data
      volumes:
        - name: d
          persistentVolumeClaim:
            claimName: app-data
# endregion seed
---
# region secret
apiVersion: v1
kind: Secret
metadata:
  name: repo-creds
  namespace: media
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: "REPLACE_ME"
  AWS_SECRET_ACCESS_KEY: "REPLACE_ME"
  # Generate (e.g. `openssl rand -base64 24`) and store it OUTSIDE the cluster —
  # lose it and the backups are unrecoverable.
  KOPIA_PASSWORD: "REPLACE_ME"
# endregion secret
---
# region repository
apiVersion: kopiur.home-operations.com/v1alpha1
kind: Repository
metadata:
  name: primary
  namespace: media
spec:
  backend:
    s3:
      bucket: my-kopia-bucket
      prefix: media/
      endpoint: s3.us-east-1.amazonaws.com
      region: us-east-1
      auth:
        secretRef:
          name: repo-creds
  encryption:
    passwordSecretRef:
      name: repo-creds
      key: KOPIA_PASSWORD
  create:
    enabled: true
# endregion repository
---
# region policy
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotPolicy
metadata:
  name: app-data
  namespace: media
spec:
  repository:
    name: primary
  sources:
    - pvc:
        name: app-data
  retention:
    keepDaily: 7
    keepWeekly: 4
  # ── Root mover (LAST RESORT) ─────────────────────────────────────────────────
  # The data is root-owned 0600, so no unprivileged UID can read it. A privileged
  # root mover reads everything. This is ELEVATED — it requires the namespace opt-in above.
  mover:
    securityContext:
      runAsUser: 0 # root
      runAsNonRoot: false # required: runAsNonRoot:true + runAsUser:0 is rejected by the kubelet
    # With runAsUser: 0 above, adds DAC_OVERRIDE on top of drop:[ALL], so root can read
    # files owned by ANY uid/gid (root alone keeps no capabilities). It never sets the
    # UID itself: without runAsUser: 0 it grants nothing. On a Restore it adds CHOWN,
    # DAC_OVERRIDE, FOWNER and FSETID so original ownership is reproduced.
    privilegedMode: true
# endregion policy
---
# region snapshot
apiVersion: kopiur.home-operations.com/v1alpha1
kind: Snapshot
metadata:
  generateName: app-data-manual- # server-named — create with `kubectl create`, not apply
  namespace: media
spec:
  policyRef:
    name: app-data
# endregion snapshot
