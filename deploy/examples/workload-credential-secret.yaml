# Workload-namespace credential Secret (docs/movers.md)
#
# A mover Job loads the repository password (and any object-store keys) via
# Kubernetes `envFrom`, which is namespace-local: it can only read a Secret in
# the Job's OWN namespace. So the credential Secret must exist in the WORKLOAD
# namespace where the mover runs.
#
# For a namespaced `Repository` the repo and its Secret already co-reside, so
# nothing extra is needed. For a cluster-scoped `ClusterRepository` whose Secret
# lives in the operator namespace, this same Secret (matching the keys the
# repository references) must ALSO exist in each workload namespace that backs up
# to it — unless you turn on credentialProjection (recommended for shared repos)
# or sync it with External Secrets / Reflector. This file is the self-managed,
# place-it-by-hand path.
#
# The keys here are read by well-known names; match them to what the repository's
# `auth.secretRef` / `encryption.passwordSecretRef` reference. Field shapes
# verified against crates/api.
---
apiVersion: v1
kind: Secret
metadata:
  # Same name the ClusterRepository's auth/encryption secretRefs use.
  name: kopia-rustfs-creds
  # The WORKLOAD namespace where the mover Job runs — NOT the operator namespace.
  namespace: media
type: Opaque
stringData:
  # Object-store keys, read by well-known names (omit for filesystem backends).
  AWS_ACCESS_KEY_ID: "REPLACE_ME"
  AWS_SECRET_ACCESS_KEY: "REPLACE_ME"
  # The kopia repository encryption password. It must match the value in the
  # source Secret — a different password cannot open the same repository.
  KOPIA_PASSWORD: "REPLACE_ME"
