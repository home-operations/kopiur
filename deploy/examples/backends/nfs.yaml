# Backend: Filesystem over inline NFS
#
# kopia has NO native NFS backend — NFS is reached through the *filesystem*
# backend by mounting the export at `path`. This example points the repository at
# an inline NFS export directly: no PersistentVolumeClaim, no StorageClass. The
# operator synthesizes a Kubernetes inline `nfs` volume on every mover Job
# (bootstrap, backup, restore, maintenance) and mounts it read-write at `path`.
#
# Reach for this when your off-site is an on-prem NAS you'd rather name directly
# than wrap in a PVC. For a PVC-backed filesystem repo, see filesystem.yaml; for a
# remote server over SSH, see sftp.yaml.
#
# PERMISSIONS: the export must be WRITABLE by the UID the mover runs as (default
# 65532). If create/connect fails with "permission denied", the operator's Warning
# Event names the exact UID and the `chown -R <uid> <path>` to run on the NAS. See
# the Permissions guide. NOTE: `fsGroup` is a NO-OP on NFS — if the export is owned
# by a dedicated UID/GID and your apps run as other UIDs, use a shared supplemental
# group instead (see nfs-shared-group.yaml).
#
# Field shapes verified against crates/api: externally-tagged backend
# (`backend.filesystem`) with an externally-tagged `volume` (`volume.nfs`).
#
# This file ALSO carries a smoke-test (the `smoketest` snippet section): a tiny
# PVC + SnapshotPolicy + Snapshot that backs up against `nas-primary`, so the
# filesystem page can show a full "Try it end-to-end" arc from one bundle.
#
# The `# --8<-- [start:…]` / `# --8<-- [end:…]` lines are snippet-section markers
# for docs/backends/filesystem.md. They are plain YAML comments — the file stays
# `kubectl apply -f`-able as-is.
# --8<-- [start:repository]
---
apiVersion: v1
kind: Secret
metadata:
  name: nfs-repo-creds
  namespace: backups
type: Opaque
stringData:
  # Filesystem/NFS backends need ONLY the repository encryption password — the
  # data sits on your NAS but kopia still encrypts it. No object-store keys.
  KOPIA_PASSWORD: "choose-something-long-and-random"
---
apiVersion: kopiur.home-operations.com/v1alpha1
kind: Repository
metadata:
  name: nas-primary
  namespace: backups
spec:
  backend:
    filesystem:
      path: /repo # mount path INSIDE the mover pod where kopia writes the repo
      volume:
        nfs:
          server: nas.lan # NFS server hostname or IP
          path: /export/kopia # the export on the server (must be an absolute path)
  encryption:
    passwordSecretRef:
      name: nfs-repo-creds
      key: KOPIA_PASSWORD
  create:
    enabled: true
# --8<-- [end:repository]
---
# --8<-- [start:smoketest]
# A self-contained smoke-test: prove the repository above actually takes a
# backup. Apply the whole file, wait for `nas-primary` to go Ready, then
# `kubectl create -f` this file to mint the Snapshot below and watch it succeed.
#
# NOTE: the NFS export must be WRITABLE by the mover UID 65532 (fsGroup is a
# no-op on NFS — `chown -R 65532:65532 /export/kopia` on the NAS, or see the
# shared-supplemental-group recipe on the filesystem page). With that satisfied
# the smoke backup goes green; otherwise the Repository stops at `Failed`.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: smoke-data
  namespace: backups
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotPolicy
metadata:
  name: smoke
  namespace: backups
spec:
  repository:
    name: nas-primary # the Repository above (kind defaults to Repository)
  sources:
    - pvc:
        name: smoke-data # the throwaway PVC above
  retention:
    keepDaily: 1 # smallest GFS retention — this is a throwaway test
---
apiVersion: kopiur.home-operations.com/v1alpha1
kind: Snapshot
metadata:
  generateName: smoke-now- # server-named, so `kubectl create` (not apply)
  namespace: backups
spec:
  policyRef:
    name: smoke # invoke the recipe above, once, right now
# --8<-- [end:smoketest]
