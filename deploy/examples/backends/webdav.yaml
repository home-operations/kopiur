# Backend: WebDAV
#
# The collection URL lives in the Repository spec; HTTP basic-auth credentials
# live in a Secret.
#
# Field shapes verified against crates/api: externally-tagged backend
# (`backend.webDav` — note the camelCase capital D).
#
# This file ALSO carries a smoke-test (the `smoketest` snippet section): a tiny
# PVC + SnapshotPolicy + Snapshot that backs up against `webdav-primary`, so the
# WebDAV page can show a full "Try it end-to-end" arc from one bundle.
#
# The `# --8<-- [start:…]` / `# --8<-- [end:…]` lines are snippet-section markers
# for docs/backends/webdav.md. They are plain YAML comments — the file stays
# `kubectl apply -f`-able as-is.
# --8<-- [start:repository]
---
apiVersion: v1
kind: Secret
metadata:
  name: webdav-repo-creds
  namespace: backups
type: Opaque
stringData:
  # HTTP basic-auth for the WebDAV endpoint. kopia reads these exact env names.
  KOPIA_WEBDAV_USERNAME: "REPLACE_ME"
  KOPIA_WEBDAV_PASSWORD: "REPLACE_ME"
  KOPIA_PASSWORD: "choose-something-long-and-random"
---
apiVersion: kopiur.home-operations.com/v1alpha1
kind: Repository
metadata:
  name: webdav-primary
  namespace: backups
spec:
  backend:
    webDav:
      url: https://dav.example.com/kopia # the WebDAV collection URL
      auth:
        secretRef:
          name: webdav-repo-creds
  encryption:
    passwordSecretRef:
      name: webdav-repo-creds
      key: KOPIA_PASSWORD
  create:
    enabled: true
# --8<-- [end:repository]
---
# --8<-- [start:smoketest]
# A self-contained smoke-test: prove the repository above actually takes a
# backup. Apply the whole file, wait for `webdav-primary` to go Ready, then
# `kubectl create -f` this file to mint the Snapshot below and watch it succeed.
#
# NOTE: the smoke backup only goes green once the REPLACE_ME credentials above
# are real — with placeholders the Repository stops at `Failed`.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: smoke-data
  namespace: backups
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotPolicy
metadata:
  name: smoke
  namespace: backups
spec:
  repository:
    name: webdav-primary # the Repository above (kind defaults to Repository)
  sources:
    - pvc:
        name: smoke-data # the throwaway PVC above
  retention:
    keepDaily: 1 # smallest GFS retention — this is a throwaway test
---
apiVersion: kopiur.home-operations.com/v1alpha1
kind: Snapshot
metadata:
  generateName: smoke-now- # server-named, so `kubectl create` (not apply)
  namespace: backups
spec:
  policyRef:
    name: smoke # invoke the recipe above, once, right now
# --8<-- [end:smoketest]
