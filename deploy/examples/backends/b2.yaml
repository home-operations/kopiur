# Backend: Backblaze B2 (ADR-0003 §3.1)
#
# Identifiers (bucket/prefix) live in the Repository spec; the application key
# ID + key live in a Secret read by well-known keys.
#
# Field shapes verified against crates/api: externally-tagged backend
# (`backend.b2`).
#
# This file ALSO carries a smoke-test (the `smoketest` snippet section): a tiny
# PVC + SnapshotPolicy + Snapshot that backs up against `b2-primary`, so the B2
# page can show a full "Try it end-to-end" arc from one bundle.
#
# The `# --8<-- [start:…]` / `# --8<-- [end:…]` lines are snippet-section markers
# for docs/backends/b2.md. They are plain YAML comments — the file stays
# `kubectl apply -f`-able as-is.
# --8<-- [start:repository]
---
apiVersion: v1
kind: Secret
metadata:
  name: b2-repo-creds
  namespace: backups
type: Opaque
stringData:
  # A Backblaze application key (keyID + key). Prefer a key scoped to the one
  # bucket, not the master key.
  B2_KEY_ID: "REPLACE_ME"
  B2_KEY: "REPLACE_ME"
  KOPIA_PASSWORD: "choose-something-long-and-random"
---
apiVersion: kopiur.home-operations.com/v1alpha1
kind: Repository
metadata:
  name: b2-primary
  namespace: backups
spec:
  backend:
    b2:
      bucket: my-kopia-backups # the B2 bucket holding the repository
      prefix: prod/ # optional object-name prefix within the bucket
      auth:
        secretRef:
          name: b2-repo-creds
  encryption:
    passwordSecretRef:
      name: b2-repo-creds
      key: KOPIA_PASSWORD
  create:
    enabled: true
# --8<-- [end:repository]
---
# --8<-- [start:smoketest]
# A self-contained smoke-test: prove the repository above actually takes a
# backup. Apply the whole file, wait for `b2-primary` to go Ready, then
# `kubectl create -f` this file to mint the Snapshot below and watch it succeed.
#
# NOTE: the smoke backup only goes green once the REPLACE_ME credentials above
# are real — with placeholders the Repository stops at `Failed`.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: smoke-data
  namespace: backups
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotPolicy
metadata:
  name: smoke
  namespace: backups
spec:
  repository:
    name: b2-primary # the Repository above (kind defaults to Repository)
  sources:
    - pvc:
        name: smoke-data # the throwaway PVC above
  retention:
    keepDaily: 1 # smallest GFS retention — this is a throwaway test
---
apiVersion: kopiur.home-operations.com/v1alpha1
kind: Snapshot
metadata:
  generateName: smoke-now- # server-named, so `kubectl create` (not apply)
  namespace: backups
spec:
  policyRef:
    name: smoke # invoke the recipe above, once, right now
# --8<-- [end:smoketest]
