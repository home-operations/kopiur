# Backend: Filesystem (PVC-backed) (ADR-0003 §3.1)
#
# A NAS/PVC repository: the operator mounts a PVC into the mover at `path` and
# kopia writes the repository there. No object-store keys — only KOPIA_PASSWORD.
#
# PERMISSIONS: the repository path must be WRITABLE by the UID the mover runs as
# (default 65532). If create/connect fails with "permission denied", the operator
# tells you the exact UID and `chown -R <uid> <path>` to run. See the Permissions
# guide.
#
# Field shapes verified against crates/api: externally-tagged backend
# (`backend.filesystem`).
#
# This file ALSO carries a smoke-test (the `smoketest` snippet section): a tiny
# PVC + SnapshotPolicy + Snapshot that backs up against `nas-primary`, so the
# filesystem page can show a full "Try it end-to-end" arc from one bundle.
#
# The `# --8<-- [start:…]` / `# --8<-- [end:…]` lines are snippet-section markers
# for docs/backends/filesystem.md. They are plain YAML comments — the file stays
# `kubectl apply -f`-able as-is.
# --8<-- [start:repository]
---
apiVersion: v1
kind: Secret
metadata:
  name: fs-repo-creds
  namespace: backups
type: Opaque
stringData:
  # Filesystem backends need ONLY the repository encryption password.
  KOPIA_PASSWORD: "choose-something-long-and-random"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nas-repo
  namespace: backups
spec:
  accessModes: ["ReadWriteMany"] # the mover Job mounts this read-write
  resources:
    requests:
      storage: 500Gi
  # storageClassName: your-nfs-or-nas-class
---
apiVersion: kopiur.home-operations.com/v1alpha1
kind: Repository
metadata:
  name: nas-primary
  namespace: backups
spec:
  backend:
    filesystem:
      path: /repo # mount path INSIDE the mover pod
      # `volume` is what backs `path`: a PVC (here) or an inline NFS export
      # (see nfs.yaml). Omit `volume` entirely if `path` already exists on the
      # node/image (a hostPath/baked-in mount).
      volume:
        pvc:
          name: nas-repo # the PVC mounted read-write at `path`
  encryption:
    passwordSecretRef:
      name: fs-repo-creds
      key: KOPIA_PASSWORD
  create:
    enabled: true
# --8<-- [end:repository]
---
# --8<-- [start:smoketest]
# A self-contained smoke-test: prove the repository above actually takes a
# backup. Apply the whole file, wait for `nas-primary` to go Ready, then
# `kubectl create -f` this file to mint the Snapshot below and watch it succeed.
#
# NOTE: the repository volume (`nas-repo`) needs an RWX StorageClass; on a
# single-node test cluster you can substitute ReadWriteOnce. The export/path
# must be WRITABLE by the mover UID 65532 (fsGroup is a no-op on NFS) — see the
# filesystem page's "Preparing the export" guidance. With those satisfied the
# smoke backup goes green; otherwise the Repository stops at `Failed`.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: smoke-data
  namespace: backups
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotPolicy
metadata:
  name: smoke
  namespace: backups
spec:
  repository:
    name: nas-primary # the Repository above (kind defaults to Repository)
  sources:
    - pvc:
        name: smoke-data # the throwaway PVC above
  retention:
    keepDaily: 1 # smallest GFS retention — this is a throwaway test
---
apiVersion: kopiur.home-operations.com/v1alpha1
kind: Snapshot
metadata:
  generateName: smoke-now- # server-named, so `kubectl create` (not apply)
  namespace: backups
spec:
  policyRef:
    name: smoke # invoke the recipe above, once, right now
# --8<-- [end:smoketest]
