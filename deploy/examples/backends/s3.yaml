# Backend: S3 / S3-compatible
#
# Amazon S3 and any S3-compatible store (MinIO, RustFS, Ceph RGW, Wasabi, ...).
# Identifiers (bucket/prefix/endpoint/region) live in the Repository spec;
# credentials live in a Secret read by well-known keys.
#
# Field shapes verified against crates/api: externally-tagged backend
# (`backend.s3`, NOT `backend: { kind: S3 }`).
#
# This file ALSO carries a smoke-test (the `smoketest` snippet section): a tiny
# PVC + SnapshotPolicy + Snapshot that backs up against `s3-primary`, so the S3
# page can show a full "Try it end-to-end" arc from one bundle.
#
# The `# --8<-- [start:…]` / `# --8<-- [end:…]` lines are snippet-section markers
# for docs/backends/s3.md. They are plain YAML comments — the file stays
# `kubectl apply -f`-able as-is.
# --8<-- [start:repository]
---
apiVersion: v1
kind: Secret
metadata:
  name: s3-repo-creds
  namespace: backups
type: Opaque
stringData:
  # Read by well-known names. AWS_SESSION_TOKEN is optional (STS only).
  AWS_ACCESS_KEY_ID: "REPLACE_ME"
  AWS_SECRET_ACCESS_KEY: "REPLACE_ME"
  # The kopia repository encryption password. Lose it and the backups are
  # unrecoverable — store it outside the cluster too.
  KOPIA_PASSWORD: "choose-something-long-and-random"
---
apiVersion: kopiur.home-operations.com/v1alpha1
kind: Repository
metadata:
  name: s3-primary
  namespace: backups
spec:
  backend:
    s3:
      bucket: my-backups # the bucket holding the kopia repository
      prefix: clusters/prod/ # optional; lets several repos share one bucket
      region: us-east-1 # required by AWS; some compatible stores want it too
      # endpoint: OMIT for AWS. For MinIO/RustFS/Ceph set the host, e.g.
      #   endpoint: minio.storage.svc.cluster.local:9000
      #   tls:
      #     disableTls: true        # in-cluster plain HTTP (kopia assumes HTTPS otherwise)
      #     # or, for self-signed HTTPS, prefer a CA bundle over skipping verify:
      #     # caBundleRef: { configMapName: minio-ca, key: ca.crt }
      #     # insecureSkipVerify: true   # last resort
      auth:
        secretRef:
          name: s3-repo-creds
  encryption:
    passwordSecretRef:
      name: s3-repo-creds
      key: KOPIA_PASSWORD
  create:
    enabled: true # initialize the repo if it does not exist yet (default: false)
# --8<-- [end:repository]
---
# --8<-- [start:smoketest]
# A self-contained smoke-test: prove the repository above actually takes a
# backup. Apply the whole file, wait for `s3-primary` to go Ready, then
# `kubectl create -f` this file to mint the Snapshot below and watch it succeed.
#
# NOTE: the smoke backup only goes green once the REPLACE_ME credentials above
# are real — with placeholders the Repository stops at `Failed`.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: smoke-data
  namespace: backups
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotPolicy
metadata:
  name: smoke
  namespace: backups
spec:
  repository:
    name: s3-primary # the Repository above (kind defaults to Repository)
  sources:
    - pvc:
        name: smoke-data # the throwaway PVC above
  retention:
    keepDaily: 1 # smallest GFS retention — this is a throwaway test
---
apiVersion: kopiur.home-operations.com/v1alpha1
kind: Snapshot
metadata:
  generateName: smoke-now- # server-named, so `kubectl create` (not apply)
  namespace: backups
spec:
  policyRef:
    name: smoke # invoke the recipe above, once, right now
# --8<-- [end:smoketest]
