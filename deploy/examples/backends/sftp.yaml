# Backend: SFTP (ADR-0003 §3.1)
#
# Connection identifiers (host/port/path/username) live in the Repository spec;
# the SSH private key and known-hosts entry live in a Secret.
#
# Field shapes verified against crates/api: externally-tagged backend
# (`backend.sftp`).
#
# This file ALSO carries a smoke-test (the `smoketest` snippet section): a tiny
# PVC + SnapshotPolicy + Snapshot that backs up against `sftp-primary`, so the
# SFTP page can show a full "Try it end-to-end" arc from one bundle.
#
# The `# --8<-- [start:…]` / `# --8<-- [end:…]` lines are snippet-section markers
# for docs/backends/sftp.md. They are plain YAML comments — the file stays
# `kubectl apply -f`-able as-is.
# --8<-- [start:repository]
---
apiVersion: v1
kind: Secret
metadata:
  name: sftp-repo-creds
  namespace: backups
type: Opaque
stringData:
  # SSH key-based auth. kopia's SFTP backend has no env-var credential form, so
  # the operator's mover reads these two keys from the env (envFrom) and writes
  # them to files, then passes `--keyfile`/`--known-hosts` to kopia. The key
  # NAMES must be valid env identifiers (this is why it's KOPIA_SFTP_KEY_DATA,
  # not `ssh-privatekey` — a dashed key is dropped by Kubernetes envFrom).
  KOPIA_SFTP_KEY_DATA: |
    -----BEGIN OPENSSH PRIVATE KEY-----
    REPLACE_ME
    -----END OPENSSH PRIVATE KEY-----
  # Pin the server host key (avoid trust-on-first-use). Get it with:
  #   ssh-keyscan -p 22 nas.lan
  KOPIA_SFTP_KNOWN_HOSTS: "nas.lan ssh-ed25519 AAAAC3Nz...REPLACE_ME"
  KOPIA_PASSWORD: "choose-something-long-and-random"
---
apiVersion: kopiur.home-operations.com/v1alpha1
kind: Repository
metadata:
  name: sftp-primary
  namespace: backups
spec:
  backend:
    sftp:
      host: nas.lan # SFTP server hostname or IP
      port: 22 # optional; defaults to 22
      path: /volume1/kopia # remote path holding the repository
      username: backup # SSH user to connect as
      auth:
        secretRef:
          name: sftp-repo-creds
  encryption:
    passwordSecretRef:
      name: sftp-repo-creds
      key: KOPIA_PASSWORD
  create:
    enabled: true
# --8<-- [end:repository]
---
# --8<-- [start:smoketest]
# A self-contained smoke-test: prove the repository above actually takes a
# backup. Apply the whole file, wait for `sftp-primary` to go Ready, then
# `kubectl create -f` this file to mint the Snapshot below and watch it succeed.
#
# NOTE: the smoke backup only goes green once the REPLACE_ME credentials above
# are real — with placeholders the Repository stops at `Failed`.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: smoke-data
  namespace: backups
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotPolicy
metadata:
  name: smoke
  namespace: backups
spec:
  repository:
    name: sftp-primary # the Repository above (kind defaults to Repository)
  sources:
    - pvc:
        name: smoke-data # the throwaway PVC above
  retention:
    keepDaily: 1 # smallest GFS retention — this is a throwaway test
---
apiVersion: kopiur.home-operations.com/v1alpha1
kind: Snapshot
metadata:
  generateName: smoke-now- # server-named, so `kubectl create` (not apply)
  namespace: backups
spec:
  policyRef:
    name: smoke # invoke the recipe above, once, right now
# --8<-- [end:smoketest]
