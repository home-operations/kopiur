# Helm values for the e2e harness (mise `e2e-helm` task).
#
# Installs the operator the way the Rust e2e suite expects: cluster-scoped (so the
# controller's watchers can LIST cluster-wide and ClusterRepository reconciles),
# running as the distroless-nonroot uid the mover image uses (65532) so a shared
# hostPath kopia repo — written 0700 by kopia — is readable by both the controller's
# in-process ops and the mover Jobs, with the locally-built `:e2e` images loaded
# into kind (pullPolicy: Never). The webhook is ENABLED with self-managed TLS
# (webhook.tls.mode: self, the default): the controller mints its own serving cert
# and injects the caBundle — no cert-manager needed in the harness. crates/e2e
# tests/webhook.rs asserts the whole bootstrap chain end to end.
#
# The hostPath dirs below are seeded on the node by the mise `e2e-node-seed` task;
# the in-cluster objects (PVCs, Secrets, MinIO) are provisioned from Rust
# (crates/e2e `World`). Keep the paths in lockstep with crates/e2e/src/consts.rs
# (HOSTPATH_REPO / HOSTPATH_RO_REPO) and the uid with consts::MOVER_UID.
#
# NOTE: after the chart flatten (issue #203) the controller's knobs live at the
# ROOT — hence `logging.level`, `extraVolumes`, `readinessProbe` and the root
# `image`/`podSecurityContext` here all configure the CONTROLLER; the webhook and
# mover keep their own named blocks.
installScope: cluster

# Controller (and mover, via passthrough) log level. Chart default is `info`.
logging:
  level: debug

# Feature permissions that grant the operator cluster-wide `secrets` write. Both
# default OFF in the chart (least privilege), so the harness opts in explicitly:
#   * credentialProjection — exercised by crates/e2e tests/credential_projection.rs
#     (backup/restore/maintenance projection). Without it those tests see the
#     actionable 403 instead of a projected Secret.
#   * kopiaUi — grants the `spec.server` (kopia web-UI) secret writes, so a future
#     server e2e isn't blocked by an RBAC 403.
features:
  credentialProjection:
    enabled: true
  kopiaUi:
    enabled: true

# Controller pod security context (root = controller). The uid 65532 matches the
# mover so the shared hostPath repo (written 0700 by kopia) is readable by both.
# The webhook keeps its own locked-down default — it never touches the repo.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

# NOTE on bind addresses: this file deliberately does NOT override metrics.port /
# webhook.port, so the operator binds the chart-default dual-stack wildcard
# "[::]:8081" / "[::]:8443". That validates the dual-stack default in a live kind
# cluster: even though kind here is IPv4 single-stack, a "[::]" bind is dual-stack
# on Linux (net.ipv6.bindv6only=0) and accepts the IPv4 kubelet probe. If a CI
# runner ever has IPv6 disabled in the pod netns (a "[::]" bind then fails), the
# fix is a code/chart change to render "0.0.0.0:<port>" instead.

# Controller image (root = controller). Locally-built `:e2e` images loaded into
# kind; Never so kubelet uses the loaded image instead of pulling.
image:
  repository: docker.io/kopiur/controller
  tag: e2e
  pullPolicy: Never

# The repo hostPath must be visible to the controller's in-process kopia
# (filesystem connect/create). kopia's cache/logs/config come from the chart's
# built-in writable kopia-cache emptyDir — deliberately NOT a manual workaround
# here; that is exactly what the cache_and_events e2e guards.
extraVolumes:
  - name: repo
    hostPath: { path: /kopiur-e2e/repo, type: Directory }
  # A non-writable repo path (root-owned 0555 on the node) for the
  # terminal-failure regression test (filesystem PermissionDenied hard-stop).
  - name: ro-repo
    hostPath: { path: /kopiur-e2e/ro-repo, type: Directory }
extraVolumeMounts:
  - name: repo
    mountPath: /repo
  - name: ro-repo
    mountPath: /ro-repo

# Run the orphaned-object sweep (work-spec ConfigMaps + legacy projected
# credential Secrets) on a fast cadence so crates/e2e tests/leak_cleanup.rs can
# observe it in-test (production defaults: 6h interval, 1h min-age). Root
# extraEnv = controller env (chart flatten, #203).
extraEnv:
  - name: KOPIUR_WORK_SPEC_SWEEP_INTERVAL_SECS
    value: "15"
  - name: KOPIUR_WORK_SPEC_SWEEP_MIN_AGE_SECS
    value: "30"

# Exercise the probe passthrough: a retuned readiness probe (faster first check)
# proves values-driven probes render and the pod still goes Ready.
readinessProbe:
  httpGet:
    path: /readyz
    port: metrics
  initialDelaySeconds: 3
  periodSeconds: 10

webhook:
  enabled: true
  image:
    repository: docker.io/kopiur/webhook
    tag: e2e
    pullPolicy: Never
  # tls.mode defaults to self — the controller mints + injects the cert. Kept
  # explicit here so the harness intent is obvious.
  tls:
    mode: self
  # Exercise the webhook.extraEnv passthrough end to end (a harmless marker var).
  extraEnv:
    - name: KOPIUR_E2E_WEBHOOK_MARKER
      value: "1"

mover:
  # NOTE: the concurrency/cancellation scenarios swap this image at RUNTIME for
  # the `kopiur/mover-slow:e2e` fixture (a sleep wrapper over this same image) by
  # patching KOPIUR_MOVER_IMAGE on the controller Deployment — see
  # crates/e2e/src/slow_mover.rs. That fixture is built + kind-loaded by the
  # `image-mover-slow`/`images-load` tasks in crates/e2e/mise.toml, so
  # `pullPolicy: Never` covers it too. Nothing here needs to change for it.
  image:
    repository: docker.io/kopiur/mover
    tag: e2e
    pullPolicy: Never
