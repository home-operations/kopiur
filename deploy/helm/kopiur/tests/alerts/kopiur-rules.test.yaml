# Semantic tests for the kopiur PrometheusRule (issue #280).
#
# helm-unittest pins the rendered TEXT of these rules; this file pins their
# BEHAVIOR — which alerts fire, with which labels, for a given time series.
# Scenario 1 is THE #280 regression and FAILS against the pre-fix expr.
#
# promtool compares BOTH labels and annotations for every firing alert, so the
# firing scenarios must spell out exp_annotations verbatim (the rendered
# summary/description). Silent scenarios (exp_alerts: []) need neither.
rule_files:
  - kopiur-rules.yaml
evaluation_interval: 1m
tests:
  # 1. THE #280 regression: an old retained Failed Snapshot CR, but the policy's
  #    latest completed backup succeeded → NO alerts. (The pre-fix expr fired
  #    KopiurSnapshotFailed forever here.)
  - interval: 1m
    input_series:
      - series: 'kopiur_resource_phase{kind="Snapshot", namespace="apps", name="daily-old", phase="Failed", policy="daily"}'
        values: "1x60"
      - series: 'kopiur_snapshotpolicy_last_backup_success{namespace="apps", policy="daily"}'
        values: "1x60"
    alert_rule_test:
      - eval_time: 30m
        alertname: KopiurSnapshotFailed
        exp_alerts: []
      - eval_time: 30m
        alertname: KopiurLastBackupFailed
        exp_alerts: []
  # 2. Latest backup failed → BOTH alerts fire, labeled with the CR namespace.
  - interval: 1m
    input_series:
      - series: 'kopiur_resource_phase{kind="Snapshot", namespace="apps", name="daily-new", phase="Failed", policy="daily"}'
        values: "1x60"
      - series: 'kopiur_snapshotpolicy_last_backup_success{namespace="apps", policy="daily"}'
        values: "0x60"
    alert_rule_test:
      - eval_time: 30m
        alertname: KopiurSnapshotFailed
        exp_alerts:
          - exp_labels:
              namespace: apps
              name: daily-new
              policy: daily
              severity: warning
            exp_annotations:
              summary: "Snapshot apps/daily-new failed"
              description: "Snapshot apps/daily-new is Failed and its policy has not completed a newer successful backup."
      - eval_time: 30m
        alertname: KopiurLastBackupFailed
        exp_alerts:
          - exp_labels:
              namespace: apps
              policy: daily
              severity: warning
            exp_annotations:
              summary: "Latest backup for apps/daily failed"
              description: "The most recent completed backup for SnapshotPolicy apps/daily failed. Resolves automatically once a newer backup succeeds."
  # 2b. Multi-repo fan-out (#368, audit M3): the health gauge is per repository
  #     for repo-pinned rows. Repo A's latest succeeded while repo B's latest
  #     failed → KopiurLastBackupFailed fires ONCE, carrying the failing repo's
  #     label — repo A's healthy series must neither suppress it (the pre-fix
  #     flat `min by (namespace, policy)` DID fire but could not name the repo,
  #     and the flat health bit flapped with interleaved runs) nor fire its own.
  #     Also proves KopiurBackupConsecutiveFailures alerts on repo B's
  #     independent streak while repo A interleaves successes.
  - interval: 1m
    input_series:
      - series: 'kopiur_snapshotpolicy_last_backup_success{namespace="apps", policy="fan", repository="Repository/apps/nas"}'
        values: "1x60"
      - series: 'kopiur_snapshotpolicy_last_backup_success{namespace="apps", policy="fan", repository="Repository/apps/offsite"}'
        values: "0x60"
      - series: 'kopiur_snapshot_consecutive_failures{namespace="apps", name="fan", repository="Repository/apps/offsite"}'
        values: "3x60"
      - series: 'kopiur_snapshot_consecutive_failures{namespace="apps", name="fan", repository="Repository/apps/nas"}'
        values: "0x60"
    alert_rule_test:
      - eval_time: 30m
        alertname: KopiurLastBackupFailed
        exp_alerts:
          - exp_labels:
              namespace: apps
              policy: fan
              repository: Repository/apps/offsite
              severity: warning
            exp_annotations:
              summary: "Latest backup for apps/fan failed"
              description: "The most recent completed backup for SnapshotPolicy apps/fan failed. Resolves automatically once a newer backup succeeds."
      - eval_time: 30m
        alertname: KopiurBackupConsecutiveFailures
        exp_alerts:
          - exp_labels:
              namespace: apps
              name: fan
              repository: Repository/apps/offsite
              severity: warning
            exp_annotations:
              summary: "Backups for apps/fan are failing"
              description: "3 consecutive backup failures (>=3) for SnapshotPolicy apps/fan."
  # 3. A Failed Snapshot with no policyRef has no recovery signal → still fires.
  - interval: 1m
    input_series:
      - series: 'kopiur_resource_phase{kind="Snapshot", namespace="apps", name="adhoc", phase="Failed"}'
        values: "1x60"
    alert_rule_test:
      - eval_time: 30m
        alertname: KopiurSnapshotFailed
        exp_alerts:
          - exp_labels:
              namespace: apps
              name: adhoc
              severity: warning
            exp_annotations:
              summary: "Snapshot apps/adhoc failed"
              description: "Snapshot apps/adhoc is Failed and its policy has not completed a newer successful backup."
  # 4. Recovery actually RESOLVES: failed → success mid-stream.
  - interval: 1m
    input_series:
      - series: 'kopiur_resource_phase{kind="Snapshot", namespace="apps", name="daily-x", phase="Failed", policy="daily"}'
        values: "1x120"
      - series: 'kopiur_snapshotpolicy_last_backup_success{namespace="apps", policy="daily"}'
        values: "0x59 1x60"
    alert_rule_test:
      - eval_time: 30m
        alertname: KopiurSnapshotFailed
        exp_alerts:
          - exp_labels:
              namespace: apps
              name: daily-x
              policy: daily
              severity: warning
            exp_annotations:
              summary: "Snapshot apps/daily-x failed"
              description: "Snapshot apps/daily-x is Failed and its policy has not completed a newer successful backup."
      - eval_time: 90m
        alertname: KopiurSnapshotFailed
        exp_alerts: []
      - eval_time: 90m
        alertname: KopiurLastBackupFailed
        exp_alerts: []
  # 5. Pod transition, stale FAILURE + fresh success: a deposed leader's final
  #    samples say 0 while the new leader says 1. The stale target stops being
  #    scraped (staleness ends its series within ~5m in production; modeled with
  #    an explicit `stale` marker here), so the min-by disagreement window is
  #    shorter than `for: 10m` — the alert goes pending but NEVER fires. This is
  #    the false-page direction the `for` clause exists to absorb.
  - interval: 1m
    input_series:
      - series: 'kopiur_snapshotpolicy_last_backup_success{namespace="apps", policy="daily", instance="ctrl-old", pod="kopiur-a"}'
        values: "0x8 stale"
      - series: 'kopiur_snapshotpolicy_last_backup_success{namespace="apps", policy="daily", instance="ctrl-new", pod="kopiur-b"}'
        values: "1x60"
    alert_rule_test:
      - eval_time: 9m
        alertname: KopiurLastBackupFailed
        exp_alerts: []
      - eval_time: 30m
        alertname: KopiurLastBackupFailed
        exp_alerts: []
  # 6. Pod transition, stale SUCCESS + fresh failure (Greptile P1, PR #296): the
  #    deposed leader's final samples say 1 while the current leader reports the
  #    latest backup FAILED. Suppression must require unanimity (`min by`): a
  #    stale lone 1 must not mask a real failure — for a backup system the
  #    missed-alert direction is data-loss-shaped, so disagreement resolves
  #    toward alerting. FAILS against `max by` / an unaggregated `unless` RHS,
  #    which both stay suppressed until the stale series is evicted.
  - interval: 1m
    input_series:
      - series: 'kopiur_snapshotpolicy_last_backup_success{namespace="apps", policy="daily", instance="ctrl-old", pod="kopiur-a"}'
        values: "1x8 stale"
      - series: 'kopiur_snapshotpolicy_last_backup_success{namespace="apps", policy="daily", instance="ctrl-new", pod="kopiur-b"}'
        values: "0x60"
      - series: 'kopiur_resource_phase{kind="Snapshot", namespace="apps", name="daily-y", phase="Failed", policy="daily"}'
        values: "1x60"
    alert_rule_test:
      - eval_time: 15m
        alertname: KopiurLastBackupFailed
        exp_alerts:
          - exp_labels:
              namespace: apps
              policy: daily
              severity: warning
            exp_annotations:
              summary: "Latest backup for apps/daily failed"
              description: "The most recent completed backup for SnapshotPolicy apps/daily failed. Resolves automatically once a newer backup succeeds."
      - eval_time: 15m
        alertname: KopiurSnapshotFailed
        exp_alerts:
          - exp_labels:
              namespace: apps
              name: daily-y
              policy: daily
              severity: warning
            exp_annotations:
              summary: "Snapshot apps/daily-y failed"
              description: "Snapshot apps/daily-y is Failed and its policy has not completed a newer successful backup."
  # 7. Repository circuit breaker open (#345, reason-split since #413/#414): the
  #    breaker gauge exists ONLY while the breaker is open and carries the cause.
  #    A HARD cause (unreachable/vanished) pages warning after 15m; the
  #    slow-connect cause (timed_out) pages info after 30m via its own alert and
  #    must NOT fire the hard one — maintenance keeps running there and the
  #    deadline escalates, so the remediation text is different. The series
  #    VANISHES on recovery (never a lingering 0), resolving both.
  - interval: 1m
    input_series:
      - series: 'kopiur_repository_breaker_open{kind="Repository", namespace="apps", name="nas", reason="unreachable"}'
        values: "1x59 stale"
    alert_rule_test:
      - eval_time: 10m
        alertname: KopiurRepositoryBreakerOpen
        exp_alerts: []
      - eval_time: 30m
        alertname: KopiurRepositoryBreakerOpen
        exp_alerts:
          - exp_labels:
              kind: Repository
              namespace: apps
              name: nas
              severity: warning
            exp_annotations:
              summary: "Repository circuit breaker open for Repository apps/nas"
              description: "The backend health probe kept failing past its threshold, so kopiur opened the circuit breaker: backups, maintenance, and replication against this repository are paused (Snapshots park Pending, they are not lost). Recovery is automatic once a connect succeeds — nothing needs restarting. Run `kubectl describe Repository nas` and check the BackendReachable condition for the cause."
      - eval_time: 30m
        alertname: KopiurRepositoryConnectSlow
        exp_alerts: []
      - eval_time: 90m
        alertname: KopiurRepositoryBreakerOpen
        exp_alerts: []
  # 7b. Slow-connect breaker (#414): reason timed_out fires ONLY the info-level
  #     KopiurRepositoryConnectSlow (after its longer 30m window) and never the
  #     hard-outage alert.
  - interval: 1m
    input_series:
      - series: 'kopiur_repository_breaker_open{kind="ClusterRepository", namespace="", name="b2", reason="timed_out"}'
        values: "1x89 stale"
    alert_rule_test:
      - eval_time: 20m
        alertname: KopiurRepositoryConnectSlow
        exp_alerts: []
      - eval_time: 45m
        alertname: KopiurRepositoryBreakerOpen
        exp_alerts: []
      - eval_time: 45m
        alertname: KopiurRepositoryConnectSlow
        exp_alerts:
          - exp_labels:
              kind: ClusterRepository
              name: b2
              severity: info
            exp_annotations:
              summary: "Repository connects keep exceeding the bootstrap deadline for ClusterRepository /b2"
              description: "kopia repository connect keeps being killed by the bootstrap Job deadline, so the circuit breaker is open: backups and replication are paused (Snapshots park Pending), while maintenance keeps running and kopiur retries with a progressively longer deadline — this usually self-heals once a longer connect succeeds and index compaction catches up. If it persists, raise spec.bootstrap.failurePolicy.activeDeadlineSeconds and check that maintenance is actually completing (`kubectl describe ClusterRepository b2`, IndexBlobHealth and BackendReachable conditions)."
      - eval_time: 120m
        alertname: KopiurRepositoryConnectSlow
        exp_alerts: []
  # 8. Sustained parked backups (#345): kopiur_snapshot_gated is store-backed, so
  #    a parked population is a present series > 0 and recovery removes the series
  #    (never a lingering 0). Fires only after 30m of sustained parking; a brief
  #    park never pages.
  - interval: 1m
    input_series:
      - series: 'kopiur_snapshot_gated{namespace="apps", policy="daily"}'
        values: "2x59 stale"
      - series: 'kopiur_snapshot_gated{namespace="apps", policy="hourly"}'
        values: "1x59 stale"
    alert_rule_test:
      - eval_time: 20m
        alertname: KopiurSnapshotsGated
        exp_alerts: []
      - eval_time: 45m
        alertname: KopiurSnapshotsGated
        exp_alerts:
          - exp_labels:
              namespace: apps
              severity: info
            exp_annotations:
              summary: "Backups in apps are parked behind a not-Ready repository"
              description: "3 Snapshot(s) in apps have been held Pending for 30m because their repository is not Ready (see KopiurRepositoryBreakerOpen / the repository's BackendReachable condition). They will launch automatically once the repository recovers."
      - eval_time: 90m
        alertname: KopiurSnapshotsGated
        exp_alerts: []
