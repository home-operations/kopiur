suite: rbac
release:
  name: kopiur
  namespace: kopiur-system
templates:
  - role.tpl
  - clusterrole.tpl
  - leader-role.tpl
tests:
  - it: namespaced scope renders a Role and no ClusterRole
    set:
      installScope: namespaced
      # Isolate base scope behavior from the self-mode webhook-cert RBAC (which
      # adds a small ClusterRole from role.yaml — covered separately below).
      webhook.enabled: false
    asserts:
      - hasDocuments:
          count: 1
        template: role.tpl
      - isKind:
          of: Role
        template: role.tpl
      - hasDocuments:
          count: 0
        template: clusterrole.tpl

  # --- self-managed webhook TLS RBAC (webhook.tls.mode: self) ----------------

  - it: "self mode (cluster) grants webhook-config patch + secret writes in the ClusterRole"
    set:
      installScope: cluster
      webhook.tls.mode: self
    template: clusterrole.tpl
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: ["admissionregistration.k8s.io"]
            resources: [validatingwebhookconfigurations, mutatingwebhookconfigurations]
            resourceNames: [kopiur-validating, kopiur-mutating]
            verbs: [get, patch]
      - contains:
          path: rules
          content:
            apiGroups: [""]
            resources: [secrets]
            verbs: [create]
      - contains:
          path: rules
          content:
            apiGroups: [""]
            resources: [secrets]
            resourceNames: [kopiur-webhook-tls]
            verbs: [update, patch]

  - it: "cert-manager mode does NOT grant the webhook-cert RBAC"
    set:
      installScope: cluster
      webhook.tls.mode: cert-manager
    template: clusterrole.tpl
    asserts:
      - notContains:
          path: rules
          content:
            apiGroups: ["admissionregistration.k8s.io"]
            resources: [validatingwebhookconfigurations, mutatingwebhookconfigurations]
            resourceNames: [kopiur-validating, kopiur-mutating]
            verbs: [get, patch]

  - it: "self mode (namespaced) adds a tightly-scoped ClusterRole + binding for the webhook-config patch"
    set:
      installScope: namespaced
      webhook.tls.mode: self
    template: role.tpl
    asserts:
      # Role + ClusterRole + ClusterRoleBinding.
      - hasDocuments:
          count: 3
      - isKind:
          of: ClusterRole
        documentIndex: 1
      - equal:
          path: metadata.name
          value: kopiur-webhook-cert
        documentIndex: 1
      - isKind:
          of: ClusterRoleBinding
        documentIndex: 2

  - it: cluster scope renders a ClusterRole and no Role
    set:
      installScope: cluster
    asserts:
      - hasDocuments:
          count: 1
        template: clusterrole.tpl
      - isKind:
          of: ClusterRole
        template: clusterrole.tpl
      - hasDocuments:
          count: 0
        template: role.tpl

  # --- leader-election Lease RBAC (controller.leaderElection.enabled) --------
  #
  # The controller claims/renews ONE coordination.k8s.io Lease in the release
  # namespace when leader election is on (the default). Both install flavours
  # must carry the grant (a missing rule degrades the election at startup), and
  # it must be namespace-local + name-scoped — never a cluster-wide leases
  # grant, which would reach node-heartbeat and other controllers' Leases.

  - it: "leader election (cluster) renders a name-scoped Role + RoleBinding, not a ClusterRole grant"
    set:
      installScope: cluster
    asserts:
      - hasDocuments:
          count: 2
        template: leader-role.tpl
      - isKind:
          of: Role
        template: leader-role.tpl
        documentIndex: 0
      - contains:
          path: rules
          content:
            apiGroups: [coordination.k8s.io]
            resources: [leases]
            verbs: [create]
        template: leader-role.tpl
        documentIndex: 0
      - contains:
          path: rules
          content:
            apiGroups: [coordination.k8s.io]
            resources: [leases]
            resourceNames: [kopiur]
            verbs: [get, update]
        template: leader-role.tpl
        documentIndex: 0
      - isKind:
          of: RoleBinding
        template: leader-role.tpl
        documentIndex: 1
      # The operator ClusterRole itself must carry NO leases grant.
      - notContains:
          path: rules
          content:
            apiGroups: [coordination.k8s.io]
            resources: [leases]
            verbs: [get, create, update]
        template: clusterrole.tpl

  - it: "leader election (namespaced) grants the name-scoped leases rules in the operator Role"
    set:
      installScope: namespaced
      webhook.enabled: false
    template: role.tpl
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: [coordination.k8s.io]
            resources: [leases]
            verbs: [create]
      - contains:
          path: rules
          content:
            apiGroups: [coordination.k8s.io]
            resources: [leases]
            resourceNames: [kopiur]
            verbs: [get, update]

  - it: "leader election disabled drops the leases RBAC entirely (cluster)"
    set:
      installScope: cluster
      leaderElection.enabled: false
    asserts:
      - hasDocuments:
          count: 0
        template: leader-role.tpl

  - it: "leader election disabled drops the leases rules from the namespaced Role too"
    set:
      installScope: namespaced
      webhook.enabled: false
      leaderElection.enabled: false
    template: role.tpl
    asserts:
      - notContains:
          path: rules
          content:
            apiGroups: [coordination.k8s.io]
            resources: [leases]
            verbs: [create]
      - notContains:
          path: rules
          content:
            apiGroups: [coordination.k8s.io]
            resources: [leases]
            resourceNames: [kopiur]
            verbs: [get, update]

  # --- per-feature secrets-write gating (least privilege) --------------------
  #
  # Secrets READ is always granted. Secrets WRITE is split per opt-in feature:
  #   * features.credentialProjection.enabled → [create, patch, delete]
  #   * features.kopiaUi.enabled              → [create, patch, delete]
  # Both default OFF, so the chart only grants what's enabled (services +
  # deployments stay full-verbs — those are presence-driven, not gated here).
  # webhook.enabled is forced false to isolate from the self-mode webhook-TLS
  # `secrets [create]` rule.

  - it: "default (no features) grants read-only secrets in the ClusterRole"
    set:
      installScope: cluster
      webhook.enabled: false
    template: clusterrole.tpl
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: [""]
            resources: [secrets]
            verbs: [get, list, watch]
      - notContains:
          path: rules
          content:
            apiGroups: [""]
            resources: [secrets]
            verbs: [create, patch]
      - notContains:
          path: rules
          content:
            apiGroups: [""]
            resources: [secrets]
            verbs: [create, patch, delete]
      # Services + deployments are NOT gated by these flags — still full verbs.
      - contains:
          path: rules
          content:
            apiGroups: [""]
            resources: [services]
            verbs: [get, list, watch, create, update, patch, delete]
      - contains:
          path: rules
          content:
            apiGroups: [apps]
            resources: [deployments]
            verbs: [get, list, watch, create, update, patch, delete]

  - it: "features.credentialProjection adds [create, patch, delete] (ClusterRole)"
    set:
      installScope: cluster
      webhook.enabled: false
      features.credentialProjection.enabled: true
    template: clusterrole.tpl
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: [""]
            resources: [secrets]
            verbs: [get, list, watch]
      # delete backs the feature's own cleanup (legacy-copy sweep,
      # reap-on-shrink, reap-on-disable) — see role comments. count: 1 keeps
      # the differential guarantee the old notContains gave: the OTHER
      # feature's identically-verbed rule must NOT render off its flag.
      - contains:
          path: rules
          count: 1
          content:
            apiGroups: [""]
            resources: [secrets]
            verbs: [create, patch, delete]

  - it: "features.kopiaUi adds [create, patch, delete] (ClusterRole)"
    set:
      installScope: cluster
      webhook.enabled: false
      features.kopiaUi.enabled: true
    template: clusterrole.tpl
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: [""]
            resources: [secrets]
            verbs: [get, list, watch]
      # count: 1 — the credentialProjection rule must NOT render off its flag.
      - contains:
          path: rules
          count: 1
          content:
            apiGroups: [""]
            resources: [secrets]
            verbs: [create, patch, delete]

  - it: "both features enabled grant read + both write rules (ClusterRole)"
    set:
      installScope: cluster
      webhook.enabled: false
      features.credentialProjection.enabled: true
      features.kopiaUi.enabled: true
    template: clusterrole.tpl
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: [""]
            resources: [secrets]
            verbs: [get, list, watch]
      # Both gated rules now carry identical verbs — assert both render.
      - contains:
          path: rules
          count: 2
          content:
            apiGroups: [""]
            resources: [secrets]
            verbs: [create, patch, delete]

  - it: "default (no features) grants read-only secrets in the namespaced Role"
    set:
      installScope: namespaced
      webhook.enabled: false
    template: role.tpl
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: [""]
            resources: [secrets]
            verbs: [get, list, watch]
      - notContains:
          path: rules
          content:
            apiGroups: [""]
            resources: [secrets]
            verbs: [create, patch]
      - contains:
          path: rules
          content:
            apiGroups: [""]
            resources: [services]
            verbs: [get, list, watch, create, update, patch, delete]
      - contains:
          path: rules
          content:
            apiGroups: [apps]
            resources: [deployments]
            verbs: [get, list, watch, create, update, patch, delete]

  - it: "both features enabled grant read + both write rules (namespaced Role)"
    set:
      installScope: namespaced
      webhook.enabled: false
      features.credentialProjection.enabled: true
      features.kopiaUi.enabled: true
    template: role.tpl
    asserts:
      # Both gated rules now carry identical verbs — assert both render.
      - contains:
          path: rules
          count: 2
          content:
            apiGroups: [""]
            resources: [secrets]
            verbs: [create, patch, delete]
