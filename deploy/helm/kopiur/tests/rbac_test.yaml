suite: rbac
release:
  name: kopiur
  namespace: kopiur-system
templates:
  - role.tpl
  - clusterrole.tpl
tests:
  - it: namespaced scope renders a Role and no ClusterRole
    set:
      installScope: namespaced
      # Isolate base scope behavior from the self-mode webhook-cert RBAC (which
      # adds a small ClusterRole from role.yaml — covered separately below).
      webhook.enabled: false
    asserts:
      - hasDocuments:
          count: 1
        template: role.tpl
      - isKind:
          of: Role
        template: role.tpl
      - hasDocuments:
          count: 0
        template: clusterrole.tpl

  # --- self-managed webhook TLS RBAC (webhook.tls.mode: self) ----------------

  - it: "self mode (cluster) grants webhook-config patch + secret writes in the ClusterRole"
    set:
      installScope: cluster
      webhook.tls.mode: self
    template: clusterrole.tpl
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: ["admissionregistration.k8s.io"]
            resources: [validatingwebhookconfigurations, mutatingwebhookconfigurations]
            resourceNames: [kopiur-validating, kopiur-mutating]
            verbs: [get, patch]
      - contains:
          path: rules
          content:
            apiGroups: [""]
            resources: [secrets]
            verbs: [create]
      - contains:
          path: rules
          content:
            apiGroups: [""]
            resources: [secrets]
            resourceNames: [kopiur-webhook-tls]
            verbs: [update, patch]

  - it: "cert-manager mode does NOT grant the webhook-cert RBAC"
    set:
      installScope: cluster
      webhook.tls.mode: cert-manager
    template: clusterrole.tpl
    asserts:
      - notContains:
          path: rules
          content:
            apiGroups: ["admissionregistration.k8s.io"]
            resources: [validatingwebhookconfigurations, mutatingwebhookconfigurations]
            resourceNames: [kopiur-validating, kopiur-mutating]
            verbs: [get, patch]

  - it: "self mode (namespaced) adds a tightly-scoped ClusterRole + binding for the webhook-config patch"
    set:
      installScope: namespaced
      webhook.tls.mode: self
    template: role.tpl
    asserts:
      # Role + ClusterRole + ClusterRoleBinding.
      - hasDocuments:
          count: 3
      - isKind:
          of: ClusterRole
        documentIndex: 1
      - equal:
          path: metadata.name
          value: kopiur-webhook-cert
        documentIndex: 1
      - isKind:
          of: ClusterRoleBinding
        documentIndex: 2

  - it: cluster scope renders a ClusterRole and no Role
    set:
      installScope: cluster
    asserts:
      - hasDocuments:
          count: 1
        template: clusterrole.tpl
      - isKind:
          of: ClusterRole
        template: clusterrole.tpl
      - hasDocuments:
          count: 0
        template: role.tpl

  # --- per-feature secrets-write gating (least privilege) --------------------
  #
  # Secrets READ is always granted. Secrets WRITE is split per opt-in feature:
  #   * features.credentialProjection.enabled → [create, patch]
  #   * features.kopiaUi.enabled              → [create, patch, delete]
  # Both default OFF, so the chart only grants what's enabled (services +
  # deployments stay full-verbs — those are presence-driven, not gated here).
  # webhook.enabled is forced false to isolate from the self-mode webhook-TLS
  # `secrets [create]` rule.

  - it: "default (no features) grants read-only secrets in the ClusterRole"
    set:
      installScope: cluster
      webhook.enabled: false
    template: clusterrole.tpl
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: [""]
            resources: [secrets]
            verbs: [get, list, watch]
      - notContains:
          path: rules
          content:
            apiGroups: [""]
            resources: [secrets]
            verbs: [create, patch]
      - notContains:
          path: rules
          content:
            apiGroups: [""]
            resources: [secrets]
            verbs: [create, patch, delete]
      # Services + deployments are NOT gated by these flags — still full verbs.
      - contains:
          path: rules
          content:
            apiGroups: [""]
            resources: [services]
            verbs: [get, list, watch, create, update, patch, delete]
      - contains:
          path: rules
          content:
            apiGroups: [apps]
            resources: [deployments]
            verbs: [get, list, watch, create, update, patch, delete]

  - it: "features.credentialProjection adds [create, patch] but not delete (ClusterRole)"
    set:
      installScope: cluster
      webhook.enabled: false
      features.credentialProjection.enabled: true
    template: clusterrole.tpl
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: [""]
            resources: [secrets]
            verbs: [get, list, watch]
      - contains:
          path: rules
          content:
            apiGroups: [""]
            resources: [secrets]
            verbs: [create, patch]
      - notContains:
          path: rules
          content:
            apiGroups: [""]
            resources: [secrets]
            verbs: [create, patch, delete]

  - it: "features.kopiaUi adds [create, patch, delete] (ClusterRole)"
    set:
      installScope: cluster
      webhook.enabled: false
      features.kopiaUi.enabled: true
    template: clusterrole.tpl
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: [""]
            resources: [secrets]
            verbs: [get, list, watch]
      - contains:
          path: rules
          content:
            apiGroups: [""]
            resources: [secrets]
            verbs: [create, patch, delete]

  - it: "both features enabled grant read + both write rules (ClusterRole)"
    set:
      installScope: cluster
      webhook.enabled: false
      features.credentialProjection.enabled: true
      features.kopiaUi.enabled: true
    template: clusterrole.tpl
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: [""]
            resources: [secrets]
            verbs: [get, list, watch]
      - contains:
          path: rules
          content:
            apiGroups: [""]
            resources: [secrets]
            verbs: [create, patch]
      - contains:
          path: rules
          content:
            apiGroups: [""]
            resources: [secrets]
            verbs: [create, patch, delete]

  - it: "default (no features) grants read-only secrets in the namespaced Role"
    set:
      installScope: namespaced
      webhook.enabled: false
    template: role.tpl
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: [""]
            resources: [secrets]
            verbs: [get, list, watch]
      - notContains:
          path: rules
          content:
            apiGroups: [""]
            resources: [secrets]
            verbs: [create, patch]
      - contains:
          path: rules
          content:
            apiGroups: [""]
            resources: [services]
            verbs: [get, list, watch, create, update, patch, delete]
      - contains:
          path: rules
          content:
            apiGroups: [apps]
            resources: [deployments]
            verbs: [get, list, watch, create, update, patch, delete]

  - it: "both features enabled grant read + both write rules (namespaced Role)"
    set:
      installScope: namespaced
      webhook.enabled: false
      features.credentialProjection.enabled: true
      features.kopiaUi.enabled: true
    template: role.tpl
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: [""]
            resources: [secrets]
            verbs: [create, patch]
      - contains:
          path: rules
          content:
            apiGroups: [""]
            resources: [secrets]
            verbs: [create, patch, delete]
