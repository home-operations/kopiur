suite: deployment
templates:
  - deployment.tpl
tests:
  - it: is the controller Deployment
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: metadata.name
          value: RELEASE-NAME-kopiur-controller

  - it: renders the controller image from the chart appVersion
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].image
          pattern: ^ghcr\.io/home-operations/kopiur-controller:.+

  - it: pins the controller image by digest when set, overriding the tag
    set:
      image.controller.digest: sha256:abc123
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: ghcr.io/home-operations/kopiur-controller@sha256:abc123

  - it: stamps the digest-pinned mover image into the controller env
    set:
      image.mover.digest: sha256:def456
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: KOPIUR_MOVER_IMAGE
            value: ghcr.io/home-operations/kopiur-mover@sha256:def456

  - it: sets replicas from controller.replicaCount
    set:
      controller.replicaCount: 3
    asserts:
      - equal:
          path: spec.replicas
          value: 3

  - it: runs non-root with a read-only root filesystem
    asserts:
      - equal:
          path: spec.template.spec.securityContext.runAsNonRoot
          value: true
      - equal:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: true

  - it: defaults to namespaced scope (mover RoleKind = Role)
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: KOPIUR_MOVER_ROLE_KIND
            value: Role

  - it: passes cluster-scope args when installScope is cluster
    set:
      installScope: cluster
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --cluster-scope
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: KOPIUR_MOVER_ROLE_KIND
            value: ClusterRole

  # --- leader election (controller.leaderElection.enabled, default on) -------

  - it: "leader election (default) passes --leader-elect=true and the release-scoped Lease name"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --leader-elect=true
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: KOPIUR_LEASE_NAME
            value: RELEASE-NAME-kopiur

  - it: "leader election disabled passes --leader-elect=false and no Lease name"
    set:
      controller.leaderElection.enabled: false
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --leader-elect=false
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: KOPIUR_LEASE_NAME
            value: RELEASE-NAME-kopiur

  # --- bind address + probes ------------------------------------------------

  - it: defaults the controller bind address to the dual-stack wildcard
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: KOPIUR_HTTP_ADDR
            value: "[::]:8081"

  - it: stamps a custom controller listenAddr into the env
    set:
      controller.listenAddr: "0.0.0.0:8081"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: KOPIUR_HTTP_ADDR
            value: "0.0.0.0:8081"

  - it: renders the default controller probes
    asserts:
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.path
          value: /healthz
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.periodSeconds
          value: 15
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.path
          value: /readyz

  - it: lets a user retune a controller probe timing
    set:
      controller.readinessProbe.periodSeconds: 30
    asserts:
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.periodSeconds
          value: 30

  - it: drops a controller probe when nulled out
    set:
      controller.livenessProbe: null
    asserts:
      - isNull:
          path: spec.template.spec.containers[0].livenessProbe

  - it: appends controller.extraEnv after the managed env
    set:
      controller.extraEnv:
        - name: MY_EXTRA
          value: hello
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MY_EXTRA
            value: hello
