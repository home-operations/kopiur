suite: deployment
templates:
  - deployment.tpl
tests:
  - it: is the controller Deployment
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: metadata.name
          value: RELEASE-NAME-kopiur-controller

  - it: renders the controller image from the chart appVersion
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].image
          pattern: ^ghcr\.io/home-operations/kopiur-controller:.+

  - it: pins the controller image by digest when set, overriding the tag
    set:
      image.digest: sha256:abc123
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: ghcr.io/home-operations/kopiur-controller@sha256:abc123

  - it: stamps the digest-pinned mover image into the controller env
    set:
      mover.image.digest: sha256:def456
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: KOPIUR_MOVER_IMAGE
            value: ghcr.io/home-operations/kopiur-mover@sha256:def456

  - it: sets replicas from the root replicaCount (controller)
    set:
      replicaCount: 3
    asserts:
      - equal:
          path: spec.replicas
          value: 3

  - it: runs non-root with a read-only root filesystem
    asserts:
      - equal:
          path: spec.template.spec.securityContext.runAsNonRoot
          value: true
      - equal:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: true

  - it: namespaced scope stamps the mover RoleKind = Role
    set:
      installScope: namespaced
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --namespace=NAMESPACE
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: KOPIUR_MOVER_ROLE_KIND
            value: Role

  - it: defaults to cluster scope (--cluster-scope, mover RoleKind = ClusterRole)
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --cluster-scope
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: KOPIUR_MOVER_ROLE_KIND
            value: ClusterRole

  # --- leader election (controller.leaderElection.enabled, default on) -------

  - it: "leader election (default) passes --leader-elect=true and the release-scoped Lease name"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --leader-elect=true
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: KOPIUR_LEASE_NAME
            value: RELEASE-NAME-kopiur

  - it: "leader election disabled passes --leader-elect=false and no Lease name"
    set:
      leaderElection.enabled: false
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --leader-elect=false
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: KOPIUR_LEASE_NAME
            value: RELEASE-NAME-kopiur

  # --- bind address + probes ------------------------------------------------

  - it: defaults the controller bind address to the dual-stack wildcard
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: KOPIUR_HTTP_ADDR
            value: "[::]:8081"

  - it: renders the bind address from a custom metrics.port
    set:
      metrics.port: 9090
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: KOPIUR_HTTP_ADDR
            value: "[::]:9090"
      - equal:
          path: spec.template.spec.containers[0].ports[0].containerPort
          value: 9090

  - it: defaults the delete-job concurrency cap to uncapped (0)
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: KOPIUR_MAX_CONCURRENT_DELETE_JOBS
            value: "0"

  - it: renders a custom maxConcurrentDeleteJobs
    set:
      maxConcurrentDeleteJobs: 5
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: KOPIUR_MAX_CONCURRENT_DELETE_JOBS
            value: "5"

  # The apiserver-outage EMFILE fix: the reconcile cap defaults BOUNDED
  # (unlike the delete-job cap, which has batching as its primary protection).
  - it: defaults the reconcile concurrency cap to 8 per controller
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: KOPIUR_RECONCILE_CONCURRENCY
            value: "8"

  - it: renders reconcileConcurrency 0 (the explicit unbounded escape hatch)
    set:
      reconcileConcurrency: 0
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: KOPIUR_RECONCILE_CONCURRENCY
            value: "0"

  - it: renders the default controller probes
    asserts:
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.path
          value: /healthz
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.periodSeconds
          value: 15
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.path
          value: /readyz

  - it: lets a user retune a controller probe timing
    set:
      readinessProbe.periodSeconds: 30
    asserts:
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.periodSeconds
          value: 30

  - it: drops a controller probe when nulled out
    set:
      livenessProbe: null
    asserts:
      - isNull:
          path: spec.template.spec.containers[0].livenessProbe

  - it: appends the root extraEnv after the managed env
    set:
      extraEnv:
        - name: MY_EXTRA
          value: hello
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MY_EXTRA
            value: hello
