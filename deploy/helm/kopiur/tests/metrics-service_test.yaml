suite: metrics-service
templates:
  - metrics-service.tpl
tests:
  - it: always renders the controller metrics Service (no enable toggle)
    asserts:
      - isKind:
          of: Service
      - equal:
          path: metadata.name
          value: RELEASE-NAME-kopiur-controller-metrics
      - equal:
          path: spec.ports[0].port
          value: 8081

  - it: honors a custom metrics.port
    set:
      metrics.port: 9090
    asserts:
      - equal:
          path: spec.ports[0].port
          value: 9090
