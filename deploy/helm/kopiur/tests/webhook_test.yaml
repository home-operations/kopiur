suite: webhook
templates:
  - webhook-deployment.tpl
tests:
  - it: renders the webhook Deployment by default
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Deployment

  - it: omits the webhook Deployment when webhook.enabled is false
    set:
      webhook.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  # --- bind address + probes + extraEnv -------------------------------------

  - it: defaults the webhook bind address to the dual-stack wildcard
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: KOPIUR_WEBHOOK_ADDR
            value: "[::]:8443"

  - it: renders the webhook bind address from a custom webhook.port
    set:
      webhook.port: 9443
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: KOPIUR_WEBHOOK_ADDR
            value: "[::]:9443"
      - equal:
          path: spec.template.spec.containers[0].ports[0].containerPort
          value: 9443

  - it: renders the default webhook probes over HTTPS
    asserts:
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.scheme
          value: HTTPS
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.path
          value: /readyz

  - it: lets a user retune a webhook probe timing
    set:
      webhook.livenessProbe.periodSeconds: 30
    asserts:
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.periodSeconds
          value: 30

  - it: drops a webhook probe when nulled out
    set:
      webhook.readinessProbe: null
    asserts:
      - isNull:
          path: spec.template.spec.containers[0].readinessProbe

  - it: appends webhook.extraEnv after the managed env
    set:
      webhook.extraEnv:
        - name: MY_WEBHOOK_EXTRA
          value: hi
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MY_WEBHOOK_EXTRA
            value: hi
