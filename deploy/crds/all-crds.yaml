                          decodes as [`PvcAccessMode::Unknown`] and is rejected per-CR with the
                          value quoted (webhook + reconciler, via `validate_access_modes`) instead
                          of poisoning the typed watcher.
                        items:
                          description: A Kubernetes PersistentVolumeClaim access mode.
                          enum:
                          - ReadWriteOnce
                          - ReadOnlyMany
                          - ReadWriteMany
                          - ReadWriteOncePod
                          type: string
                        type: array
                      capacity:
                        description: Requested size of the new PVC (e.g. `100Gi`).
                        nullable: true
                        type: string
                      name:
                        description: Name of the PVC to create.
                        type: string
                      storageClassName:
                        description: StorageClass for the new PVC; absent uses the cluster default.
                        nullable: true
                        type: string
                    required:
                    - name
                    type: object
                  pvcRef:
                    description: Write into an existing PVC.
                    properties:
                      name:
                        description: Name of the referenced object.
                        type: string
                      namespace:
                        description: Namespace of the referenced object; absent = same namespace as the referrer.
                        nullable: true
                        type: string
                    required:
                    - name
                    type: object
                type: object
            required:
            - source
            - target
            type: object
            x-kubernetes-validations:
            - message: exactly one of target.pvc, target.pvcRef, target.populator
              rule: '[has(self.target.pvc), has(self.target.pvcRef), has(self.target.populator)].filter(x, x).size() == 1'
          status:
            description: Observed state of a Restore, written by the controller/mover.
            nullable: true
            properties:
              conditions:
                description: Standard Kubernetes conditions carrying the human-readable status/reason.
                items:
                  description: Condition contains details for one aspect of the current state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: lastTransitionTime is the last time the condition transitioned from one status to another. This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: message is a human readable message indicating details about the transition. This may be an empty string.
                      type: string
                    observedGeneration:
                      description: observedGeneration represents the .metadata.generation that the condition was set based upon. For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date with respect to the current state of the instance.
                      format: int64
                      type: integer
                    reason:
                      description: reason contains a programmatic identifier indicating the reason for the condition's last transition. Producers of specific condition types may define expected values and meanings for this field, and whether the values are considered a guaranteed API. The value should be a CamelCase string. This field may not be empty.
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              failure:
                description: Structured terminal-failure detail (kopia error class, stderr tail, retry hint).
                nullable: true
                properties:
                  exitCode:
                    description: The process exit code, if one was reported.
                    format: int32
                    nullable: true
                    type: integer
                  kopiaErrorClass:
                    description: kopia error class (e.g. `RepositoryUnavailable`, `AuthFailure`).
                    type: string
                  message:
                    description: 'A short human-readable message: what failed, why, and how to fix it.'
                    type: string
                  op:
                    description: |-
                      The mover operation that failed, as a stable label (e.g.
                      `repository connect`, `snapshot create`) — the values of the mover's
                      `KopiaOp::as_str()`. Distinguishes a repository-level connect failure
                      from a source-level failure (a broken PVC), which share
                      `kopiaErrorClass` values (e.g. `NotFound`). Absent on failures that
                      occurred outside a kopia invocation.
                    nullable: true
                    type: string
                  retryRecommended:
                    description: Whether retrying the same operation unchanged could succeed.
                    type: boolean
                  stderrTail:
                    description: |-
                      The last lines of kopia's stderr, if any were captured (bounded by
                      [`MAX_LOG_TAIL_BYTES`]).
                    nullable: true
                    type: string
                required:
                - kopiaErrorClass
                - message
                - retryRecommended
                type: object
              logTail:
                description: The last lines of the run's output, written by the mover at the terminal transition.
                nullable: true
                type: string
              observedGeneration:
                description: '`metadata.generation` last reconciled, so stale status is detectable.'
                format: int64
                nullable: true
                type: integer
              phase:
                description: Lifecycle phase of a restore.
                enum:
                - Pending
                - Resolving
                - Restoring
                - Completed
                - Failed
                nullable: true
                type: string
              progress:
                description: Bytes/files restored so far, patched periodically by the mover.
                nullable: true
                properties:
                  bytesRestored:
                    description: Total bytes restored so far.
                    format: int64
                    nullable: true
                    type: integer
                  filesRestored:
                    description: Total files restored so far.
                    format: int64
                    nullable: true
                    type: integer
                type: object
              resolved:
                description: The source resolved and pinned at admission; never re-resolved.
                nullable: true
                properties:
                  identity:
                    description: The resolved kopia identity (`username@hostname:path`) of the snapshot.
                    nullable: true
                    properties:
                      hostname:
                        description: The final `hostname` kopia records, fixed at admission.
                        type: string
                      sourcePath:
                        description: The resolved snapshot source path, when applicable (`username@hostname:path`).
                        nullable: true
                        type: string
                      username:
                        description: The final `username` kopia records, fixed at admission.
                        type: string
                    required:
                    - hostname
                    - username
                    type: object
                  kopiaSnapshotID:
                    description: The exact kopia snapshot manifest id the source resolved to; pinned once.
                    nullable: true
                    type: string
                  pinnedAt:
                    description: Timestamp at which the source was pinned (RFC3339).
                    nullable: true
                    type: string
                  repository:
                    description: The repository the snapshot lives in, resolved from the source.
                    nullable: true
                    properties:
                      kind:
                        default: Repository
                        description: Which repository CRD this points at; defaults to [`RepositoryKind::Repository`].
                        enum:
                        - Repository
                        - ClusterRepository
                        type: string
                      name:
                        description: Name of the referenced `Repository`/`ClusterRepository`.
                        type: string
                      namespace:
                        description: Cross-namespace `Repository` reference; ignored/forbidden for `ClusterRepository`.
                        nullable: true
                        type: string
                    required:
                    - name
                    type: object
                  resolution:
                    description: Which outcome the source resolution pinned, once and never re-resolved.
                    enum:
                    - Snapshot
                    - NoSnapshot
                    nullable: true
                    type: string
                  snapshotRef:
                    description: The concrete `Snapshot` CR the source resolved to, when applicable.
                    nullable: true
                    properties:
                      name:
                        description: Name of the referenced object.
                        type: string
                      namespace:
                        description: Namespace of the referenced object; absent = same namespace as the referrer.
                        nullable: true
                        type: string
                    required:
                    - name
                    type: object
                type: object
              sourceKind:
                description: The pinned source kind (`SnapshotRef`/`FromPolicy`/`Identity`); backs the `SOURCE` printer column.
                nullable: true
                type: string
              target:
                description: Resolved target details (the PVC written to / populator handshake).
                nullable: true
                properties:
                  pvcPrime:
                    description: Populator handshake (passive / pvc-create modes).
                    nullable: true
                    type: string
                  pvcRef:
                    description: The PVC actually written to (created or pre-existing).
                    nullable: true
                    properties:
                      name:
                        description: Name of the referenced object.
                        type: string
                      namespace:
                        description: Namespace of the referenced object; absent = same namespace as the referrer.
                        nullable: true
                        type: string
                    required:
                    - name
                    type: object
                type: object
              timing:
                description: Start/end timestamps for the restore run.
                nullable: true
                properties:
                  endTime:
                    description: When the restore reached a terminal phase (RFC3339).
                    nullable: true
                    type: string
                  startTime:
                    description: When the mover began restoring (RFC3339).
                    nullable: true
                    type: string
                type: object
              waitStartedAt:
                description: |-
                  When the `policy.waitTimeout` window OPENED (RFC3339) — the first reconcile on which
                  the restore could actually proceed (its repository reached `Ready`, and for a
                  `target.populator` a PVC already claims it), NOT when the Restore was created. The
                  window does NOT open while the referenced `Repository` object or `fromPolicy`
                  `SnapshotPolicy` doesn't exist: the restore parks in `Pending`
                  (`ReferentAvailable=False`, reason `RestoreReferentMissing`) and stays unstamped. It
                  DOES still open for a `snapshotRef` whose `Snapshot` row doesn't exist yet (so
                  `onMissingSnapshot` can fire for a ref that never appears) and for a restore whose
                  mover Job already launched. Stamped once and then honored verbatim, so the window
                  survives controller restarts and Job pod retries; cleared when a populator re-opens
                  resolution for a re-created claim, so that claim gets the full window again. Absent
                  means the window has not opened yet (or no `policy.waitTimeout` is configured, in
                  which case there is no window to anchor).
                nullable: true
                type: string
            type: object
        required:
        - spec
        title: Restore
        type: object
    served: true
    storage: true
    subresources:
      status: {}
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: maintenances.kopiur.home-operations.com
spec:
  group: kopiur.home-operations.com
  names:
    categories:
    - kopiur
    kind: Maintenance
    plural: maintenances
    shortNames:
    - kopiamaint
    singular: maintenance
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.repository.name
      name: Repository
      type: string
    - jsonPath: .status.ownership.owner
      name: Owner
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Auto-generated derived type for MaintenanceSpec via `CustomResource`
        properties:
          spec:
            description: |-
              Maintenance schedule and ownership lease for one `Repository`/`ClusterRepository`.

              Not `Eq`: `mover` transitively embeds k8s-openapi types.
            properties:
              credentialProjection:
                description: Opt-in projection of the repository's credential Secret(s) into this run's namespace (default off).
                nullable: true
                properties:
                  enabled:
                    default: false
                    description: Copy the repository's credential Secret(s) into the namespace of each mover Job; off by default.
                    type: boolean
                type: object
              failurePolicy:
                description: How a failed maintenance run is retried and bounded (backoff, deadline).
                nullable: true
                properties:
                  activeDeadlineSeconds:
                    description: Mover `Job.spec.activeDeadlineSeconds` — wall-clock cap after which a running run is killed.
                    format: int64
                    nullable: true
                    type: integer
                  backoffLimit:
                    description: Mover `Job.spec.backoffLimit` — retries before a failed run is marked failed.
                    format: int32
                    nullable: true
                    type: integer
                  podStartupDeadlineSeconds:
                    description: Seconds a non-starting (wedged) mover pod may sit before the run is failed; default 300s.
                    format: int64
                    nullable: true
                    type: integer
                type: object
              mover:
                description: Mover (Job pod) overrides for the maintenance run.
                nullable: true
                properties:
                  cache:
                    description: Override the repository's [`CacheDefaults`] for this recipe's movers.
                    nullable: true
                    properties:
                      capacity:
                        description: Size of the PVC backing the mover's kopia cache (e.g. `10Gi`).
                        nullable: true
                        type: string
                      contentCacheSizeMb:
                        description: kopia content cache budget in MiB (`--content-cache-size-mb`).
                        format: int64
                        nullable: true
                        type: integer
                      metadataCacheSizeMb:
                        description: kopia metadata cache budget in MiB (`--metadata-cache-size-mb`).
                        format: int64
                        nullable: true
                        type: integer
                      mode:
                        description: How a mover's kopia cache volume is provisioned.
                        enum:
                        - Ephemeral
                        - Persistent
                        nullable: true
                        type: string
                      storageClassName:
                        description: StorageClass for the cache PVC; absent uses the cluster default.
                        nullable: true
                        type: string
                    type: object
                  inheritSecurityContextFrom:
                    description: |-
                      Copy the UID/GID security context from a live workload rather than hard-coding it.

                      Requires the workload to pin `runAsUser` (container or pod level): a UID that comes
                      from the container image's `USER` line is invisible in the pod spec and cannot be
                      inherited — the mover would silently run as its own image's UID instead.

                      May be combined with `securityContext`/`podSecurityContext`, which override it
                      field-wise and act as the fallback when no workload pod can be resolved.
                    nullable: true
                    oneOf:
                    - required:
                      - workloadSelector
                    - required:
                      - pvcConsumer
                    - required:
                      - snapshot
                    properties:
                      pvcConsumer:
                        description: 'Backup sources only: auto-derive the workload from the PVC this snapshot backs up.'
                        properties:
                          container:
                            description: Which container within the matched consumer pod to inherit from; absent uses the first/only.
                            nullable: true
                            type: string
                        type: object
                      snapshot:
                        description: |-
                          Restores only: inherit the identity RECORDED on the backup itself
                          (`Snapshot.status.recorded`, decoded from the `kopiur-meta` kopia tag) —
                          uid/gid/fsGroup the backup mover actually ran as. Needs no live workload
                          pod, so it works on a rebuilt cluster and with `target.populator`.
                          Rejected at admission on SnapshotPolicy/Maintenance (backups read the
                          live workload; maintenance has no snapshot). Write it as `snapshot: {}`
                          (an empty sub-object) — a bare `snapshot:` is null and rejected.
                        type: object
                      workloadSelector:
                        description: Inherit from workload pod(s) matched by an explicit label selector (backup or restore).
                        properties:
                          container:
                            description: Which container within the matched pod; absent uses the first/only container.
                            nullable: true
                            type: string
                          podSelector:
                            description: Label selector matching the workload pod(s) to read context/hooks from.
                            properties:
                              matchExpressions:
                                description: matchExpressions is a list of label selector requirements. The requirements are ANDed.
                                items:
                                  description: A label selector requirement is a selector that contains values, a key, and an operator that relates the key and values.
                                  properties:
                                    key:
                                      description: key is the label key that the selector applies to.
                                      type: string
                                    operator:
                                      description: operator represents a key's relationship to a set of values. Valid operators are In, NotIn, Exists and DoesNotExist.
                                      type: string
                                    values:
                                      description: values is an array of string values. If the operator is In or NotIn, the values array must be non-empty. If the operator is Exists or DoesNotExist, the values array must be empty. This array is replaced during a strategic merge patch.
                                      items:
                                        type: string
                                      type: array
                                  required:
                                  - key
                                  - operator
                                  type: object
                                type: array
                              matchLabels:
                                additionalProperties:
                                  type: string
                                description: matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels map is equivalent to an element of matchExpressions, whose key field is "key", the operator is "In", and the values array contains only "value". The requirements are ANDed.
                                type: object
                            type: object
                        required:
                        - podSelector
                        type: object
                    type: object
                  podSecurityContext:
                    description: |-
                      Pod security context for the mover (notably `fsGroup` for group-writable restore
                      volumes). Same layering as `securityContext`: highest layer, merged field-wise, and
                      combinable with `inheritSecurityContextFrom`.
                    nullable: true
                    properties:
                      appArmorProfile:
                        description: appArmorProfile is the AppArmor options to use by the containers in this pod. Note that this field cannot be set when spec.os.name is windows.
                        properties:
                          localhostProfile:
                            description: localhostProfile indicates a profile loaded on the node that should be used. The profile must be preconfigured on the node to work. Must match the loaded name of the profile. Must be set if and only if type is "Localhost".
                            type: string
                          type:
                            description: |-
                              type indicates which kind of AppArmor profile will be applied. Valid options are:
                                Localhost - a profile pre-loaded on the node.
                                RuntimeDefault - the container runtime's default profile.
                                Unconfined - no AppArmor enforcement.
                            type: string
                        required:
                        - type
                        type: object
                      fsGroup:
                        description: |-
                          A special supplemental group that applies to all containers in a pod. Some volume types allow the Kubelet to change the ownership of that volume to be owned by the pod:

                          1. The owning GID will be the FSGroup 2. The setgid bit is set (new files created in the volume will be owned by FSGroup) 3. The permission bits are OR'd with rw-rw----

                          If unset, the Kubelet will not modify the ownership and permissions of any volume. Note that this field cannot be set when spec.os.name is windows.
                        format: int64
                        type: integer
                      fsGroupChangePolicy:
                        description: 'fsGroupChangePolicy defines behavior of changing ownership and permission of the volume before being exposed inside Pod. This field will only apply to volume types which support fsGroup based ownership(and permissions). It will have no effect on ephemeral volume types such as: secret, configmaps and emptydir. Valid values are "OnRootMismatch" and "Always". If not specified, "Always" is used. Note that this field cannot be set when spec.os.name is windows.'
                        type: string
                      runAsGroup:
                        description: The GID to run the entrypoint of the container process. Uses runtime default if unset. May also be set in SecurityContext.  If set in both SecurityContext and PodSecurityContext, the value specified in SecurityContext takes precedence for that container. Note that this field cannot be set when spec.os.name is windows.
                        format: int64
                        type: integer
                      runAsNonRoot:
                        description: Indicates that the container must run as a non-root user. If true, the Kubelet will validate the image at runtime to ensure that it does not run as UID 0 (root) and fail to start the container if it does. If unset or false, no such validation will be performed. May also be set in SecurityContext.  If set in both SecurityContext and PodSecurityContext, the value specified in SecurityContext takes precedence.
                        type: boolean
                      runAsUser:
                        description: The UID to run the entrypoint of the container process. Defaults to user specified in image metadata if unspecified. May also be set in SecurityContext.  If set in both SecurityContext and PodSecurityContext, the value specified in SecurityContext takes precedence for that container. Note that this field cannot be set when spec.os.name is windows.
                        format: int64
                        type: integer
                      seLinuxChangePolicy:
                        description: |-
                          seLinuxChangePolicy defines how the container's SELinux label is applied to all volumes used by the Pod. It has no effect on nodes that do not support SELinux or to volumes does not support SELinux. Valid values are "MountOption" and "Recursive".

                          "Recursive" means relabeling of all files on all Pod volumes by the container runtime. This may be slow for large volumes, but allows mixing privileged and unprivileged Pods sharing the same volume on the same node.

                          "MountOption" mounts all eligible Pod volumes with `-o context` mount option. This requires all Pods that share the same volume to use the same SELinux label. It is not possible to share the same volume among privileged and unprivileged Pods. Eligible volumes are in-tree FibreChannel and iSCSI volumes, and all CSI volumes whose CSI driver announces SELinux support by setting spec.seLinuxMount: true in their CSIDriver instance. Other volumes are always re-labelled recursively. "MountOption" value is allowed only when SELinuxMount feature gate is enabled.

                          If not specified and SELinuxMount feature gate is enabled, "MountOption" is used. If not specified and SELinuxMount feature gate is disabled, "MountOption" is used for ReadWriteOncePod volumes and "Recursive" for all other volumes.

                          This field affects only Pods that have SELinux label set, either in PodSecurityContext or in SecurityContext of all containers.

                          All Pods that use the same volume should use the same seLinuxChangePolicy, otherwise some pods can get stuck in ContainerCreating state. Note that this field cannot be set when spec.os.name is windows.
                        type: string
                      seLinuxOptions:
                        description: The SELinux context to be applied to all containers. If unspecified, the container runtime will allocate a random SELinux context for each container.  May also be set in SecurityContext.  If set in both SecurityContext and PodSecurityContext, the value specified in SecurityContext takes precedence for that container. Note that this field cannot be set when spec.os.name is windows.
                        properties:
                          level:
                            description: Level is SELinux level label that applies to the container.
                            type: string
                          role:
                            description: Role is a SELinux role label that applies to the container.
                            type: string
                          type:
                            description: Type is a SELinux type label that applies to the container.
                            type: string
                          user:
                            description: User is a SELinux user label that applies to the container.
                            type: string
                        type: object
                      seccompProfile:
                        description: The seccomp options to use by the containers in this pod. Note that this field cannot be set when spec.os.name is windows.
                        properties:
                          localhostProfile:
                            description: localhostProfile indicates a profile defined in a file on the node should be used. The profile must be preconfigured on the node to work. Must be a descending path, relative to the kubelet's configured seccomp profile location. Must be set if type is "Localhost". Must NOT be set for any other type.
                            type: string
                          type:
                            description: |-
                              type indicates which kind of seccomp profile will be applied. Valid options are:

                              Localhost - a profile defined in a file on the node should be used. RuntimeDefault - the container runtime default profile should be used. Unconfined - no profile should be applied.
                            type: string
                        required:
                        - type
                        type: object
                      supplementalGroups:
                        description: A list of groups applied to the first process run in each container, in addition to the container's primary GID and fsGroup (if specified).  If the SupplementalGroupsPolicy feature is enabled, the supplementalGroupsPolicy field determines whether these are in addition to or instead of any group memberships defined in the container image. If unspecified, no additional groups are added, though group memberships defined in the container image may still be used, depending on the supplementalGroupsPolicy field. Note that this field cannot be set when spec.os.name is windows.
                        items:
                          format: int64
                          type: integer
                        type: array
                      supplementalGroupsPolicy:
                        description: Defines how supplemental groups of the first container processes are calculated. Valid values are "Merge" and "Strict". If not specified, "Merge" is used. (Alpha) Using the field requires the SupplementalGroupsPolicy feature gate to be enabled and the container runtime must implement support for this feature. Note that this field cannot be set when spec.os.name is windows.
                        type: string
                      sysctls:
                        description: Sysctls hold a list of namespaced sysctls used for the pod. Pods with unsupported sysctls (by the container runtime) might fail to launch. Note that this field cannot be set when spec.os.name is windows.
                        items:
                          description: Sysctl defines a kernel parameter to be set
                          properties:
                            name:
                              description: Name of a property to set
                              type: string
                            value:
                              description: Value of a property to set
                              type: string
                          required:
                          - name
                          - value
                          type: object
                        type: array
                      windowsOptions:
                        description: The Windows specific settings applied to all containers. If unspecified, the options within a container's SecurityContext will be used. If set in both SecurityContext and PodSecurityContext, the value specified in SecurityContext takes precedence. Note that this field cannot be set when spec.os.name is linux.
                        properties:
                          gmsaCredentialSpec:
                            description: GMSACredentialSpec is where the GMSA admission webhook (https://github.com/kubernetes-sigs/windows-gmsa) inlines the contents of the GMSA credential spec named by the GMSACredentialSpecName field.
                            type: string
                          gmsaCredentialSpecName:
                            description: GMSACredentialSpecName is the name of the GMSA credential spec to use.
                            type: string
                          hostProcess:
                            description: HostProcess determines if a container should be run as a 'Host Process' container. All of a Pod's containers must have the same effective HostProcess value (it is not allowed to have a mix of HostProcess containers and non-HostProcess containers). In addition, if HostProcess is true then HostNetwork must also be set to true.
                            type: boolean
                          runAsUserName:
                            description: The UserName in Windows to run the entrypoint of the container process. Defaults to the user specified in image metadata if unspecified. May also be set in PodSecurityContext. If set in both SecurityContext and PodSecurityContext, the value specified in SecurityContext takes precedence.
                            type: string
                        type: object
                    type: object
                  privilegedMode:
                    description: Opt-in, namespace-gated privileged mode; preserves UID/GID on restore.
                    nullable: true
                    type: boolean
                  resources:
                    description: Resource requests/limits for the mover container.
                    nullable: true
                    properties:
                      claims:
                        description: |-
                          Claims lists the names of resources, defined in spec.resourceClaims, that are used by this container.

                          This is an alpha field and requires enabling the DynamicResourceAllocation feature gate.

                          This field is immutable. It can only be set for containers.
                        items:
                          description: ResourceClaim references one entry in PodSpec.ResourceClaims.
                          properties:
                            name:
                              description: Name must match the name of one entry in pod.spec.resourceClaims of the Pod where this field is used. It makes that resource available inside a container.
                              type: string
                            request:
                              description: Request is the name chosen for a request in the referenced claim. If empty, everything from the claim is made available, otherwise only the result of this request.
                              type: string
                          required:
                          - name
                          type: object
                        type: array
                      limits:
                        additionalProperties:
                          description: "Quantity is a fixed-point representation of a number. It provides convenient marshaling/unmarshaling in JSON and YAML, in addition to String() and AsInt64() accessors.\n\nThe serialization format is:\n\n``` <quantity>        ::= <signedNumber><suffix>\n\n\t(Note that <suffix> may be empty, from the \"\" case in <decimalSI>.)\n\n<digit>           ::= 0 | 1 | ... | 9 <digits>          ::= <digit> | <digit><digits> <number>          ::= <digits> | <digits>.<digits> | <digits>. | .<digits> <sign>            ::= \"+\" | \"-\" <signedNumber>    ::= <number> | <sign><number> <suffix>          ::= <binarySI> | <decimalExponent> | <decimalSI> <binarySI>        ::= Ki | Mi | Gi | Ti | Pi | Ei\n\n\t(International System of units; See: http://physics.nist.gov/cuu/Units/binary.html)\n\n<decimalSI>       ::= m | \"\" | k | M | G | T | P | E\n\n\t(Note that 1024 = 1Ki but 1000 = 1k; I didn't choose the capitalization.)\n\n<decimalExponent> ::= \"e\" <signedNumber> | \"E\" <signedNumber> ```\n\nNo matter which of the three exponent forms is used, no quantity may represent a number greater than 2^63-1 in magnitude, nor may it have more than 3 decimal places. Numbers larger or more precise will be capped or rounded up. (E.g.: 0.1m will rounded up to 1m.) This may be extended in the future if we require larger or smaller quantities.\n\nWhen a Quantity is parsed from a string, it will remember the type of suffix it had, and will use the same type again when it is serialized.\n\nBefore serializing, Quantity will be put in \"canonical form\". This means that Exponent/suffix will be adjusted up or down (with a corresponding increase or decrease in Mantissa) such that:\n\n- No precision is lost - No fractional digits will be emitted - The exponent (or suffix) is as large as possible.\n\nThe sign will be omitted unless the number is negative.\n\nExamples:\n\n- 1.5 will be serialized as \"1500m\" - 1.5Gi will be serialized as \"1536Mi\"\n\nNote that the quantity will NEVER be internally represented by a floating point number. That is the whole point of this exercise.\n\nNon-canonical values will still parse as long as they are well formed, but will be re-emitted in their canonical form. (So always use canonical form, or don't diff.)\n\nThis format is intended to make it difficult to use these numbers without writing some sort of special handling code in the hopes that that will cause implementors to also use a fixed point implementation."
