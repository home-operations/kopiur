apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: snapshotreplications.kopiur.home-operations.com
spec:
  group: kopiur.home-operations.com
  names:
    categories:
    - kopiur
    kind: SnapshotReplication
    plural: snapshotreplications
    shortNames:
    - kopiasrepl
    singular: snapshotreplication
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.sourceRef.name
      name: Source
      type: string
    - jsonPath: .spec.destinationRef.name
      name: Destination
      type: string
    - jsonPath: .spec.schedule.cron
      name: Schedule
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.lastReplicated
      name: Last
      type: date
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Auto-generated derived type for SnapshotReplicationSpec via `CustomResource`
        properties:
          spec:
            description: |-
              Copy selected snapshots from a source repository into a destination repository on a schedule (`kopia snapshot migrate`).

              Not `Eq`: `mover` transitively embeds k8s-openapi types.
            properties:
              credentialProjection:
                description: |-
                  Opt-in projection of BOTH repositories' credential Secrets into the mover
                  Job's namespace (required when the destination is a `ClusterRepository`
                  whose Secrets live elsewhere).
                nullable: true
                properties:
                  enabled:
                    default: false
                    description: Copy the repository's credential Secret(s) into the namespace of each mover Job; off by default.
                    type: boolean
                type: object
              destinationRef:
                description: |-
                  The `Repository` or `ClusterRepository` snapshots are copied INTO. A real
                  repository CR with its own password and format (unlike a
                  `RepositoryReplication` destination, which is a bare backend reusing the
                  source's password). Must not resolve to the same repository as `sourceRef`
                  (webhook-enforced structurally; the shared validator catches the literal
                  same-ref case at admission).
                properties:
                  kind:
                    default: Repository
                    description: Which repository CRD this points at; defaults to [`RepositoryKind::Repository`].
                    enum:
                    - Repository
                    - ClusterRepository
                    type: string
                  name:
                    description: Name of the referenced `Repository`/`ClusterRepository`.
                    type: string
                  namespace:
                    description: Cross-namespace `Repository` reference; ignored/forbidden for `ClusterRepository`.
                    nullable: true
                    type: string
                required:
                - name
                type: object
              migrate:
                description: |-
                  Tuning for the underlying `kopia snapshot migrate` invocation. Absent:
                  sequential copy, and NO policy copying (see [`PolicyCopyMode`]).
                nullable: true
                properties:
                  parallel:
                    description: |-
                      `--parallel`: number of snapshots migrated concurrently (kopia default
                      `1` — sequential). Must be >= 1 when set.
                    format: uint32
                    minimum: 0.0
                    nullable: true
                    type: integer
                  policies:
                    default: none
                    description: |-
                      Whether kopia **policies** attached to the copied sources are also copied
                      to the destination. Defaults to [`PolicyCopyMode::None`].
                    enum:
                    - none
                    - copy
                    - copyOverwrite
                    type: string
                  throttle:
                    description: |-
                      Bandwidth/ops caps for THIS replication's runs, per side. `snapshot
                      migrate` has no speed flags, so each side is applied as `kopia repository
                      throttle set` on that side's connection; `source` overrides the source
                      repository's `moverDefaults.throttle` and `destination` the destination
                      repository's, field by field (a field left unset keeps that repository's
                      default). Absent: both sides use their repository's defaults.
                    nullable: true
                    properties:
                      destination:
                        description: |-
                          Caps for the DESTINATION (write) side, overriding the destination
                          repository's `moverDefaults.throttle` field by field. Applied with
                          `repository throttle set` on the destination connection the migrate
                          writes through.
                        nullable: true
                        properties:
                          downloadBytesPerSecond:
                            description: Cap download throughput in bytes/sec (`--download-bytes-per-second`).
                            format: int64
                            nullable: true
                            type: integer
                          readOpsPerSecond:
                            description: Cap read/list ops/sec (`--read-requests-per-second`).
                            format: int64
                            nullable: true
                            type: integer
                          uploadBytesPerSecond:
                            description: Cap upload throughput in bytes/sec (`--upload-bytes-per-second`).
                            format: int64
                            nullable: true
                            type: integer
                          writeOpsPerSecond:
                            description: Cap write ops/sec (`--write-requests-per-second`).
                            format: int64
                            nullable: true
                            type: integer
                        type: object
                      source:
                        description: |-
                          Caps for the SOURCE (read) side, overriding the source repository's
                          `moverDefaults.throttle` field by field. Applied with `repository
                          throttle set` on the migrate's read-only source connection — accepted
                          there, so a read-only source is throttled like any other.
                        nullable: true
                        properties:
                          downloadBytesPerSecond:
                            description: Cap download throughput in bytes/sec (`--download-bytes-per-second`).
                            format: int64
                            nullable: true
                            type: integer
                          readOpsPerSecond:
                            description: Cap read/list ops/sec (`--read-requests-per-second`).
                            format: int64
                            nullable: true
                            type: integer
                          uploadBytesPerSecond:
                            description: Cap upload throughput in bytes/sec (`--upload-bytes-per-second`).
                            format: int64
                            nullable: true
                            type: integer
                          writeOpsPerSecond:
                            description: Cap write ops/sec (`--write-requests-per-second`).
                            format: int64
                            nullable: true
                            type: integer
                        type: object
                    type: object
                type: object
              mover:
                description: Mover (Job pod) overrides for the replication run.
                nullable: true
                properties:
                  cache:
                    description: Override the repository's [`CacheDefaults`] for this recipe's movers.
                    nullable: true
                    properties:
                      capacity:
                        description: Size of the PVC backing the mover's kopia cache (e.g. `10Gi`).
                        nullable: true
                        type: string
                      contentCacheSizeMb:
                        description: kopia content cache budget in MiB (`--content-cache-size-mb`).
                        format: int64
                        nullable: true
                        type: integer
                      metadataCacheSizeMb:
                        description: kopia metadata cache budget in MiB (`--metadata-cache-size-mb`).
                        format: int64
                        nullable: true
                        type: integer
                      mode:
                        description: How a mover's kopia cache volume is provisioned.
                        enum:
                        - Ephemeral
                        - Persistent
                        nullable: true
                        type: string
                      storageClassName:
                        description: StorageClass for the cache PVC; absent uses the cluster default.
                        nullable: true
                        type: string
                    type: object
                  inheritSecurityContextFrom:
                    description: |-
                      Copy the UID/GID security context from a live workload rather than hard-coding it.

                      Requires the workload to pin `runAsUser` (container or pod level): a UID that comes
                      from the container image's `USER` line is invisible in the pod spec and cannot be
                      inherited — the mover would silently run as its own image's UID instead.

                      May be combined with `securityContext`/`podSecurityContext`, which override it
                      field-wise and act as the fallback when no workload pod can be resolved.
                    nullable: true
                    oneOf:
                    - required:
                      - workloadSelector
                    - required:
                      - pvcConsumer
                    - required:
                      - snapshot
                    properties:
