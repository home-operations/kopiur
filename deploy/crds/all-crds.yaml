              rule: '(has(self.repository) ? 1 : 0) + (has(self.repositories) ? 1 : 0) == 1'
          status:
            description: Observed state of a `SnapshotPolicy`.
            nullable: true
            properties:
              adoption:
                description: Summary of automatic adoption of discovered snapshots into this recipe.
                nullable: true
                properties:
                  lastAdoptedCount:
                    description: Number of discovered `Snapshot` CRs adopted by the last adoption pass.
                    format: uint32
                    minimum: 0.0
                    nullable: true
                    type: integer
                  lastAdoptionAt:
                    description: RFC3339 timestamp of the last adoption pass that adopted at least one snapshot.
                    nullable: true
                    type: string
                  lastScanMatched:
                    description: |-
                      Discovered snapshots whose kopia identity matched this policy at the most
                      recent adoption pass, counted BEFORE the own-id and retention filters —
                      so it reads "history relevant to me exists in the catalog", independent
                      of whether that pass adopted anything. A multi-repository policy SUMS
                      this across the ready repositories of the pass. `0` together with
                      `lastScanUnmatched: 0` means the catalog was empty at that pass; absent
                      means no adoption pass has run yet. Neutral inventory, not a verdict:
                      `0` matched beside a non-zero `lastScanUnmatched` is the ordinary shape
                      of a new policy on a shared repository, and is also what a
                      post-disaster-recovery identity mismatch looks like — compare
                      `status.resolved.identity` with the pre-disaster configuration to tell
                      them apart.
                    format: uint32
                    minimum: 0.0
                    nullable: true
                    type: integer
                  lastScanUnmatched:
                    description: |-
                      Discovered snapshots the most recent adoption pass saw that did NOT match
                      this policy's identity (other policies' or other clusters' history in a
                      shared repository). Same counting rules as `lastScanMatched`: pre-filter,
                      summed across a multi-repository policy's ready repositories, `0`/`0`
                      for an empty catalog, absent when no pass has run.
                    format: uint32
                    minimum: 0.0
                    nullable: true
                    type: integer
                  scanRequestedAt:
                    description: |-
                      RFC3339 token echoing an in-flight on-demand adoption scan request for
                      this policy's identity; cleared once honored.
                    nullable: true
                    type: string
                  scanRequestedIdentity:
                    description: |-
                      The resolved kopia identity the requested scan was scoped to, pinned at
                      request time so a later identity-changing edit can't retarget an
                      in-flight scan.
                    nullable: true
                    type: string
                  skippedByRetention:
                    description: |-
                      Identity-matching discovered snapshots the last adoption pass left
                      discovered because `spec.retention` would prune them immediately under
                      the effective `deletionPolicy` (`Retain`/`Orphan` — a CR-only prune that
                      would re-discover and re-adopt forever). `0`/absent when nothing was
                      withheld. See the `AdoptionSkippedByRetention` event for the levers.
                    format: uint32
                    minimum: 0.0
                    nullable: true
                    type: integer
                  totalAdopted:
                    description: Running total of `Snapshot` CRs ever adopted into this recipe.
                    format: uint64
                    minimum: 0.0
                    nullable: true
                    type: integer
                type: object
              conditions:
                description: Standard Kubernetes conditions (e.g. `RepositoryReachable`, `GroupSnapshotSupported`).
                items:
                  description: Condition contains details for one aspect of the current state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: lastTransitionTime is the last time the condition transitioned from one status to another. This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: message is a human readable message indicating details about the transition. This may be an empty string.
                      type: string
                    observedGeneration:
                      description: observedGeneration represents the .metadata.generation that the condition was set based upon. For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date with respect to the current state of the instance.
                      format: int64
                      type: integer
                    reason:
                      description: reason contains a programmatic identifier indicating the reason for the condition's last transition. Producers of specific condition types may define expected values and meanings for this field, and whether the values are considered a guaranteed API. The value should be a CamelCase string. This field may not be empty.
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              lastSuccessfulSnapshot:
                description: RFC3339 timestamp of the most recent successful child `Snapshot` from this recipe.
                nullable: true
                type: string
              lastVerified:
                description: |-
                  RFC3339 timestamp of the most recent successful verification (any tier).
                  Single-repo: stamped directly by the verify mover. Multi-repo: computed
                  by the controller as the MINIMUM `lastVerified` across the CURRENT
                  repositories ("everything is verified as of T"), absent until every
                  current repository has verified at least once.
                nullable: true
                type: string
              observedGeneration:
                description: '`metadata.generation` last reconciled, for staleness detection.'
                format: int64
                nullable: true
                type: integer
              repositorySummary:
                description: |-
                  Human-readable summary of the policy's repository target(s) for the
                  `Repositories` print column: the comma-joined repository names (the one
                  name for the single-repo shape), capped near a kubectl column width
                  with a `+N` overflow marker. Written by the controller.
                nullable: true
                type: string
              resolved:
                description: What would be passed to kopia — pinned at admission.
                nullable: true
                properties:
                  identity:
                    description: The resolved `username@hostname` identity.
                    nullable: true
                    properties:
                      hostname:
                        description: The final `hostname` kopia records, fixed at admission.
                        type: string
                      sourcePath:
                        description: The resolved snapshot source path, when applicable (`username@hostname:path`).
                        nullable: true
                        type: string
                      username:
                        description: The final `username` kopia records, fixed at admission.
                        type: string
                    required:
                    - hostname
                    - username
                    type: object
                  repositories:
                    description: |-
                      Per-repository resolution for a MULTI-repository policy
                      (`spec.repositories`): one entry per member, each carrying the identity
                      resolved under THAT repository's `identityDefaults` (the unit of
                      identity is the `(repository, identity)` pair — N members means N
                      independent kopia lineages). Empty — and elided from the wire — for the
                      classic single-repo shape, whose resolution stays in the top-level
                      `identity`/`sources` fields exactly as before this field existed.
                    items:
                      description: |-
                        One member repository's resolution within a multi-repository policy: which
                        repository, and what kopia identity this policy resolves to **under that
                        repository's `identityDefaults`**. Consumed by the admission fork guard as
                        the per-repo baseline (`repo_key` → previously-resolved identity), so an
                        edit that would re-identify ONE member's lineage is caught even though the
                        other members are unaffected.
                      properties:
                        identity:
                          description: |-
                            The `username@hostname` identity resolved under this repository's
                            `identityDefaults`; absent when it could not be resolved (the guard
                            treats an absent baseline as "no baseline" and degrades to allow for
                            that member only).
                          nullable: true
                          properties:
                            hostname:
                              description: The final `hostname` kopia records, fixed at admission.
                              type: string
                            sourcePath:
                              description: The resolved snapshot source path, when applicable (`username@hostname:path`).
                              nullable: true
                              type: string
                            username:
                              description: The final `username` kopia records, fixed at admission.
                              type: string
                          required:
                          - hostname
                          - username
                          type: object
                        repository:
                          description: |-
                            The member repository this entry resolves for (by value, as listed in
                            `spec.repositories`).
                          properties:
                            kind:
                              default: Repository
                              description: Which repository CRD this points at; defaults to [`RepositoryKind::Repository`].
                              enum:
                              - Repository
                              - ClusterRepository
                              type: string
                            name:
                              description: Name of the referenced `Repository`/`ClusterRepository`.
                              type: string
                            namespace:
                              description: Cross-namespace `Repository` reference; ignored/forbidden for `ClusterRepository`.
                              nullable: true
                              type: string
                          required:
                          - name
                          type: object
                      required:
                      - repository
                      type: object
                    type: array
                  sources:
                    description: The concrete PVCs + source paths after selector expansion.
                    items:
                      description: One resolved source — a concrete PVC and the path kopia records for it.
                      properties:
                        pvc:
                          description: '`namespace/name` of the PVC, as kopia sees it.'
                          nullable: true
                          type: string
                        sourcePath:
                          description: The source path kopia records for this PVC.
                          nullable: true
                          type: string
                      type: object
                    type: array
                type: object
              retention:
                description: Summary of GFS retention pruning against this config's `Snapshot` CRs.
                nullable: true
                properties:
                  activeSnapshotCount:
                    description: CRs currently inside the GFS window.
                    format: int64
                    nullable: true
                    type: integer
                  lastPruneAt:
                    description: RFC3339 timestamp of the last prune pass.
                    nullable: true
                    type: string
                  lastPruneDeleted:
                    description: Number of `Snapshot` CRs deleted by the last prune pass.
                    format: int64
                    nullable: true
                    type: integer
                type: object
              verification:
                description: |-
                  Per-repository verification records for a multi-repository policy
                  (#368): one entry per CURRENT `spec.repositories` member, maintained by
                  the controller (single writer — entries for repositories no longer in
                  the spec are pruned). Empty (elided) for the single-repo shape, whose
                  wire stays byte-identical.
                items:
                  description: |-
                    One repository's verification record on a multi-repository policy
                    (`status.verification`). Entry-keyed by the (normalized) repository ref so
                    per-repo verify results never collapse into one flat timestamp.
                  properties:
                    lastVerified:
                      description: |-
                        RFC3339 timestamp of the most recent successful verification (any tier)
                        against THIS repository; absent until its first successful verify.
                      nullable: true
                      type: string
                    repository:
                      description: |-
                        The repository this record covers, normalized
                        ([`normalized_repository_ref`](crate::common::normalized_repository_ref))
                        so it re-resolves from anywhere.
                      properties:
                        kind:
                          default: Repository
                          description: Which repository CRD this points at; defaults to [`RepositoryKind::Repository`].
                          enum:
                          - Repository
                          - ClusterRepository
                          type: string
                        name:
                          description: Name of the referenced `Repository`/`ClusterRepository`.
                          type: string
                        namespace:
                          description: Cross-namespace `Repository` reference; ignored/forbidden for `ClusterRepository`.
                          nullable: true
                          type: string
                      required:
                      - name
                      type: object
                  required:
                  - repository
                  type: object
                type: array
              verificationStamps:
                additionalProperties:
                  type: string
                description: |-
                  Internal write channel for per-repository verification (#368): RFC3339
                  markers keyed by the normalized repository key
                  ([`repo_key`](crate::common::repo_key)). Each verify mover merge-patches
                  ONLY its own key — a JSON merge patch merges map keys, so two concurrent
                  per-repo verifies can never clobber one another (a Vec would be replaced
                  wholesale). The controller folds these into `verification` on its next
                  pass and prunes keys for repositories no longer in the spec. Never
                  written for the single-repo shape.
                type: object
            type: object
        required:
        - spec
        title: SnapshotPolicy
        type: object
    served: true
    storage: true
    subresources:
      status: {}
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: snapshots.kopiur.home-operations.com
spec:
  group: kopiur.home-operations.com
  names:
    categories:
    - kopiur
    kind: Snapshot
    plural: snapshots
    shortNames:
    - kopiasnap
    singular: snapshot
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.origin
      name: Origin
      type: string
    - jsonPath: .status.snapshot.kopiaSnapshotID
      name: Snapshot
      type: string
    - jsonPath: .spec.source.target.pvc.name
      name: Source
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Auto-generated derived type for SnapshotSpec via `CustomResource`
        properties:
          spec:
            description: A single kopia snapshot represented as a Kubernetes object.
            properties:
              deletionPolicy:
                description: |-
                  Lifecycle of the underlying kopia snapshot when its `Snapshot` CR is deleted.
                  Produced backups default to `Delete`; discovered snapshots are forced to `Retain`.
                enum:
                - Delete
                - Retain
                - Orphan
                nullable: true
                type: string
              description:
                description: |-
                  Free-form text recorded on the kopia snapshot manifest
                  (`snapshot create --description`). Per-invocation by nature —
                  scheduled/discovered `Snapshot`s never set this (no templated
                  descriptions).
                maxLength: 1024
                nullable: true
                type: string
              failurePolicy:
                description: Mover Job retry and deadline limits for this run.
                nullable: true
                properties:
                  activeDeadlineSeconds:
                    description: Mover `Job.spec.activeDeadlineSeconds` — wall-clock cap after which a running run is killed.
                    format: int64
                    nullable: true
                    type: integer
                  backoffLimit:
                    description: Mover `Job.spec.backoffLimit` — retries before a failed run is marked failed.
                    format: int32
                    nullable: true
                    type: integer
                  podStartupDeadlineSeconds:
                    description: Seconds a non-starting (wedged) mover pod may sit before the run is failed; default 300s.
                    format: int64
                    nullable: true
                    type: integer
                type: object
              onScheduleDelete:
                description: |-
                  What the deletion of a `SnapshotSchedule` does to the `Snapshot` CRs it
                  produced (which Kubernetes GC cascade-deletes via their ownerReference).
                  Default `Retain`: the CRs are removed but their kopia snapshots survive and
                  the catalog rediscovers them as `origin: discovered`. `Delete` opts into the
                  cascade: each Snapshot's own `deletionPolicy` applies.

                  Deliberately 2-variant (not reusing [`DeletionPolicy`]): an `Orphan` in
                  cascade position would differ from `Retain` only in per-CR event/metric
                  bookkeeping — an invalid state made unrepresentable. The guard's `Retain`
                  is exactly `DeletionPolicy::Retain`'s semantics (CR removed, kopia snapshot
                  stays, catalog rediscovers it), deliberately NOT the `Orphan` event storm
                  (no per-CR "orphaned" event/metric for every produced Snapshot).
                enum:
                - Retain
                - Delete
                nullable: true
                type: string
              pin:
                description: Exempt this snapshot from GFS retention.
                type: boolean
              policyRef:
                description: The `SnapshotPolicy` recipe to run; absent for `discovered` backups.
                nullable: true
                properties:
                  name:
                    description: Name of the referenced `SnapshotPolicy`.
                    type: string
                  namespace:
                    description: Namespace of the `SnapshotPolicy`; absent = same namespace as the referrer.
                    nullable: true
                    type: string
                required:
                - name
                type: object
              repository:
                description: |-
                  The ONE repository this `Snapshot` targets, pinned by value at mint
                  time. Stamped by a multi-repository `SnapshotPolicy` fan-out (each child
                  covers exactly one member of the policy's repository set) and by
                  `SnapshotReplication` copy CRs (the destination repository). Absent for
                  the legacy single-repository case, where the policy's own
                  `spec.repository` (or, for catalog rows, the owning repository CR) is
                  the answer — an absent pin resolves exactly as before this field
                  existed, so pre-feature `Snapshot`s are untouched.
                nullable: true
                properties:
                  kind:
                    default: Repository
                    description: Which repository CRD this points at; defaults to [`RepositoryKind::Repository`].
                    enum:
                    - Repository
                    - ClusterRepository
                    type: string
                  name:
                    description: Name of the referenced `Repository`/`ClusterRepository`.
                    type: string
                  namespace:
                    description: Cross-namespace `Repository` reference; ignored/forbidden for `ClusterRepository`.
                    nullable: true
                    type: string
                required:
                - name
                type: object
              source:
                description: |-
                  The ONE concrete source this `Snapshot` covers, when `policyRef` names a
                  recipe whose `sources[]` expands to many — i.e. a
                  [`pvcSelector`](crate::snapshot_policy::PvcSelector).

                  Stamped by whoever minted the CR: a `SnapshotSchedule` fire, or
                  `kubectl kopiur snapshot now`. Absent for the ordinary single-source
                  case, where the policy's own `sources[0]` is the target.

                  Absent against a *selector* policy is refused rather than guessed. The
                  operator must never pick a PVC on the user's behalf: silently backing up
                  one arbitrary volume out of N looks exactly like success.
                nullable: true
                properties:
                  group:
                    description: |-
                      The consistency group this child belongs to, present only when the
                      policy asked for one (`groupBy: VolumeGroupSnapshot`) AND the expansion
                      produced more than one member in this namespace.
                    nullable: true
                    properties:
                      namespace:
                        description: |-
                          Namespace the `VolumeGroupSnapshot` lives in.

                          A `VolumeGroupSnapshot` is namespaced and its `source.selector` is
                          namespace-local, so a selector spanning namespaces yields ONE GROUP PER
                          NAMESPACE, not one group. The consistency guarantee is per-namespace and
                          this field is where that shows.
                        type: string
                      volumeGroupSnapshotName:
                        description: Name of the shared `VolumeGroupSnapshot`.
                        type: string
                    required:
                    - namespace
                    - volumeGroupSnapshotName
                    type: object
                  sourceIndex:
                    description: |-
                      Zero-based index into `policyRef`'s `spec.sources` this child expanded
                      from.

                      Pins WHICH source's knobs (`readOnly`, `sourcePathOverride`,
                      `sourcePathStrategy`, `acknowledgeLiveMutation`) govern this run, so a
                      policy carrying several sources stays unambiguous. An index that is out
                      of range at reconcile time — the policy shrank mid-run — is a named
                      terminal failure, never a silent fallback to `sources[0]`.
                    format: uint32
                    minimum: 0.0
                    type: integer
                  target:
                    description: What the expansion resolved to.
                    oneOf:
                    - required:
                      - pvc
                    properties:
                      pvc:
                        description: One `PersistentVolumeClaim`, fully qualified.
                        properties:
                          name:
                            description: Name of the matched `PersistentVolumeClaim`.
                            type: string
                          namespace:
                            description: |-
                              Namespace of the matched `PersistentVolumeClaim`.

                              Explicit rather than inferred from the `Snapshot`'s own namespace: a
                              `pvcSelector` under a `ClusterRepository` may match across namespaces.
                            type: string
                        required:
                        - name
                        - namespace
                        type: object
                    type: object
                required:
                - sourceIndex
                - target
                type: object
              tags:
                additionalProperties:
                  type: string
                description: |-
                  Free-form tags attached to the kopia snapshot manifest itself
                  (`snapshot create --tags`), e.g. `reason: pre-upgrade` — durable in the
                  repository, independent of this CR. Keys must be non-empty, colon-free
                  (kopia splits on the first colon), and must not start with the reserved
                  `kopiur` prefix; at most 10 tags, keys ≤ 63 bytes, values ≤ 256 bytes
                  (webhook-enforced).
                nullable: true
                type: object
            type: object
          status:
            description: Observed state of a [`Snapshot`].
            nullable: true
            properties:
              cleanup:
                description: Post-run cleanup bookkeeping, so each cleanup runs at most once per Snapshot.
                nullable: true
                properties:
                  credsReapedAt:
                    description: |-
                      When the run's projected credential Secrets were reclaimed (RFC 3339);
                      absent until the reap has run. A projected copy is only needed while a mover
                      Job can still load it via `envFrom`, but it is owner-ref'd to this CR, which
                      long outlives that Job — so without an explicit reap it would sit in the
                      workload namespace holding live repository credentials until the CR is pruned
                      (#240).
                    nullable: true
                    type: string
                type: object
              conditions:
                description: Standard Kubernetes conditions (e.g. `SourcesQuiesced`, `SnapshotCreated`).
                items:
                  description: Condition contains details for one aspect of the current state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: lastTransitionTime is the last time the condition transitioned from one status to another. This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: message is a human readable message indicating details about the transition. This may be an empty string.
                      type: string
                    observedGeneration:
                      description: observedGeneration represents the .metadata.generation that the condition was set based upon. For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date with respect to the current state of the instance.
                      format: int64
                      type: integer
                    reason:
                      description: reason contains a programmatic identifier indicating the reason for the condition's last transition. Producers of specific condition types may define expected values and meanings for this field, and whether the values are considered a guaranteed API. The value should be a CamelCase string. This field may not be empty.
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              copiedFrom:
                description: |-
                  Lineage for `origin: replicated` rows: the source repository, source
                  manifest id, and `startTime` the copy was migrated from. Written by the
                  `SnapshotReplication` mover in the same atomic PATCH as
                  `status.snapshot`; absent on every other origin. See [`CopiedFrom`] for
                  why this lives on the CR rather than as kopia tags.
                nullable: true
                properties:
                  repository:
                    description: |-
                      The SOURCE repository the snapshot was migrated from (the
                      `SnapshotReplication`'s `sourceRef`, resolved at run time).
                    properties:
                      kind:
                        default: Repository
                        description: Which repository CRD this points at; defaults to [`RepositoryKind::Repository`].
                        enum:
                        - Repository
                        - ClusterRepository
                        type: string
                      name:
                        description: Name of the referenced `Repository`/`ClusterRepository`.
                        type: string
                      namespace:
                        description: Cross-namespace `Repository` reference; ignored/forbidden for `ClusterRepository`.
                        nullable: true
                        type: string
                    required:
                    - name
                    type: object
                  sourceManifestId:
                    description: |-
                      The kopia manifest id the snapshot had in the SOURCE repository.
                      Migrate assigns a NEW manifest id on the destination
                      (`status.snapshot.kopiaSnapshotID`); this is the old one, kept for
                      cross-repository correlation.
                    type: string
                  startTime:
                    description: |-
                      The snapshot's RFC3339 `startTime` — preserved verbatim by migrate and
                      the key (together with the identity triple) both idempotent re-migration
                      and `pruning: mirrorSource` correlate source and destination rows on.
                    type: string
                required:
                - repository
                - sourceManifestId
                - startTime
                type: object
              failure:
                description: Structured terminal-failure detail (kopia error class, stderr tail, retry hint).
                nullable: true
                properties:
                  exitCode:
                    description: The process exit code, if one was reported.
                    format: int32
                    nullable: true
                    type: integer
                  kopiaErrorClass:
                    description: kopia error class (e.g. `RepositoryUnavailable`, `AuthFailure`).
                    type: string
                  message:
                    description: 'A short human-readable message: what failed, why, and how to fix it.'
                    type: string
                  op:
                    description: |-
                      The mover operation that failed, as a stable label (e.g.
                      `repository connect`, `snapshot create`) — the values of the mover's
                      `KopiaOp::as_str()`. Distinguishes a repository-level connect failure
                      from a source-level failure (a broken PVC), which share
                      `kopiaErrorClass` values (e.g. `NotFound`). Absent on failures that
                      occurred outside a kopia invocation.
                    nullable: true
                    type: string
                  retryRecommended:
                    description: Whether retrying the same operation unchanged could succeed.
                    type: boolean
                  stderrTail:
                    description: |-
                      The last lines of kopia's stderr, if any were captured (bounded by
                      [`MAX_LOG_TAIL_BYTES`]).
                    nullable: true
                    type: string
                required:
                - kopiaErrorClass
                - message
                - retryRecommended
                type: object
              hooks:
                description: Hook-execution bookkeeping so each hook list runs exactly once per Snapshot.
                nullable: true
                properties:
                  postCompletedAt:
                    description: When the `afterSnapshot` list completed (RFC3339); absent until it has.
                    nullable: true
                    type: string
                  preCompletedAt:
                    description: When the `beforeSnapshot` list completed (RFC3339); absent until it has.
                    nullable: true
                    type: string
                type: object
              job:
                description: The mover Job backing this run; absent for discovered.
                nullable: true
                properties:
                  attempts:
                    description: Number of attempts so far (bounded by `failurePolicy.backoffLimit`).
                    format: int32
                    nullable: true
                    type: integer
                  name:
                    description: Name of the mover `Job`.
                    nullable: true
                    type: string
                type: object
              logTail:
                description: The last lines of the run's output, written by the mover at the terminal transition.
                nullable: true
                type: string
              observedGeneration:
                description: '`metadata.generation` last reconciled, for staleness detection.'
                format: int64
                nullable: true
                type: integer
              origin:
                description: |-
                  How a `Snapshot` came to exist. Canonical value mirrored from the
                  `kopiur.home-operations.com/origin` label. Origin drives the deletion-policy
                  default: `discovered` backups are forced to `Retain` because the operator did
                  not create those snapshots.
                enum:
                - scheduled
                - manual
                - discovered
                - adopted
                - replicated
                nullable: true
                type: string
              phase:
                description: Lifecycle phase of a `Snapshot`.
                enum:
                - Pending
                - Running
                - Succeeded
                - Failed
                - Deleting
                - Discovered
                - Unchanged
                nullable: true
                type: string
              pinned:
                description: 'The observed kopia-side pin state: `Some(true)` if pinned, `Some(false)` if unpinned, `None` before any pin reconcile.'
                nullable: true
                type: boolean
              preflightSince:
                description: |-
                  RFC 3339 timestamp of the first reconcile where the repository was `Ready`
                  but a `spec.preflight` check was failing. The one-shot anchor for the
                  preflight `timeout` deadline (so the budget covers preflight only, not the
                  earlier repository-not-Ready wait). Cleared once every preflight check passes,
                  so a later failing episode gets a fresh budget rather than a stale anchor.
                nullable: true
                type: string
              recorded:
                description: |-
                  The mover identity recorded on the kopia snapshot itself (the
                  `kopiur-meta` tag): the resolved effective uid/gid/fsGroup the backup ran
                  as, plus its provenance. Produced runs stamp this at launch (from the
                  same value written into the tag); discovered rows decode it from the tag
                  during the catalog scan. Absent for pre-feature snapshots, foreign
                  backups without the tag, or a tag this operator version cannot decode.
                nullable: true
                properties:
                  fsGroup:
                    description: |-
                      The resolved pod-level `fsGroup` the mover ran with (the hardened
                      default is `65532`). Absent = no layer set one.
                    format: int64
                    nullable: true
                    type: integer
                  gid:
                    description: |-
                      The resolved effective `runAsGroup` the mover ran as at backup time
                      (container `runAsGroup`, else pod). Absent = image-determined.
                    format: int64
                    nullable: true
                    type: integer
                  schema:
                    description: |-
                      The `kopiur-meta` schema version this value was written under. Writers
                      emit the lowest schema that represents the data (currently
                      [`KOPIUR_META_SCHEMA_V1`]); readers reject only a schema NEWER than they
                      understand (degrading to recorded-absent, never an error).
                    format: int64
                    type: integer
                  src:
                    description: |-
                      Which layer pinned the recorded identity. Only `inherited` means the
                      identity tracked the workload.
                    enum:
                    - inherited
                    - explicit
                    - defaults
                    - unknown
                    type: string
                  uid:
                    description: |-
                      The resolved effective `runAsUser` the mover ran as at backup time
                      (container `runAsUser`, else pod). Absent = no layer pinned a UID, so
                      the mover's UID was image-determined.
                    format: int64
                    nullable: true
                    type: integer
                required:
                - schema
                - src
                type: object
              resolved:
                description: Frozen recipe values at run time (scheduled/manual).
                nullable: true
                properties:
                  credentialProjection:
                    description: |-
                      The recipe's `spec.credentialProjection` as it stood for this run.

                      The deletion path re-projects the mover's credentials, but the opt-in lives on the
                      `SnapshotPolicy` — which a user may delete first. Pinning it here lets the finalizer
                      honor the opt-in that was actually in force, instead of reading an absent recipe as
                      "projection off" and blocking on a Secret that was never meant to be namespace-local
                      (#255). Absent only on a `Snapshot` that predates the pin or never ran; a run always
                      writes it, including `enabled: false`, so absent stays distinguishable from off.
                    nullable: true
                    properties:
                      enabled:
                        default: false
                        description: Copy the repository's credential Secret(s) into the namespace of each mover Job; off by default.
                        type: boolean
                    type: object
                  repository:
                    description: The repository this run targeted, frozen at run time.
                    nullable: true
                    properties:
                      kind:
                        default: Repository
                        description: Which repository CRD this points at; defaults to [`RepositoryKind::Repository`].
                        enum:
                        - Repository
                        - ClusterRepository
                        type: string
                      name:
                        description: Name of the referenced `Repository`/`ClusterRepository`.
                        type: string
                      namespace:
                        description: Cross-namespace `Repository` reference; ignored/forbidden for `ClusterRepository`.
                        nullable: true
                        type: string
                    required:
                    - name
                    type: object
                  sources:
                    description: The concrete PVCs + source paths backed up this run.
                    items:
                      description: One resolved source backed up by a run — a concrete PVC and its kopia path.
                      properties:
                        pvc:
                          description: '`namespace/name` of the PVC, as kopia sees it.'
                          nullable: true
                          type: string
                        sourcePath:
                          description: The source path kopia recorded for this PVC.
                          nullable: true
                          type: string
                      type: object
                    type: array
                type: object
              snapshot:
                description: The kopia artifact this CR represents.
                nullable: true
                properties:
                  description:
                    description: |-
                      The kopia snapshot description (`snapshot create --description`), when
                      one is recorded and non-empty. For discovered rows this is copied from
                      the repository listing TRUNCATED to 1024 bytes (char-boundary-safe) —
                      the value is foreign-writer-controlled and must never fail the CR write.
                    nullable: true
                    type: string
                  identity:
                    description: The `username@hostname:path` identity recorded for this snapshot.
                    properties:
                      hostname:
                        description: The final `hostname` kopia records, fixed at admission.
                        type: string
                      sourcePath:
                        description: The resolved snapshot source path, when applicable (`username@hostname:path`).
                        nullable: true
                        type: string
                      username:
                        description: The final `username` kopia records, fixed at admission.
                        type: string
                    required:
                    - hostname
                    - username
                    type: object
                  kopiaSnapshotID:
                    description: kopia's snapshot ID — the handle the finalizer uses to delete content.
                    type: string
                required:
                - identity
                - kopiaSnapshotID
                type: object
              staged:
                description: 'The CSI staging objects the run created for `copyMethod: Snapshot`/`Clone`.'
                nullable: true
                properties:
                  copyMethod:
                    description: The resolved capture method (`Snapshot` or `Clone`) that produced this stage.
                    nullable: true
                    type: string
                  pvcName:
                    description: Name of the staged `PersistentVolumeClaim` the mover mounts in place of the live source PVC.
                    nullable: true
                    type: string
                  ready:
                    description: '`true` once the stage is ready for the mover.'
                    nullable: true
                    type: boolean
                  stagingTimeoutSeconds:
                    description: |-
                      The resolved `spec.staging.timeout` (seconds) pinned when the stage was
                      stamped, so the running-Job staged-PVC bind watchdog never re-resolves a
                      policy that may have been edited or deleted mid-run. `0` = wait
                      indefinitely.
                    format: int64
                    nullable: true
                    type: integer
                  storageClassName:
                    description: |-
                      StorageClass of the staged PVC — `spec.staging.storageClassName` when set,
                      else the source PVC's class. Pinned for observability (e.g. confirming a
                      CephFS shallow-clone class actually took effect).
                    nullable: true
                    type: string
                  volumeGroupSnapshotName:
                    description: |-
                      Name of the shared CSI `VolumeGroupSnapshot` this member staged from,
                      when the recipe asked for a consistency group
                      ([`groupBy: VolumeGroupSnapshot`](crate::snapshot_policy::GroupBy)).

                      Recorded because the group is otherwise invisible: it deliberately
                      carries no ownerReferences (see `io::group_staging`), so this is how an
                      operator tells which capture a backup came from — and how `kubectl
                      kopiur doctor` finds one that outlived its members.
                    nullable: true
                    type: string
                  volumeSnapshotName:
                    description: 'Name of the `VolumeSnapshot` created from the source PVC (`copyMethod: Snapshot` only).'
                    nullable: true
                    type: string
                type: object
              stats:
                description: Byte/file counts parsed from kopia's JSON output.
                nullable: true
                properties:
                  bytesNew:
                    description: Bytes newly uploaded this run (after dedup/compression).
                    format: int64
                    nullable: true
                    type: integer
                  filesFailed:
                    description: Count of source entries kopia could not read and excluded, making the snapshot incomplete.
                    format: int64
                    nullable: true
                    type: integer
                  filesModified:
                    description: Count of files changed since the previous snapshot.
                    format: int64
                    nullable: true
                    type: integer
                  filesNew:
                    description: Count of files new since the previous snapshot.
                    format: int64
                    nullable: true
                    type: integer
                  filesUnchanged:
                    description: Count of files unchanged since the previous snapshot.
                    format: int64
                    nullable: true
                    type: integer
                  sizeBytes:
                    description: Total logical size of the snapshot in bytes.
                    format: int64
                    nullable: true
                    type: integer
                type: object
              timing:
                description: Start/end/duration of the snapshot run.
                nullable: true
                properties:
                  durationSeconds:
                    description: Wall-clock duration in seconds.
                    format: int64
                    nullable: true
                    type: integer
                  endTime:
                    description: RFC3339 end time of the run.
                    nullable: true
                    type: string
                  startTime:
                    description: RFC3339 start time of the run.
                    nullable: true
                    type: string
                type: object
            type: object
        required:
        - spec
        title: Snapshot
        type: object
    served: true
    storage: true
    subresources:
      status: {}
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: snapshotschedules.kopiur.home-operations.com
spec:
  group: kopiur.home-operations.com
  names:
    categories:
    - kopiur
    kind: SnapshotSchedule
    plural: snapshotschedules
    shortNames:
    - kopiasched
    singular: snapshotschedule
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.policyRef.name
      name: Config
      type: string
    - jsonPath: .spec.schedule.cron
      name: Schedule
      type: string
    - jsonPath: .spec.schedule.suspend
      name: Suspended
      type: boolean
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Auto-generated derived type for SnapshotScheduleSpec via `CustomResource`
        properties:
          spec:
            description: Cron schedule that fires `Snapshot` CRs from a `SnapshotPolicy`.
            properties:
              deletion:
                description: Deletion semantics for the Snapshots this schedule produced.
                nullable: true
                properties:
                  onScheduleDelete:
                    default: Retain
                    description: |-
                      Stamped onto every produced Snapshot at creation (`spec.onScheduleDelete`)
                      and consulted by the Snapshot finalizer when the owning schedule is gone
                      or replaced. Absent resolves to `Retain`.
                    enum:
                    - Retain
                    - Delete
                    type: string
                type: object
              failedJobsHistoryLimit:
                default: 10
                description: |-
                  Maximum number of failed `Snapshot` CRs from this schedule to retain
                  (default `10`; `0` keeps none).
                format: uint32
                minimum: 0.0
                nullable: true
                type: integer
              policyRef:
                description: The single `SnapshotPolicy` this schedule invokes; mutually exclusive with `policySelector`.
                nullable: true
                properties:
                  name:
                    description: Name of the referenced `SnapshotPolicy`.
                    type: string
                  namespace:
                    description: Namespace of the `SnapshotPolicy`; absent = same namespace as the referrer.
                    nullable: true
                    type: string
                required:
                - name
                type: object
              policySelector:
                description: Label selector fanning out over `SnapshotPolicy` objects; mutually exclusive with `policyRef`.
                nullable: true
                properties:
                  matchExpressions:
                    description: matchExpressions is a list of label selector requirements. The requirements are ANDed.
                    items:
                      description: A label selector requirement is a selector that contains values, a key, and an operator that relates the key and values.
                      properties:
                        key:
                          description: key is the label key that the selector applies to.
                          type: string
                        operator:
                          description: operator represents a key's relationship to a set of values. Valid operators are In, NotIn, Exists and DoesNotExist.
                          type: string
                        values:
                          description: values is an array of string values. If the operator is In or NotIn, the values array must be non-empty. If the operator is Exists or DoesNotExist, the values array must be empty. This array is replaced during a strategic merge patch.
                          items:
                            type: string
                          type: array
                      required:
                      - key
                      - operator
                      type: object
                    type: array
                  matchLabels:
                    additionalProperties:
                      type: string
                    description: matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels map is equivalent to an element of matchExpressions, whose key field is "key", the operator is "In", and the values array contains only "value". The requirements are ANDed.
                    type: object
                type: object
              schedule:
                description: Cron, jitter, timezone, and concurrency for the firing cadence.
                properties:
                  concurrencyPolicy:
                    default: Forbid
                    description: How to handle a firing while a prior run is still in flight (default `Forbid`).
                    enum:
                    - Forbid
                    - Allow
                    - Replace
                    type: string
                  cron:
                    description: Cron expression with Jenkins-style `H` substitution.
                    type: string
                  jitter:
                    description: Deterministic jitter (Go-style duration), derived from `(scheduleUID, slot)`.
                    nullable: true
                    type: string
                  runOnCreate:
                    default: false
                    description: Whether to fire immediately on create (default `false`).
                    type: boolean
                  startingDeadlineSeconds:
                    description: If a slot is missed by more than this many seconds, skip it instead of firing late.
                    format: int64
                    nullable: true
                    type: integer
                  suspend:
                    description: Skip future firings while true.
                    type: boolean
                  timezone:
                    description: IANA timezone the cron is evaluated in; absent uses the controller's default.
                    nullable: true
                    type: string
                required:
                - cron
                type: object
            required:
            - schedule
            type: object
            x-kubernetes-validations:
            - message: exactly one of policyRef or policySelector
              rule: '[has(self.policyRef), has(self.policySelector)].filter(x, x).size() == 1'
          status:
            description: 'Observed state of a `SnapshotSchedule`: pinned firing slots and failure run.'
            nullable: true
            properties:
              conditions:
                description: Standard Kubernetes conditions surfacing schedule health.
                items:
                  description: Condition contains details for one aspect of the current state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: lastTransitionTime is the last time the condition transitioned from one status to another. This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: message is a human readable message indicating details about the transition. This may be an empty string.
                      type: string
                    observedGeneration:
                      description: observedGeneration represents the .metadata.generation that the condition was set based upon. For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date with respect to the current state of the instance.
                      format: int64
                      type: integer
                    reason:
                      description: reason contains a programmatic identifier indicating the reason for the condition's last transition. Producers of specific condition types may define expected values and meanings for this field, and whether the values are considered a guaranteed API. The value should be a CamelCase string. This field may not be empty.
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              consecutiveFailures:
                description: Count of back-to-back failed runs; resets on success.
                format: int64
                nullable: true
                type: integer
              lastSchedule:
                description: Most recent firing (cron + jitter, pinned).
                nullable: true
                properties:
                  at:
                    description: The RFC3339 instant this slot fired (or is scheduled to); also accepts the `scheduledAt` alias.
                    nullable: true
                    type: string
                  snapshotRef:
                    description: The `Snapshot` CR this slot produced, when one was created.
                    nullable: true
                    properties:
                      name:
                        description: The `Snapshot`'s `metadata.name` (same namespace as the schedule).
                        type: string
                    required:
                    - name
                    type: object
                  timezone:
                    description: |-
                      The IANA timezone the cron was evaluated in when this slot was pinned
                      (`nextSchedule` only). Recorded so the controller can detect an
                      effective-timezone change — a `spec.schedule.timezone` edit or a change to
                      the target repository's `scheduleDefaults.timezone` — and invalidate the
                      pinned wall-clock slot, recomputing it in the new zone. Absent on legacy
                      pins written before this field existed (treated as "unchanged").
                    nullable: true
                    type: string
                type: object
              lastSuccessfulSchedule:
                description: The most recent firing whose `Snapshot` succeeded.
                nullable: true
                properties:
                  at:
                    description: The RFC3339 instant this slot fired (or is scheduled to); also accepts the `scheduledAt` alias.
                    nullable: true
                    type: string
                  snapshotRef:
                    description: The `Snapshot` CR this slot produced, when one was created.
                    nullable: true
                    properties:
                      name:
                        description: The `Snapshot`'s `metadata.name` (same namespace as the schedule).
                        type: string
                    required:
                    - name
                    type: object
                  timezone:
                    description: |-
                      The IANA timezone the cron was evaluated in when this slot was pinned
                      (`nextSchedule` only). Recorded so the controller can detect an
                      effective-timezone change — a `spec.schedule.timezone` edit or a change to
                      the target repository's `scheduleDefaults.timezone` — and invalidate the
                      pinned wall-clock slot, recomputing it in the new zone. Absent on legacy
                      pins written before this field existed (treated as "unchanged").
                    nullable: true
                    type: string
                type: object
              nextSchedule:
                description: The next firing slot the controller has computed (cron + jitter, pinned).
                nullable: true
                properties:
                  at:
                    description: The RFC3339 instant this slot fired (or is scheduled to); also accepts the `scheduledAt` alias.
                    nullable: true
                    type: string
                  snapshotRef:
                    description: The `Snapshot` CR this slot produced, when one was created.
                    nullable: true
                    properties:
                      name:
                        description: The `Snapshot`'s `metadata.name` (same namespace as the schedule).
                        type: string
                    required:
                    - name
                    type: object
                  timezone:
                    description: |-
                      The IANA timezone the cron was evaluated in when this slot was pinned
                      (`nextSchedule` only). Recorded so the controller can detect an
                      effective-timezone change — a `spec.schedule.timezone` edit or a change to
                      the target repository's `scheduleDefaults.timezone` — and invalidate the
                      pinned wall-clock slot, recomputing it in the new zone. Absent on legacy
                      pins written before this field existed (treated as "unchanged").
                    nullable: true
                    type: string
                type: object
              observedGeneration:
                description: The `metadata.generation` this status reflects, for staleness detection.
                format: int64
                nullable: true
                type: integer
            type: object
        required:
        - spec
        title: SnapshotSchedule
        type: object
    served: true
    storage: true
    subresources:
      status: {}
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: restores.kopiur.home-operations.com
spec:
  group: kopiur.home-operations.com
  names:
    categories:
    - kopiur
    kind: Restore
    plural: restores
    shortNames:
    - kopiarestore
    singular: restore
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.sourceKind
      name: Source
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Auto-generated derived type for RestoreSpec via `CustomResource`
        properties:
          spec:
            description: |-
              A restore operation from a snapshot/identity into a PVC, or a passive populator source.
              Desired state of a Restore: where to read from, where to write to, and how to behave when the snapshot is missing.
            properties:
              credentialProjection:
                description: Opt-in copying of the repository's credential Secret(s) into the mover's namespace (default off).
                nullable: true
                properties:
                  enabled:
                    default: false
                    description: Copy the repository's credential Secret(s) into the namespace of each mover Job; off by default.
                    type: boolean
                type: object
              failurePolicy:
                description: Mover `Job` retry/deadline limits (`backoffLimit`, `activeDeadlineSeconds`).
                nullable: true
                properties:
                  activeDeadlineSeconds:
                    description: Mover `Job.spec.activeDeadlineSeconds` — wall-clock cap after which a running run is killed.
                    format: int64
                    nullable: true
                    type: integer
                  backoffLimit:
                    description: Mover `Job.spec.backoffLimit` — retries before a failed run is marked failed.
                    format: int32
                    nullable: true
                    type: integer
                  podStartupDeadlineSeconds:
                    description: Seconds a non-starting (wedged) mover pod may sit before the run is failed; default 300s.
                    format: int64
                    nullable: true
                    type: integer
                type: object
              mover:
                description: Per-run mover overrides for this restore's Job (resources, cache, `securityContext`).
                nullable: true
                properties:
                  cache:
                    description: Override the repository's [`CacheDefaults`] for this recipe's movers.
                    nullable: true
                    properties:
                      capacity:
                        description: Size of the PVC backing the mover's kopia cache (e.g. `10Gi`).
                        nullable: true
                        type: string
                      contentCacheSizeMb:
                        description: kopia content cache budget in MiB (`--content-cache-size-mb`).
                        format: int64
                        nullable: true
                        type: integer
                      metadataCacheSizeMb:
                        description: kopia metadata cache budget in MiB (`--metadata-cache-size-mb`).
                        format: int64
                        nullable: true
                        type: integer
                      mode:
                        description: How a mover's kopia cache volume is provisioned.
                        enum:
                        - Ephemeral
                        - Persistent
                        nullable: true
                        type: string
                      storageClassName:
                        description: StorageClass for the cache PVC; absent uses the cluster default.
                        nullable: true
                        type: string
                    type: object
                  inheritSecurityContextFrom:
                    description: |-
                      Copy the UID/GID security context from a live workload rather than hard-coding it.

                      Requires the workload to pin `runAsUser` (container or pod level): a UID that comes
                      from the container image's `USER` line is invisible in the pod spec and cannot be
                      inherited — the mover would silently run as its own image's UID instead.

                      May be combined with `securityContext`/`podSecurityContext`, which override it
                      field-wise and act as the fallback when no workload pod can be resolved.
                    nullable: true
                    oneOf:
                    - required:
                      - workloadSelector
                    - required:
                      - pvcConsumer
                    - required:
                      - snapshot
                    properties:
                      pvcConsumer:
                        description: 'Backup sources only: auto-derive the workload from the PVC this snapshot backs up.'
                        properties:
                          container:
                            description: Which container within the matched consumer pod to inherit from; absent uses the first/only.
                            nullable: true
                            type: string
                        type: object
                      snapshot:
                        description: |-
                          Restores only: inherit the identity RECORDED on the backup itself
                          (`Snapshot.status.recorded`, decoded from the `kopiur-meta` kopia tag) —
                          uid/gid/fsGroup the backup mover actually ran as. Needs no live workload
                          pod, so it works on a rebuilt cluster and with `target.populator`.
                          Rejected at admission on SnapshotPolicy/Maintenance (backups read the
                          live workload; maintenance has no snapshot). Write it as `snapshot: {}`
                          (an empty sub-object) — a bare `snapshot:` is null and rejected.
                        type: object
                      workloadSelector:
                        description: Inherit from workload pod(s) matched by an explicit label selector (backup or restore).
                        properties:
                          container:
                            description: Which container within the matched pod; absent uses the first/only container.
                            nullable: true
                            type: string
                          podSelector:
                            description: Label selector matching the workload pod(s) to read context/hooks from.
                            properties:
                              matchExpressions:
                                description: matchExpressions is a list of label selector requirements. The requirements are ANDed.
                                items:
                                  description: A label selector requirement is a selector that contains values, a key, and an operator that relates the key and values.
                                  properties:
                                    key:
                                      description: key is the label key that the selector applies to.
                                      type: string
                                    operator:
                                      description: operator represents a key's relationship to a set of values. Valid operators are In, NotIn, Exists and DoesNotExist.
                                      type: string
                                    values:
                                      description: values is an array of string values. If the operator is In or NotIn, the values array must be non-empty. If the operator is Exists or DoesNotExist, the values array must be empty. This array is replaced during a strategic merge patch.
                                      items:
                                        type: string
                                      type: array
                                  required:
                                  - key
                                  - operator
                                  type: object
                                type: array
                              matchLabels:
                                additionalProperties:
                                  type: string
                                description: matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels map is equivalent to an element of matchExpressions, whose key field is "key", the operator is "In", and the values array contains only "value". The requirements are ANDed.
                                type: object
                            type: object
                        required:
                        - podSelector
                        type: object
                    type: object
                  podSecurityContext:
                    description: |-
                      Pod security context for the mover (notably `fsGroup` for group-writable restore
                      volumes). Same layering as `securityContext`: highest layer, merged field-wise, and
                      combinable with `inheritSecurityContextFrom`.
                    nullable: true
                    properties:
                      appArmorProfile:
                        description: appArmorProfile is the AppArmor options to use by the containers in this pod. Note that this field cannot be set when spec.os.name is windows.
                        properties:
                          localhostProfile:
                            description: localhostProfile indicates a profile loaded on the node that should be used. The profile must be preconfigured on the node to work. Must match the loaded name of the profile. Must be set if and only if type is "Localhost".
                            type: string
                          type:
                            description: |-
                              type indicates which kind of AppArmor profile will be applied. Valid options are:
                                Localhost - a profile pre-loaded on the node.
                                RuntimeDefault - the container runtime's default profile.
                                Unconfined - no AppArmor enforcement.
                            type: string
                        required:
                        - type
                        type: object
                      fsGroup:
                        description: |-
                          A special supplemental group that applies to all containers in a pod. Some volume types allow the Kubelet to change the ownership of that volume to be owned by the pod:

                          1. The owning GID will be the FSGroup 2. The setgid bit is set (new files created in the volume will be owned by FSGroup) 3. The permission bits are OR'd with rw-rw----

