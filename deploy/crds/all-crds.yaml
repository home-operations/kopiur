                      allowPrivilegeEscalation:
                        description: 'AllowPrivilegeEscalation controls whether a process can gain more privileges than its parent process. This bool directly controls if the no_new_privs flag will be set on the container process. AllowPrivilegeEscalation is true always when the container is: 1) run as Privileged 2) has CAP_SYS_ADMIN Note that this field cannot be set when spec.os.name is windows.'
                        type: boolean
                      appArmorProfile:
                        description: appArmorProfile is the AppArmor options to use by this container. If set, this profile overrides the pod's appArmorProfile. Note that this field cannot be set when spec.os.name is windows.
                        properties:
                          localhostProfile:
                            description: localhostProfile indicates a profile loaded on the node that should be used. The profile must be preconfigured on the node to work. Must match the loaded name of the profile. Must be set if and only if type is "Localhost".
                            type: string
                          type:
                            description: |-
                              type indicates which kind of AppArmor profile will be applied. Valid options are:
                                Localhost - a profile pre-loaded on the node.
                                RuntimeDefault - the container runtime's default profile.
                                Unconfined - no AppArmor enforcement.
                            type: string
                        required:
                        - type
                        type: object
                      capabilities:
                        description: The capabilities to add/drop when running containers. Defaults to the default set of capabilities granted by the container runtime. Note that this field cannot be set when spec.os.name is windows.
                        properties:
                          add:
                            description: Added capabilities
                            items:
                              type: string
                            type: array
                          drop:
                            description: Removed capabilities
                            items:
                              type: string
                            type: array
                        type: object
                      privileged:
                        description: Run container in privileged mode. Processes in privileged containers are essentially equivalent to root on the host. Defaults to false. Note that this field cannot be set when spec.os.name is windows.
                        type: boolean
                      procMount:
                        description: procMount denotes the type of proc mount to use for the containers. The default value is Default which uses the container runtime defaults for readonly paths and masked paths. This requires the ProcMountType feature flag to be enabled. Note that this field cannot be set when spec.os.name is windows.
                        type: string
                      readOnlyRootFilesystem:
                        description: Whether this container has a read-only root filesystem. Default is false. Note that this field cannot be set when spec.os.name is windows.
                        type: boolean
                      runAsGroup:
                        description: The GID to run the entrypoint of the container process. Uses runtime default if unset. May also be set in PodSecurityContext.  If set in both SecurityContext and PodSecurityContext, the value specified in SecurityContext takes precedence. Note that this field cannot be set when spec.os.name is windows.
                        format: int64
                        type: integer
                      runAsNonRoot:
                        description: Indicates that the container must run as a non-root user. If true, the Kubelet will validate the image at runtime to ensure that it does not run as UID 0 (root) and fail to start the container if it does. If unset or false, no such validation will be performed. May also be set in PodSecurityContext.  If set in both SecurityContext and PodSecurityContext, the value specified in SecurityContext takes precedence.
                        type: boolean
                      runAsUser:
                        description: The UID to run the entrypoint of the container process. Defaults to user specified in image metadata if unspecified. May also be set in PodSecurityContext.  If set in both SecurityContext and PodSecurityContext, the value specified in SecurityContext takes precedence. Note that this field cannot be set when spec.os.name is windows.
                        format: int64
                        type: integer
                      seLinuxOptions:
                        description: The SELinux context to be applied to the container. If unspecified, the container runtime will allocate a random SELinux context for each container.  May also be set in PodSecurityContext.  If set in both SecurityContext and PodSecurityContext, the value specified in SecurityContext takes precedence. Note that this field cannot be set when spec.os.name is windows.
                        properties:
                          level:
                            description: Level is SELinux level label that applies to the container.
                            type: string
                          role:
                            description: Role is a SELinux role label that applies to the container.
                            type: string
                          type:
                            description: Type is a SELinux type label that applies to the container.
                            type: string
                          user:
                            description: User is a SELinux user label that applies to the container.
                            type: string
                        type: object
                      seccompProfile:
                        description: The seccomp options to use by this container. If seccomp options are provided at both the pod & container level, the container options override the pod options. Note that this field cannot be set when spec.os.name is windows.
                        properties:
                          localhostProfile:
                            description: localhostProfile indicates a profile defined in a file on the node should be used. The profile must be preconfigured on the node to work. Must be a descending path, relative to the kubelet's configured seccomp profile location. Must be set if type is "Localhost". Must NOT be set for any other type.
                            type: string
                          type:
                            description: |-
                              type indicates which kind of seccomp profile will be applied. Valid options are:

                              Localhost - a profile defined in a file on the node should be used. RuntimeDefault - the container runtime default profile should be used. Unconfined - no profile should be applied.
                            type: string
                        required:
                        - type
                        type: object
                      windowsOptions:
                        description: The Windows specific settings applied to all containers. If unspecified, the options from the PodSecurityContext will be used. If set in both SecurityContext and PodSecurityContext, the value specified in SecurityContext takes precedence. Note that this field cannot be set when spec.os.name is linux.
                        properties:
                          gmsaCredentialSpec:
                            description: GMSACredentialSpec is where the GMSA admission webhook (https://github.com/kubernetes-sigs/windows-gmsa) inlines the contents of the GMSA credential spec named by the GMSACredentialSpecName field.
                            type: string
                          gmsaCredentialSpecName:
                            description: GMSACredentialSpecName is the name of the GMSA credential spec to use.
                            type: string
                          hostProcess:
                            description: HostProcess determines if a container should be run as a 'Host Process' container. All of a Pod's containers must have the same effective HostProcess value (it is not allowed to have a mix of HostProcess containers and non-HostProcess containers). In addition, if HostProcess is true then HostNetwork must also be set to true.
                            type: boolean
                          runAsUserName:
                            description: The UserName in Windows to run the entrypoint of the container process. Defaults to the user specified in image metadata if unspecified. May also be set in PodSecurityContext. If set in both SecurityContext and PodSecurityContext, the value specified in SecurityContext takes precedence.
                            type: string
                        type: object
                    type: object
                  service:
                    description: How the server is exposed as a Kubernetes `Service`.
                    nullable: true
                    properties:
                      annotations:
                        additionalProperties:
                          type: string
                        description: |-
                          Annotations applied to the `Service` — the seam users wire their own
                          Ingress/LoadBalancer controller onto.
                        type: object
                      port:
                        default: 51515
                        description: Listen/Service port. Defaults to [`DEFAULT_SERVER_PORT`] when omitted.
                        format: uint16
                        maximum: 65535.0
                        minimum: 0.0
                        nullable: true
                        type: integer
                      type:
                        default: ClusterIP
                        description: Service type. Defaults to `ClusterIP` (routing is the user's responsibility).
                        enum:
                        - ClusterIP
                        - NodePort
                        - LoadBalancer
                        type: string
                    type: object
                required:
                - namespace
                type: object
              suspend:
                description: 'Pause this cluster repository: skip connect/bootstrap and maintenance projection.'
                type: boolean
            required:
            - allowedNamespaces
            - backend
            - encryption
            type: object
            x-kubernetes-validations:
            - message: create.splitter is immutable after creation
              rule: '!has(self.create) || !has(oldSelf.create) || (has(self.create.splitter) == has(oldSelf.create.splitter) && (!has(self.create.splitter) || self.create.splitter == oldSelf.create.splitter))'
            - message: create.hash is immutable after creation
              rule: '!has(self.create) || !has(oldSelf.create) || (has(self.create.hash) == has(oldSelf.create.hash) && (!has(self.create.hash) || self.create.hash == oldSelf.create.hash))'
            - message: create.encryption is immutable after creation
              rule: '!has(self.create) || !has(oldSelf.create) || (has(self.create.encryption) == has(oldSelf.create.encryption) && (!has(self.create.encryption) || self.create.encryption == oldSelf.create.encryption))'
            - message: create.ecc is immutable after creation
              rule: '!has(self.create) || !has(oldSelf.create) || (has(self.create.ecc) == has(oldSelf.create.ecc) && (!has(self.create.ecc) || self.create.ecc == oldSelf.create.ecc))'
          status:
            description: Observed state of a `ClusterRepository`; mirrors `RepositoryStatus` plus `allowedNamespaceCount`.
            nullable: true
            properties:
              allowedNamespaceCount:
                description: Number of namespaces currently resolved by `spec.allowedNamespaces`.
                format: int64
                nullable: true
                type: integer
              backend:
                description: Mirror of `spec.backend` discriminant for the print column.
                nullable: true
                type: string
              catalog:
                description: Catalog-materialization status (discovered-backup count, last refresh).
                nullable: true
                properties:
                  discoveredBackupCount:
                    description: How many `Snapshot` CRs were materialized from the catalog scan.
                    format: int64
                    nullable: true
                    type: integer
                  foreignSnapshotCount:
                    description: |-
                      Snapshots in the last complete listing classified as another cluster's
                      (see `catalog.foreignSnapshots`); never materialized under `Ignore`.
                      As of `catalog.lastRefreshAt` — enable `periodicRefresh` to keep it
                      current.
                    format: int64
                    nullable: true
                    type: integer
                  lastRefreshAt:
                    description: RFC 3339 timestamp of the last catalog refresh.
                    nullable: true
                    type: string
                  scanRequestAttemptAt:
                    description: |-
                      RFC 3339 timestamp of the last bootstrap/scan attempt initiated BECAUSE OF
                      a pending `catalog-scan-requested-at` token (i.e. the token arm was the
                      reason the attempt fired). Used only to rate-limit token-driven attempts
                      on a Ready-but-unreachable repository — it is never compared against the
                      token for retirement (that's `scanRequestHonored`, by equality).
                    nullable: true
                    type: string
                  scanRequestHonored:
                    description: |-
                      The RFC3339 token VALUE of the `kopiur.home-operations.com/catalog-scan-requested-at`
                      annotation last honored by a completed catalog scan. Compared by
                      **equality** against the live annotation to decide whether a requested
                      on-demand scan is still pending — deliberately NOT a timestamp comparison
                      against `lastRefreshAt` (a periodic refresh completing after the request
                      was made would otherwise look like it honored the request even though it
                      started before the annotation was set).
                    nullable: true
                    type: string
                type: object
              conditions:
                description: Standard Kubernetes conditions (e.g. `Connected`, `MaintenanceOwned`).
                items:
                  description: Condition contains details for one aspect of the current state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: lastTransitionTime is the last time the condition transitioned from one status to another. This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: message is a human readable message indicating details about the transition. This may be an empty string.
                      type: string
                    observedGeneration:
                      description: observedGeneration represents the .metadata.generation that the condition was set based upon. For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date with respect to the current state of the instance.
                      format: int64
                      type: integer
                    reason:
                      description: reason contains a programmatic identifier indicating the reason for the condition's last transition. Producers of specific condition types may define expected values and meanings for this field, and whether the values are considered a guaranteed API. The value should be a CamelCase string. This field may not be empty.
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              health:
                description: Backend health-probe state (`spec.health.probe`), when enabled.
                nullable: true
                properties:
                  consecutiveProbeFailures:
                    description: |-
                      Consecutive failing probes accrued; reset to zero on any success. The loud
                      condition is raised only once this reaches the failure threshold.
                    format: int64
                    nullable: true
                    type: integer
                  firstFailureAt:
                    description: RFC 3339 timestamp of the first failure in the current failing streak.
                    nullable: true
                    type: string
                  lastHealthyAt:
                    description: RFC 3339 timestamp of the last *successful* probe (backend reachable, repo present).
                    nullable: true
                    type: string
                  lastProbeAt:
                    description: |-
                      RFC 3339 timestamp of the last completed probe (success or failure); drives
                      the `health_probe_due` timer so the probe re-fires on cadence.
                    nullable: true
                    type: string
                  probeAttemptAt:
                    description: |-
                      RFC 3339 timestamp at which the last backend health probe was *launched*
                      (the bootstrap Job created for it), cleared when its result is finalized.

                      This is the **launch-side** rate limit, and it is what makes the probe
                      terminate. `lastProbeAt` is written only at *finalize*, so gating the
                      launch on that alone recycles the bootstrap Job forever: the gate destroys
                      every Job whose completion would have cleared it (#273). Never compared
                      against `lastProbeAt` — see `kopiur_controller::health::probe_action`.
                    nullable: true
                    type: string
                type: object
              lastReverifyAt:
                description: |-
                  Last reverify-request token honored from a `Snapshot`'s re-probe nudge
                  (RFC3339); the loop guard that keeps each request a one-shot.
                nullable: true
                type: string
              observedGeneration:
                description: '`metadata.generation` of the `spec` last reconciled; drives staleness detection.'
                format: int64
                nullable: true
                type: integer
              parameters:
                description: |-
                  The kopia repository parameters actually observed at the last bootstrap. Compare
                  against `spec.parameters` to see whether a declared value landed.
                nullable: true
                properties:
                  blobRetention:
                    description: The blob retention the repository reports.
                    nullable: true
                    properties:
                      enabled:
                        description: |-
                          Whether the repository currently has blob retention in force (kopia's
                          `IsRetentionEnabled()`: a non-empty mode AND a non-zero period).
                        type: boolean
                      mode:
                        description: |-
                          Observed retention mode exactly as kopia reports it (`GOVERNANCE`, `COMPLIANCE`, or
                          empty when off).
                        type: string
                      period:
                        description: |-
                          Observed retention period, as a Go-style duration (`720h`). Empty-equivalent (`0s`)
                          when retention is off.
                        type: string
                    required:
                    - enabled
                    - mode
                    - period
                    type: object
                  epoch:
                    description: The epoch parameters the repository reports.
                    nullable: true
                    properties:
                      advanceOnCount:
                        description: Observed index-blob count that triggers an epoch advance.
                        format: int64
                        type: integer
                      advanceOnSizeMiB:
                        description: Observed total index size (MiB) that triggers an epoch advance.
                        format: int64
                        type: integer
                      checkpointFrequency:
                        description: Observed epochs between full index checkpoints.
                        format: int64
                        type: integer
                      cleanupSafetyMargin:
                        description: |-
                          Observed cleanup safety margin, as a Go-style duration. Reported for diagnosis;
                          not settable through `spec.parameters`.
                        type: string
                      deleteParallelism:
                        description: Observed epoch-cleanup delete parallelism.
                        format: int64
                        type: integer
                      enabled:
                        description: Whether kopia's epoch manager is enabled on this repository at all.
                        type: boolean
                      minDuration:
                        description: Observed minimum epoch age, as a Go-style duration.
                        type: string
                      refreshFrequency:
                        description: Observed epoch-state refresh frequency, as a Go-style duration.
                        type: string
                    required:
                    - advanceOnCount
                    - advanceOnSizeMiB
                    - checkpointFrequency
                    - cleanupSafetyMargin
                    - deleteParallelism
                    - enabled
                    - minDuration
                    - refreshFrequency
                    type: object
                type: object
              phase:
                description: Lifecycle phase of a repository. A freshly admitted CR starts in `Pending`.
                enum:
                - Pending
                - Initializing
                - Ready
                - Degraded
                - Failed
                nullable: true
                type: string
              resolvedCredentialVersion:
                description: '`resourceVersion` of the password Secret observed at the last connect attempt.'
                nullable: true
                type: string
              seed:
                description: |-
                  What the last seed attempt did (`spec.seed`); absent on a repository that
                  was never seeded.
                nullable: true
                properties:
                  mode:
                    description: |-
                      Which copy mechanism a seed ran. Mirrors the `SeedSource` variant, named
                      after the operation rather than the input so status, metrics
                      (`kopiur_repository_seed_total{mode}`) and docs share one vocabulary.
                    enum:
                    - blob
                    - migrate
                    nullable: true
                    type: string
                  seededAt:
                    description: |-
                      RFC 3339 timestamp the seed completed. Set once: a repository is seeded
                      exactly once, at its first bootstrap.
                    nullable: true
                    type: string
                  snapshotCount:
                    description: |-
                      Snapshots observed at the SOURCE when the seed ran. Zero is only ever
                      recorded when `allowEmptySource` permitted it.
                    format: int64
                    nullable: true
                    type: integer
                  snapshotsCopied:
                    description: |-
                      Snapshots actually copied into this repository. Migrate mode only — a
                      blob copy moves storage, not manifests, so there is no per-snapshot copy
                      count to report and it leaves this unset; its `snapshotCount` is the
                      listing taken at the SOURCE before the copy, which for a byte-for-byte
                      mirror is also what this repository ends up holding.
                    format: int64
                    nullable: true
                    type: integer
                  source:
                    description: |-
                      The source the data came from, rendered by `SeedSource::describe` —
                      the backend discriminant (`S3`, `Filesystem`, …) for blob mode,
                      `Kind/name` for migrate mode. Never a credential or a bucket path.
                    nullable: true
                    type: string
                  startedAt:
                    description: |-
                      RFC 3339 timestamp the operator LAUNCHED a seeding bootstrap Job for
                      this repository — the durable **seed-attempt marker**.

                      Stamped before the Job is created, and never cleared. Its whole job is
                      to distinguish "a seed this operator started did not finish" from "this
                      backend was initialized by somebody else": the first must resume the
                      copy, the second must keep the no-clobber `AlreadyInitialized` path.
                      See `seed_resume` — the marker is the ONLY input the resume decision is
                      allowed to take, because a resuming migrate writes into whatever
                      repository is at the backend and then re-stamps its maintenance owner.
                    nullable: true
                    type: string
                type: object
              server:
                description: Resolved kopia server endpoint/auth, pinned by the reconciler.
                nullable: true
                properties:
                  authMode:
                    description: Resolved auth mode discriminant (`Generate`/`SecretRef`/`Insecure`).
                    nullable: true
                    type: string
                  endpoint:
                    description: In-cluster endpoint, `<service>.<namespace>.svc:<port>`.
                    nullable: true
                    type: string
                  generatedSecretRef:
                    description: 'For `Generate` mode: the operator-owned Secret holding the UI credentials.'
                    nullable: true
                    properties:
                      name:
                        description: Name of the `Secret`.
                        type: string
                      namespace:
                        description: |-
                          Namespace of the `Secret`; absent = same namespace as the referrer. A
                          `ClusterRepository` is cluster-scoped and has no namespace of its own, so when IT
                          reads the `Secret` (to connect, to bootstrap, or to run its repository server) an
                          absent namespace means the operator's namespace (`KOPIUR_NAMESPACE`). A workload
                          mover (Snapshot/Restore/Maintenance) still needs the `Secret` in its OWN namespace —
                          `envFrom` is namespace-local — so put it there, or use `credentialProjection`, which
                          needs this namespace set EXPLICITLY to know what to copy. Set it whenever anything
                          other than the operator itself reads the `Secret`.
                        nullable: true
                        type: string
                    required:
                    - name
                    type: object
                  namespace:
                    description: Namespace the server objects were last applied to.
                    nullable: true
                    type: string
                  readOnly:
                    description: Effective read-only state of the served connection.
                    nullable: true
                    type: boolean
                type: object
              storageStats:
                description: Repository size and snapshot counts from the last catalog scan.
                nullable: true
                properties:
                  indexBlobCount:
                    description: Number of content-index blobs (`kopia index list`) observed at the last bootstrap.
                    format: int64
                    nullable: true
                    type: integer
                  lastObservedAt:
                    description: RFC 3339 timestamp these stats were last observed.
                    nullable: true
                    type: string
                  snapshotCount:
                    description: Total snapshots present in the repository (across all identities).
                    format: int64
                    nullable: true
                    type: integer
                  totalSize:
                    description: Human-readable total on-disk size (e.g. `412Gi`).
                    nullable: true
                    type: string
                  totalSizeBytes:
                    description: |-
                      Logical bytes under management (the integer form of `total_size`): the sum,
                      over each distinct snapshot source, of the most-recent snapshot's logical
                      size. Exposed to backup preflight as `repository.sizeBytes`. This is
                      repository *total size*, not backend free space (object stores don't report
                      remaining capacity).
                    format: int64
                    nullable: true
                    type: integer
                type: object
              uniqueId:
                description: Kopia repository unique ID.
                nullable: true
                type: string
            type: object
        required:
        - spec
        title: ClusterRepository
        type: object
    served: true
    storage: true
    subresources:
      status: {}
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: snapshotpolicies.kopiur.home-operations.com
spec:
  group: kopiur.home-operations.com
  names:
    categories:
    - kopiur
    kind: SnapshotPolicy
    plural: snapshotpolicies
    shortNames:
    - kopiasp
    singular: snapshotpolicy
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.repository.name
      name: Repository
      type: string
    - jsonPath: .status.repositorySummary
      name: Repositories
      type: string
    - jsonPath: .status.lastSuccessfulSnapshot
      name: Last-Snapshot
      type: date
    - jsonPath: .status.lastVerified
      name: Last-Verified
      type: date
    - jsonPath: .spec.suspend
      name: Suspended
      type: boolean
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Auto-generated derived type for SnapshotPolicySpec via `CustomResource`
        properties:
          spec:
            description: 'What to back up: sources, identity, retention, policy, hooks.'
            properties:
              adoption:
                description: |-
                  Whether a discovered snapshot whose resolved identity matches a live
                  `SnapshotPolicy` is automatically adopted — re-attached (stamped with that
                  policy's config label, `status.origin` flipped to `Adopted`) so GFS
                  retention governs it and eventually prunes it, instead of it sitting in the
                  catalog forever as an immortal `discovered` row.
                enum:
                - Adopt
                - Ignore
                nullable: true
                type: string
              compression:
                description: Compression algorithm + per-extension opt-outs.
                nullable: true
                properties:
                  compressor:
                    description: kopia compressor name (e.g. `zstd`); absent leaves kopia's default.
                    nullable: true
                    type: string
                  neverCompress:
                    description: Filename globs to leave uncompressed (e.g. already-compressed media).
                    items:
                      type: string
                    type: array
                type: object
              copyMethod:
                default: Snapshot
                description: 'How the source volume is captured before kopia reads it: `Snapshot` (default), `Direct`, or `Clone`.'
                enum:
                - Snapshot
                - Clone
                - Direct
                type: string
              credentialProjection:
                description: Opt-in credential-Secret projection into each backup mover's namespace (default off).
                nullable: true
                properties:
                  enabled:
                    default: false
                    description: Copy the repository's credential Secret(s) into the namespace of each mover Job; off by default.
                    type: boolean
                type: object
              defaultDeletionPolicy:
                default: Delete
                description: |-
                  Lifecycle of the underlying kopia snapshot when its `Snapshot` CR is deleted.
                  Produced backups default to `Delete`; discovered snapshots are forced to `Retain`.
                enum:
                - Delete
                - Retain
                - Orphan
                nullable: true
                type: string
              deletion:
                description: Deletion semantics for the `Snapshot` CRs carrying this recipe's config label.
                nullable: true
                properties:
                  onPolicyDelete:
                    default: Retain
                    description: |-
                      Consulted by the Snapshot finalizer when the deletion is external and the
                      owning `SnapshotPolicy` is gone. Absent resolves to `Retain`.
                    enum:
                    - Retain
                    - Delete
                    type: string
                type: object
              errorHandling:
                description: 'Backup-side error handling: let a snapshot complete-with-errors instead of failing outright.'
                nullable: true
                properties:
                  failFast:
                    description: |-
                      Abort the snapshot at the first error instead of collecting and
                      continuing (`snapshot create --fail-fast`; kopia default: false). This
                      is a `snapshot create` argv flag, not a `policy set` knob, but lives
                      beside its semantic opposites (`ignore*Errors`) for discoverability.
                    type: boolean
                  ignoreDirErrors:
                    description: Continue the snapshot when a directory cannot be read (`--ignore-dir-errors`).
                    type: boolean
                  ignoreFileErrors:
                    description: Continue the snapshot when a file cannot be read (`--ignore-file-errors`).
                    type: boolean
                  ignoreUnknownTypes:
                    description: Continue past entries of unknown type (`--ignore-unknown-types`).
                    type: boolean
                type: object
              extraArgs:
                description: Escape hatch for kopia flags not yet modeled.
                items:
                  type: string
                type: array
              files:
                description: Paths/patterns kopia should skip while snapshotting.
                nullable: true
                properties:
                  ignoreCacheDirs:
                    description: Honor `CACHEDIR.TAG`.
                    type: boolean
                  ignoreIdenticalSnapshots:
                    description: Skip taking a new snapshot when the source is identical to the previous one.
                    type: boolean
                  ignoreRules:
                    default:
                    - /lost+found
                    - System Volume Information
                    - $RECYCLE.BIN
                    - '@eaDir'
                    - .snapshot
                    description: |-
                      Filename/path globs to exclude from the snapshot (e.g. `*.tmp`, `*/cache/*`).
                      Absent ⇒ [`default_ignore_rules`] (OS-artifact junk: `/lost+found`,
                      `System Volume Information`, `$RECYCLE.BIN`, `@eaDir`, `.snapshot`). An
                      explicit list REPLACES the default wholesale (re-add any entries you
                      still want); explicit `ignoreRules: []` opts fully out. NOT
                      `skip_serializing_if` — an explicit empty list must round-trip as `[]`,
                      not vanish back to "absent" (which would silently resurrect the
                      default on the next parse).
                    items:
