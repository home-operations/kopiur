---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: GoReleaser Check

# release.yaml's plugin/goreleaser jobs only run on published releases; this
# exercises the same matrix + a Pro snapshot render on the PRs that can break
# them (dep graph, config, toolchain pins). Snapshots run keyless, so fork
# PRs get full coverage.
on:
  pull_request:
    paths:
      - .goreleaser.yaml
      - .krew.yaml
      - Cargo.toml
      - Cargo.lock
      - .mise/config.toml
      - .mise/mise.lock
      - .github/workflows/goreleaser-check.yaml
      - .github/workflows/plugin-binaries.yaml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  binaries:
    name: Binaries
    permissions:
      contents: read
    uses: $/.github/workflows/plugin-binaries.yaml

  snapshot:
    name: Snapshot
    needs: binaries
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # goreleaser derives the snapshot version from tags
          persist-credentials: false

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3

      - name: Download plugin binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: kopiur-*
          path: prebuilt

      # Workflow artifacts drop file modes.
      - name: Restore executable bits
        run: chmod +x prebuilt/kopiur-*/kopiur

      - name: Run GoReleaser (snapshot)
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser-pro # the prebuilt builder is a Pro feature
          version: "~> v2"
          args: release --clean --snapshot --skip=publish,sign
        env:
          GORELEASER_KEY: ${{ secrets.GORELEASER_KEY }}

      - name: Inspect rendered artifacts
        run: |
          echo "== cask =="
          cat dist/homebrew/Casks/kopiur.rb
          echo "== archives =="
          ls -lh dist/*.tar.gz

  # release.yaml's krew-release-bot step renders .krew.yaml only after a real
  # release. Render it here with the bot's own image against the latest
  # published release (a missing asset fails the render), then run the
  # validator krew-index's CI runs (which installs every platform) — `template`
  # alone does not validate the manifest.
  krew-template:
    name: Krew template
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false

      - name: Render .krew.yaml
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Bot image version tracks release.yaml's krew-release-bot action pin.
          tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName)
          docker run --rm -v "$PWD/.krew.yaml:/tmp/.krew.yaml:ro" \
            ghcr.io/rajatjindal/krew-release-bot:v0.0.51 \
            krew-release-bot template --tag "$tag" --template-file /tmp/.krew.yaml \
            > "$RUNNER_TEMP/kopiur.yaml"
          cat "$RUNNER_TEMP/kopiur.yaml"

      # validate-krew-manifest shells out to `kubectl krew install` for each
      # platform, so krew itself must be on PATH (the runner has kubectl only).
      - name: Install krew
        env:
          KREW_VERSION: v0.5.0
          KREW_SHA256: 5d5a221fffdf331d1c5c68d9917530ecd102e0def5b5a6d62eeed1c404efb28a
        run: |
          set -euo pipefail
          cd "$(mktemp -d)"
          base="https://github.com/kubernetes-sigs/krew/releases/download/$KREW_VERSION"
          curl -fsSLO "$base/krew.yaml"
          curl -fsSLO "$base/krew-linux_amd64.tar.gz"
          echo "$KREW_SHA256  krew-linux_amd64.tar.gz" | sha256sum -c -
          tar zxf krew-linux_amd64.tar.gz ./krew-linux_amd64
          # Installing from the manifest re-checks the archive against its sha256.
          ./krew-linux_amd64 install --manifest=krew.yaml --archive=krew-linux_amd64.tar.gz
          echo "${KREW_ROOT:-$HOME/.krew}/bin" >> "$GITHUB_PATH"

      - name: Validate rendered manifest
        run: |
          go run sigs.k8s.io/krew/cmd/validate-krew-manifest@v0.5.0 \
            -manifest "$RUNNER_TEMP/kopiur.yaml"
