---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - ".release-please-manifest.json"
  pull_request:
    branches:
      - main
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Full debuginfo overflows the standard runner disk: the all-features
  # compile-check links every gated e2e/integration test binary against the
  # whole dep tree, and with debug=2 that plus the restored cache exceeds the
  # ~14GB free ("No space left on device" → ld SIGBUS, 2026-07-24 twice).
  # line-tables-only keeps file:line backtraces for test failures.
  CARGO_PROFILE_DEV_DEBUG: "line-tables-only"
  # renovate: datasource=github-releases depName=helm-unittest/helm-unittest
  HELM_UNITTEST_VERSION: "v1.1.2"

jobs:
  cargo-audit:
    if: >-
      ${{ !(startsWith(github.head_ref, 'release-please--')
      && github.event.pull_request.head.repo.full_name == github.repository) }}
    name: Cargo Audit
    runs-on: ubuntu-24.04
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          experimental: true
          install_args: --locked

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: audit

      - name: Run audit
        run: mise run audit

  coverage:
    if: >-
      ${{ !(startsWith(github.head_ref, 'release-please--')
      && github.event.pull_request.head.repo.full_name == github.repository) }}
    name: Coverage
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          experimental: true
          install_args: --locked

      - name: Install Rust components
        run: mise run rust-components

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: coverage

      - name: Generate coverage
        run: mise run cov

      - name: Upload coverage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-lcov
          path: lcov.info

      - name: Upload to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        continue-on-error: true
        with:
          files: lcov.info
          fail_ci_if_error: false

  # One leg per shard. Each leg owns its own kind cluster (separate runner, so the
  # shared cluster name `kopiur-e2e` never collides) and runs only its test
  # binaries via KOPIUR_E2E_BINS. The discrete mise tasks are individual steps, so
  # the CI UI shows per-phase timing and a failure points straight at the shard.
  docs:
    if: ${{ github.event_name != 'push' }}
    name: Docs
    uses: $/.github/workflows/docs.yaml
    permissions:
      contents: read
    with:
      deploy: false

  e2e:
    if: >-
      ${{ github.event_name != 'push'
      && !(startsWith(github.head_ref, 'release-please--')
      && github.event.pull_request.head.repo.full_name == github.repository) }}
    name: E2E (${{ matrix.shard }})
    needs: e2e-image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false # one shard's failure shouldn't cancel the others
      matrix:
        include:
          - shard: lifecycle
            bins: "lifecycle"
            backends: false # Filesystem only — skip the backend-image preload
          - shard: restore
            bins: "restore leak_cleanup"
            backends: false # Filesystem only — the restore class needs no object store
          - shard: backends
            bins: "backends ttl_rerun"
            backends: true
          - shard: cross-ns
            bins: "cross_namespace credential_projection"
            backends: true
          - shard: misc
            bins: "object_store cache_and_events terminal_failure webhook observability"
            backends: true
          # Reconcile-quiescence guards. Both watch for CHURN over a fixed window —
          # steady_state a 45s quiet window on status/resourceVersion, health_probe a
          # 180s window on bootstrap-Job UIDs (the #273 regression guard) — so this
          # shard must not share a cluster with a binary that restarts the operator
          # (mass_deletion) or floods the apiserver. steady_state runs FIRST, on the
          # cleanest cluster: its own bound is eroded by leftover CRs' requeue ticks.
          # backends: true for health_probe's MinIO buckets; steady_state is
          # Filesystem-only and rides along.
          - shard: quiescence
            bins: "steady_state health_probe"
            backends: true
          # Deadline-kill classification, maintenance exemption, relaunch holdoff
          # and deadline escalation (#413/#414/#415). Own shard: the #415 guard
          # asserts NO new discovery Job appears inside a 90s wall-clock window,
          # so it must not compete for scheduler/apiserver latency with a noisy
          # neighbor. backends: true for its MinIO buckets.
          - shard: bootstrap-deadline
            bins: "bootstrap_deadline"
            backends: true
          # Mass-deletion protection + the batched delete dispatcher. Own shard:
          # throttle_caps_concurrent_batch_jobs patches the controller Deployment's
          # KOPIUR_MAX_CONCURRENT_DELETE_JOBS and waits out a rollout — it restores the
          # env on exit, but the restart inside that window must not race another
          # binary's reconciles. Filesystem-only (isolated repo subpaths per scenario).
          - shard: mass-deletion
            bins: "mass_deletion"
            backends: false
          # kubectl-kopiur plugin (the `run` task builds kopiur-cli before the suite)
          # + multi-cluster shared-repository scenarios. Both S3-backed, both large,
          # neither mutates the install.
          - shard: cli-multicluster
            bins: "cli multi_cluster"
            backends: true
          # Workload identity (auth.workloadIdentity): full S3 pipeline with NO
          # static keys via the anonymous-policy bucket + kopia's ambient chain,
          # plus the Job-shape and missing-SA-condition assertions.
          - shard: workload-identity
            bins: "workload_identity import"
            backends: true
          # ADR-0004/0005 reshape scenarios (Filesystem only). Split in two so the
          # cron-driven verify/replication waits don't push one shard past the job
          # timeout. `csi: true` installs the CSI snapshot stack (csi-hostpath-sc) so
          # the populator-restore handshake (repository_lifecycle) and copyMethod
          # Snapshot/Clone (copy_methods) tests run for real instead of self-skipping.
          - shard: reshape-core
            bins: "mover_config data_integrity repository_lifecycle tenancy copy_methods"
            backends: false
            csi: true
          # Hooks (ADR §4.8) + GFS time-bucketed retention + policy knobs. The
          # httpRequest hook reuses the WebDAV fixture as its receiver, so this
          # shard preloads the backend images.
          - shard: hooks-retention
            bins: "hooks retention policy_knobs adoption"
            backends: true
          - shard: reshape-async
            bins: "verification replication"
            backends: false
          # SnapshotReplication (issue #368): logical snapshot-level replication
          # via `kopia snapshot migrate`. Cron-driven multi-minute waits like
          # reshape-async, but four scenarios each provisioning a two-repository
          # fixture — its own shard keeps it and the other async cron suites
          # under the job timeout. Filesystem only.
          - shard: snapshot-replication
            bins: "snapshot_replication"
            backends: false
          # Repository `spec.seed` DR drill (issue #380): rebuild a repository
          # from a surviving replica, in both modes, and restore its recovered
          # history. Its own shard for two reasons. It is long — each scenario
          # chains a real backup, a cron-driven mirror or a full
          # `snapshot migrate`, a seeding bootstrap and a restore — and the
          # empty-source scenario deliberately leaves a repository RETRYING its
          # seed every ~2 minutes, which is exactly the background churn the
          # quiescence and mass-deletion shards measure against. Filesystem
          # only: both seed modes are exercised over isolated repo subpaths, so
          # no object store is needed. The migrate mode's cross-namespace
          # credential projection needs `features.credentialProjection.enabled`,
          # which deploy/e2e/values.yaml already sets for EVERY shard — hence no
          # helm_set here.
          - shard: repository-seed
            bins: "seed"
            backends: false
          # SnapshotPolicy multi-repository fan-out (issue #368 Feature B): one
          # policy fanning every slot into TWO repositories — per-repo children
          # + spec pins, keepLatest-per-repo retention, the one-repo-down
          # partial-progress gate + recovery, per-repo verification, and the
          # fromPolicy-selection / unpinned-child / hooks×repositories admission
          # refusals. Filesystem only; several scenarios each provisioning a
          # two-repository fixture — like snapshot-replication, its own shard
          # keeps it under the job timeout.
          - shard: multi-repository
            bins: "multi_repository"
            backends: false
          # Staging deadline + staged-PVC overrides/bind race (#198, #223): the
          # deadline tests quiesce kube-system/snapshot-controller (they own
          # VolumeSnapshot status while it's down), which no other test may
          # race, so this shard owns its cluster. Needs the CSI snapshot stack.
          - shard: staging
            bins: "staging_deadline staging_overrides"
            backends: false
            csi: true
          # #346 multi-PVC: pvcSelector fan-out + the shared VolumeGroupSnapshot
          # capture. Its own shard because group snapshots need the
          # `groupsnapshot.storage.k8s.io` CRDs AND
          # `--feature-gates=CSIVolumeGroupSnapshot=true` on both the
          # snapshot-controller and the csi-snapshotter sidecar (Beta since
          # external-snapshotter 8.2, but still default-OFF) — a stack shape no
          # other shard uses, and one that would drag every CSI shard along if it
          # regressed.
          - shard: multi-pvc
            bins: "multi_pvc_group"
            backends: false
            csi: true
          # #443 populator fan-out: ONE populator Restore fills EVERY claiming
          # PVC, each from its own per-PVC kopia source path. Its own shard
          # because it deletes and re-creates the source PVCs a selector policy
          # matches — any scenario sharing the namespace and the `backup=` label
          # space would see its volumes disappear mid-run — and because the
          # cross-volume assertion needs a populator-aware CSI provisioner
          # (the static hostPath PVCs share one source dir, so they cannot prove
          # isolation). No group-snapshot CRDs: `groupBy: None` + `copyMethod:
          # Direct`.
          - shard: populator-fanout
            bins: "populator_fanout"
            backends: false
            csi: true
          # securityContext-compatibility pipeline: pvcConsumer auto-derive + the
          # SecurityContextCompatible reconcile condition. Filesystem only.
          - shard: security-context-compat
            bins: "security_context_compat colocation preflight unchanged_snapshot"
            backends: false
          # Leader election (--leader-elect, chart default): Lease held by the
          # controller pod, single holder at 2 replicas, failover on holder
          # deletion, and the NEW leader reconciling a backup. Own shard: it
          # scales the operator Deployment, which no other test may race.
          - shard: leader-election
            bins: "leader_election"
            backends: false
          # API-server disruption resilience, two scenarios:
          #   flap  (the 2026-07 EMFILE incident) — kills the kind
          #         kube-apiserver repeatedly under a seeded fleet; the
          #         controller must survive (no EMFILE in logs, bounded
          #         restarts/lease transitions) and converge (a post-flap
          #         backup Succeeds).
          #   stall (#319) — SIGSTOPs the apiserver for a hold inside the renew
          #         window; leadership must be RETAINED with zero abdications,
          #         transitions or restarts. A killed apiserver gives fast
          #         errors, which the pre-fix renew loop handled — only a STALL
          #         reproduces #319, which is why flap ran green all through
          #         that incident.
          # Own shard: it takes the control plane down, which no other test may
          # race.
          - shard: apiserver-flap
            bins: "apiserver_flap"
            backends: false
          # Repository circuit breaker (#345): patches the shared minio Service's
          # selector to a non-matching label mid-test, taking the S3 backend down
          # for the whole cluster until the scenario heals it — no other binary
          # may race that outage, so this shard owns its cluster.
          - shard: repo-breaker
            bins: "repo_breaker"
            backends: true
          # Per-repository mover-Job concurrency (spec.concurrency.maxConcurrentJobs
          # + the KOPIUR_MAX_CONCURRENT_JOBS backstop). Own shard for two
          # independent reasons: every scenario swaps the operator's
          # KOPIUR_MOVER_IMAGE for the slow-mover fixture and waits out a
          # rollout (so the whole cluster's movers crawl inside the window),
          # and the backstop scenario additionally patches the controller's env
          # and waits out two more rollouts. Both restore on exit, but the
          # restarts inside those windows must not race another binary's
          # reconciles. Filesystem only (isolated repo subpaths per scenario).
          # Also carries the `concurrencyPolicy: Replace` scenario, which runs an
          # every-minute schedule and deliberately TRIPS its own repository's
          # mass-deletion breaker (threshold 1 + a held decoy wave) so the
          # replaced run's operator-prune exemption is measured against a breaker
          # that is actually firing. Both are scoped to `conc-replace`, but any
          # other binary sharing that repo would be caught in the held wave.
          - shard: concurrency
            bins: "concurrency"
            backends: false
          # Namespaced install (installScope=namespaced, Role-only RBAC): the
          # operator must reconcile its release namespace (the pre-scoping
          # controller sat Ready-but-inert on 403'd cluster-wide watches) and
          # must ignore foreign namespaces + ClusterRepository. helm_set
          # reshapes the install, so this shard owns its cluster. The test
          # detects the deployed scope from the controller Deployment's args
          # itself, so no further env wiring can silently skip it.
          - shard: install-scope
            bins: "install_scope"
            backends: false
            helm_set: "installScope=namespaced"
          # The web console. Own shard, and the only one that installs it: `ui: "1"`
          # opts the console image into `images-load` AND layers
          # deploy/e2e/values-ui.yaml onto the install (see crates/e2e/mise.toml),
          # which every other shard would otherwise pay for in kind-load time and
          # an extra Deployment. It is also the only shard that binds a browse
          # role to a NON-ADMIN subject, which is what makes it the one place an
          # RBAC verb missing from that role can be caught. Filesystem only.
          - shard: ui
            bins: "ui"
            backends: false
            ui: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # kind, kubectl, helm, and the Rust toolchain come from .mise/config.toml.
      - name: Setup Mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          experimental: true
          install_args: --locked

      # Booting the node container and restoring the cache + image artifacts
      # share no inputs, so they overlap: the cluster is not needed until the
      # images are in the local daemon and ready to side-load.
      - name: Create kind cluster
        id: cluster
        background: true
        run: mise run //crates/e2e:cluster-create

      # Separate key from the build job: the shards compile the e2e *test* crate
      # (debug), not the release images, so they shouldn't thrash that cache.
      - name: Setup Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: e2e-test

      # Pull every per-image artifact (one per build matrix leg) into the workdir.
      - name: Download images
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: e2e-image-*
          merge-multiple: true

      - name: Load images into docker
        run: |
          set -eu
          for tar in image-*.tar.gz; do docker load -i "$tar"; done

      - wait: [cluster]

      - name: Load images into kind
        env:
          # Side-load the console image too, on the shard that installs it.
          KOPIUR_E2E_UI: ${{ matrix.ui || '' }}
        run: mise run //crates/e2e:images-load

      # Backend-server images (MinIO/mc, SFTP, WebDAV). The lifecycle shard is
      # Filesystem-only, so it skips this pull entirely.
      - name: Preload backend images
        if: matrix.backends
        run: mise run //crates/e2e:minio-preload

      - name: Seed node fixtures
        run: mise run //crates/e2e:node-seed

      # CSI snapshot stack (vendored, hermetic): csi-hostpath-sc + a default
      # VolumeSnapshotClass. Required by the populator-restore handshake and the
      # copyMethod Snapshot/Clone tests; those tests SKIP without it, so a shard that
      # runs them must opt in via `csi: true`. Installed before the chart, matching
      # scripts/with-kind.sh's ordering.
      - name: Install CSI snapshot stack
        if: matrix.csi
        run: mise run //crates/e2e:snapshot-stack

      - name: Install chart
        env:
          # Optional per-shard chart reshape (e.g. installScope=namespaced).
          KOPIUR_E2E_HELM_SET: ${{ matrix.helm_set || '' }}
          # Layers deploy/e2e/values-ui.yaml and pre-creates the proxy-token
          # Secret the console Deployment mounts.
          KOPIUR_E2E_UI: ${{ matrix.ui || '' }}
        run: mise run //crates/e2e:helm

      - name: Run e2e tests
        env:
          KOPIUR_E2E_BINS: ${{ matrix.bins }}
          KOPIUR_E2E_SKIP_BUILD: "1"
          # On a `csi: true` shard the stack is installed above, so a missing
          # csi-hostpath-sc is a setup failure — make the CSI-dependent tests
          # HARD-FAIL instead of silently skipping (which once let a populator
          # regression ship green; see #121).
          KOPIUR_E2E_REQUIRE_CSI: ${{ matrix.csi && '1' || '' }}
        run: mise run //crates/e2e:run

      # Dump cluster state for this shard before teardown so a failure is
      # debuggable (the cluster is gone after the next step).
      - name: Diagnostics
        if: failure()
        run: mise run //crates/e2e:diagnostics

      - name: Tear down
        if: always()
        run: mise run //crates/e2e:down

  # Build the component images concurrently — one matrix leg per image — so
  # the wall-clock for this stage is the single slowest image, not the sum of
  # them all. Each leg saves its own :e2e image as a separate artifact for the test
  # shards to load. Per-image Rust cache keys keep the legs from contending on one
  # shared cache.
  e2e-image:
    if: >-
      ${{ github.event_name != 'push'
      && !(startsWith(github.head_ref, 'release-please--')
      && github.event.pull_request.head.repo.full_name == github.repository) }}
    name: E2E Image (${{ matrix.image }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false # one image's failure shouldn't cancel the others
      matrix:
        include:
          - image: controller
            task: image-controller
          - image: webhook
            task: image-webhook
          - image: mover
            task: image-mover
          # Built on every PR even though no shard installs the console yet:
          # this leg IS the gate that a broken docker/Dockerfile.ui reddens
          # review instead of the release. It needs no entry in `status.needs`
          # — that list already carries `e2e-image`, and a matrix job fails as
          # a whole when any leg fails, so a new leg cannot be forgotten there.
          # Loading it into kind is opt-in (KOPIUR_E2E_UI=1, see
          # crates/e2e/mise.toml); the tarball is uploaded regardless so a shard
          # that enables the UI needs only that env var.
          - image: ui
            task: image-ui
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          experimental: true
          install_args: --locked

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: e2e-build-${{ matrix.image }}

      - name: Build component image
        env:
          KOPIUR_IMAGE_PREFIX: kopiur
          KOPIUR_IMAGE_TAG: e2e
        run: mise run //:${{ matrix.task }}

      # Every shard downloads every image, so the tarballs cross the
      # artifact store dozens of times per run and are worth compressing. gzip
      # because the daemon may export layers uncompressed depending on its image
      # store, and docker load reads either. shell: bash for the pipefail the
      # implicit `bash -e` default lacks -- a failed save would otherwise leave
      # gzip's exit status to pass the step and hand every shard a truncated
      # tarball.
      - name: Save image
        shell: bash
        run: docker save kopiur/${{ matrix.image }}:e2e | gzip -1 > image-${{ matrix.image }}.tar.gz

      - name: Upload image
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-image-${{ matrix.image }}
          path: image-${{ matrix.image }}.tar.gz
          retention-days: 1

  # Publish the exact images the e2e shards ran against, tagged for this pull
  # request, so a reviewer can pull a build instead of reproducing one. The
  # bytes are the artifact `e2e-image` already produced and the shards already
  # tested -- not a rebuild, which could differ.
  #
  # Deliberately a separate job rather than a push step inside `e2e-image`: the
  # shards need only the tarball, and a registry outage must not strand
  # seventeen of them behind a failed `needs`.
  #
  # Skipped for pull requests from forks. GITHUB_TOKEN is read-only there no
  # matter what `permissions:` asks for, so the push could only fail; `status`
  # counts a skip as a pass.
  pr-image:
    if: >-
      ${{ github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
      && !startsWith(github.head_ref, 'release-please--') }}
    name: PR Image (${{ matrix.image }})
    needs: e2e-image
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false # one image's registry failure shouldn't hide the others
      matrix:
        image:
          - controller
          - webhook
          - mover
          - ui
    steps:
      - name: Download image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: e2e-image-${{ matrix.image }}

      - name: Load image
        env:
          IMAGE: ${{ matrix.image }}
        run: docker load -i "image-${IMAGE}.tar.gz"

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Two tags. `pr-<n>` moves with the branch, so a reviewer can keep
      # re-pulling one reference; `pr-<n>-<sha>` is immutable, so they can pin
      # the build they actually tested. The sha names the head commit, though
      # the image was built from CI's merge of it into the base -- which is the
      # thing under review.
      #
      # Same package as the release (`kopiur-<component>`), so a preview and a
      # release differ only by tag and the chart needs no `repository` override
      # to run one. It does need `digest: ""`: release-please pins a digest into
      # the shipped chart and `_helpers.tpl` lets a digest beat a tag, so a
      # `tag` override alone would silently install the release instead.
      - name: Tag and push
        shell: bash
        env:
          IMAGE: ${{ matrix.image }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          target="ghcr.io/${REPO}-${IMAGE}"
          moving="${target}:pr-${PR}"
          pinned="${target}:pr-${PR}-${HEAD_SHA:0:7}"
          docker tag "kopiur/${IMAGE}:e2e" "${moving}"
          docker tag "kopiur/${IMAGE}:e2e" "${pinned}"
          docker push "${moving}"
          docker push "${pinned}"
          # The controller's image block is the chart's root `image:` -- it is
          # the operator -- while the other three nest under their component.
          case "${IMAGE}" in
            controller) values="image" ;;
            *) values="${IMAGE}.image" ;;
          esac
          {
            echo "### \`${IMAGE}\`"
            echo
            echo '```'
            echo "docker pull ${pinned}"
            echo '```'
            echo
            echo "Also tagged \`pr-${PR}\`, which moves with the branch."
            echo
            echo "To run it from the chart, override the tag **and clear the"
            echo "digest** -- a pinned digest beats a tag, so setting the tag"
            echo "alone installs the release:"
            echo
            echo '```'
            echo "--set ${values}.tag=pr-${PR}-${HEAD_SHA:0:7} \\"
            echo "--set ${values}.digest="
            echo '```'
            echo
            echo "linux/amd64 only: a preview reuses the image the e2e shards" \
                 "ran, built natively on the runner. Releases stay amd64+arm64."
          } >> "${GITHUB_STEP_SUMMARY}"

  # Publish the chart itself per pull request, so trying a branch in a GitOps
  # repo is a one-line tag bump on an OCIRepository that already exists --
  # rather than swapping the chart source to a GitRepository and back. A chart
  # change is only really reviewable by rendering it where it will run.
  #
  # Two versions, mirroring the image tags: `<base>-pr<n>` moves with the
  # branch, `<base>-pr<n>.g<sha>` does not. Helm demands SemVer2 and the OCI tag
  # IS the chart version, so the tags cannot read `pr-460` the way the images
  # do; they are prerelease identifiers on the current chart version. The `g`
  # before the sha is not decoration -- a bare 7-hex sha that happens to be all
  # digits and starts with `0` is a leading-zero numeric identifier, which is
  # invalid SemVer, and this job would fail for one commit in a few hundred.
  #
  # appVersion is the PR image tag, so the chart resolves all four component
  # images to this same commit's builds. Chart and binaries from one commit is
  # the only combination anything tested; override `<component>.image.tag` to
  # mix a released binary back in.
  pr-chart:
    if: >-
      ${{ github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
      && !startsWith(github.head_ref, 'release-please--') }}
    name: PR Chart
    # pr-image so the chart is never published pointing at images that do not
    # exist yet; the two chart gates so a chart failing its own tests is never
    # published at all.
    needs:
      - pr-image
      - helm-lint
      - helm-unittest
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          experimental: true
          install_args: --locked

      # helm reads the docker config this writes for OCI registry auth, which is
      # how the release job authenticates its own `helm push`.
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Package and push chart
        shell: bash
        env:
          OWNER: ${{ github.repository_owner }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          base="$(yq '.version' deploy/helm/kopiur/Chart.yaml)"
          sha="${HEAD_SHA:0:7}"
          apptag="pr-${PR}-${sha}"
          moving="${base}-pr${PR}"
          pinned="${base}-pr${PR}.g${sha}"
          for version in "${moving}" "${pinned}"; do
            helm package deploy/helm/kopiur \
              --version "${version}" \
              --app-version "${apptag}"
            helm push "kopiur-${version}.tgz" "oci://ghcr.io/${OWNER}/charts"
          done
          {
            echo "### Chart"
            echo
            echo "Point an existing \`OCIRepository\` at this build by changing"
            echo "one line -- no chart-source swap:"
            echo
            echo '```yaml'
            echo "  ref:"
            echo "    tag: \"${pinned}\"   # moving: ${moving}"
            echo "  url: oci://ghcr.io/${OWNER}/charts/kopiur"
            echo '```'
            echo
            echo "Its appVersion is \`${apptag}\`, so all four component images"
            echo "resolve to this commit's builds with no image overrides. The"
            echo "console still needs \`ui.enabled: true\` -- it is opt-in."
          } >> "${GITHUB_STEP_SUMMARY}"

  helm-lint:
    if: >-
      ${{ !(startsWith(github.head_ref, 'release-please--')
      && github.event.pull_request.head.repo.full_name == github.repository) }}
    name: Helm Lint
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          experimental: true
          install_args: --locked

      - name: Run helm lint
        run: mise run helm-lint

      - name: Check chart docs are current
        run: mise run helm-docs-check

  helm-unittest:
    if: >-
      ${{ !(startsWith(github.head_ref, 'release-please--')
      && github.event.pull_request.head.repo.full_name == github.repository) }}
    name: Helm Unittest
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          experimental: true
          install_args: --locked

      - name: Run helm unit tests
        run: |
          helm plugin install https://github.com/helm-unittest/helm-unittest --version "${HELM_UNITTEST_VERSION}" --verify=false
          mise run helm-test

  integration-test:
    if: >-
      ${{ !(startsWith(github.head_ref, 'release-please--')
      && github.event.pull_request.head.repo.full_name == github.repository) }}
    name: Integration Test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          experimental: true
          install_args: --locked

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # -v2: see the tests cache note — debuginfo profile changed.
          shared-key: integration-v2

      - name: Create kind cluster
        uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
        with:
          cluster_name: kopiur-it

      - name: Apply CRDs
        # Server-side apply is required: the BackupConfig CRD embeds a full
        # JobSpec (runJob hook) and exceeds the 256KB last-applied-configuration
        # annotation that a client-side apply would create.
        run: |
          cargo xtask gen-crds
          kubectl apply --server-side -f deploy/crds/all-crds.yaml

      - name: Run integration tests
        run: cargo test --workspace --features integration --locked -- --include-ignored

  rust-lint:
    if: >-
      ${{ !(startsWith(github.head_ref, 'release-please--')
      && github.event.pull_request.head.repo.full_name == github.repository) }}
    name: Rust Lint
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          experimental: true
          install_args: --locked

      - name: Install Rust components
        run: mise run rust-components

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: lint

      - name: Check formatting
        run: mise run fmt-check

      - name: Run linter
        run: mise run clippy

  rust-test:
    if: >-
      ${{ !(startsWith(github.head_ref, 'release-please--')
      && github.event.pull_request.head.repo.full_name == github.repository) }}
    name: Rust Test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          experimental: true
          install_args: --locked

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # -v2: the debuginfo profile changed (CARGO_PROFILE_DEV_DEBUG above);
          # a restored full-debug cache would double disk during the rebuild.
          shared-key: tests-v2

      - name: Build workspace
        run: mise run build

      - name: Run unit tests
        run: mise run test

      - name: Check generated manifests
        run: mise run gen-check

      # gen-check proves the YAML matches the Rust types; this proves something
      # actually READS each field. See #346 / #351 — both shipped as fields that
      # were schema-valid, documented, admission-accepted, and inert.
      - name: Check CRD field wiring
        run: mise run wiring-check

      # The compiler enforces exhaustiveness only where an exhaustive `match`
      # was written. `matches!`, a `_ =>` arm and `==` against one variant all
      # opt out of it silently — see #351 (`Unchanged` swallowed by `_ =>`) and
      # #359 (doctor all-green over a Snapshot parked on a condition the CLI
      # had never heard of).
      - name: Check phase-handling exhaustiveness
        run: mise run phase-check

  ui:
    if: >-
      ${{ !(startsWith(github.head_ref, 'release-please--')
      && github.event.pull_request.head.repo.full_name == github.repository) }}
    name: Web UI
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          experimental: true
          install_args: --locked

      # `ui-types` runs `cargo xtask gen-ui-types`, so this job compiles the
      # xtask binary and kopiur-ui-model. Its own cache key: the Rust jobs build
      # a far larger dependency set and sharing one would evict theirs.
      - name: Setup Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ui

      - name: Install SPA dependencies
        run: mise run ui-install

      # Regenerate rather than only `--check`: `ui-check`'s `git diff` then
      # fails on a hand-edited generated file AND on one that is stale relative
      # to `crates/ui-model`, with the offending diff printed in the log.
      - name: Generate TypeScript wire types
        run: mise run ui-types

      - name: Check the SPA (tsc, eslint, vitest, generated-type drift)
        run: mise run ui-check

      - name: Build the SPA bundle
        run: mise run ui-build

  workflow-lint:
    if: >-
      ${{ !(startsWith(github.head_ref, 'release-please--')
      && github.event.pull_request.head.repo.full_name == github.repository) }}
    name: Workflow Lint
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: false

      - name: Resolve linter versions
        id: tools
        run: |
          echo "actionlint=$(mise config get tools.actionlint)" >> "$GITHUB_OUTPUT"
          echo "zizmor=$(mise config get tools.zizmor)" >> "$GITHUB_OUTPUT"

      - name: Lint workflows
        uses: home-operations/.github/actions/workflow-lint@69cad1e407df8070dd9cfc3314551e473544014e # workflow-lint-v1.0.3
        with:
          actionlint-version: ${{ steps.tools.outputs.actionlint }}
          zizmor-version: ${{ steps.tools.outputs.zizmor }}

  status:
    if: ${{ !cancelled() }}
    name: Build Success
    needs:
      - cargo-audit
      - coverage
      - docs
      - e2e
      - e2e-image
      - helm-lint
      - helm-unittest
      - integration-test
      - pr-chart
      - pr-image
      - rust-lint
      - rust-test
      - ui
      - workflow-lint
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      # cancelled counts as failed: !cancelled() above still runs this job when
      # individual needs were cancelled but the run was not, and a required job
      # that never reached a verdict must not clear the merge gate. The e2e
      # matrix is fail-fast: false across seventeen shards, so a superseded push
      # cancelling them is the common case, not a corner one.
      - name: Any jobs failed?
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          exit 1

      - name: All jobs passed or skipped?
        if: ${{ !(contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) }}
        run: |
          echo "All jobs passed or skipped" && echo "${{ toJSON(needs.*.result) }}"
