---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Release

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "plugins/**"
  release:
    types:
      - published

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' }}

jobs:
  versions:
    name: Versions
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      kopia-version: ${{ steps.versions.outputs.kopia-version }}
      rust-version: ${{ steps.versions.outputs.rust-version }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Mise
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          cache: false
          experimental: true
          install: false

      - name: Resolve versions
        id: versions
        run: |
          echo "kopia-version=$(mise config get tools.kopia)" >> "$GITHUB_OUTPUT"
          echo "rust-version=$(mise config get tools.rust.version)" >> "$GITHUB_OUTPUT"

  # Build each component image in its own job (not a matrix over the reusable
  # workflow). The chart pins all three image digests at release time, and a
  # matrix collapses needs.<job>.outputs.digest to a single value — three
  # separate jobs keep each builder's first-class `digest` output addressable.
  release-controller:
    name: Release (controller)
    needs: versions
    permissions:
      contents: read
      id-token: write
      packages: write
    uses: docker/github-builder/.github/workflows/build.yml@5f637c833aa76bc99372a1dc9a6f8bcd8056fb85 # v1.12.0
    with:
      build-args: |
        VERSION=${{ github.ref_name }}
        REVISION=${{ github.sha }}
        KOPIA_VERSION=${{ needs.versions.outputs.kopia-version }}
        RUST_VERSION=${{ needs.versions.outputs.rust-version }}
        BIN=kopiur-controller
      cache: true
      cache-scope: controller
      file: docker/Dockerfile
      meta-images: ghcr.io/${{ github.repository }}-controller
      meta-tags: |
        type=semver,pattern={{version}}
        type=semver,pattern={{major}}.{{minor}}
        type=raw,value=rolling,enable=${{ github.event_name == 'release' }}
        type=ref,event=branch
      output: image
      platforms: linux/amd64,linux/arm64
      push: true
      sbom: true
      set-meta-annotations: true
      set-meta-labels: true
      sign: true
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

  release-webhook:
    name: Release (webhook)
    needs: versions
    permissions:
      contents: read
      id-token: write
      packages: write
    uses: docker/github-builder/.github/workflows/build.yml@5f637c833aa76bc99372a1dc9a6f8bcd8056fb85 # v1.12.0
    with:
      build-args: |
        VERSION=${{ github.ref_name }}
        REVISION=${{ github.sha }}
        KOPIA_VERSION=${{ needs.versions.outputs.kopia-version }}
        RUST_VERSION=${{ needs.versions.outputs.rust-version }}
        BIN=kopiur-webhook
      cache: true
      cache-scope: webhook
      file: docker/Dockerfile
      meta-images: ghcr.io/${{ github.repository }}-webhook
      meta-tags: |
        type=semver,pattern={{version}}
        type=semver,pattern={{major}}.{{minor}}
        type=raw,value=rolling,enable=${{ github.event_name == 'release' }}
        type=ref,event=branch
      output: image
      platforms: linux/amd64,linux/arm64
      push: true
      sbom: true
      set-meta-annotations: true
      set-meta-labels: true
      sign: true
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

  release-mover:
    name: Release (mover)
    needs: versions
    permissions:
      contents: read
      id-token: write
      packages: write
    uses: docker/github-builder/.github/workflows/build.yml@5f637c833aa76bc99372a1dc9a6f8bcd8056fb85 # v1.12.0
    with:
      build-args: |
        VERSION=${{ github.ref_name }}
        REVISION=${{ github.sha }}
        KOPIA_VERSION=${{ needs.versions.outputs.kopia-version }}
        RUST_VERSION=${{ needs.versions.outputs.rust-version }}
      cache: true
      cache-scope: mover
      file: docker/Dockerfile.mover
      meta-images: ghcr.io/${{ github.repository }}-mover
      meta-tags: |
        type=semver,pattern={{version}}
        type=semver,pattern={{major}}.{{minor}}
        type=raw,value=rolling,enable=${{ github.event_name == 'release' }}
        type=ref,event=branch
      output: image
      platforms: linux/amd64,linux/arm64
      push: true
      sbom: true
      set-meta-annotations: true
      set-meta-labels: true
      sign: true
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

  helm:
    name: Helm
    needs:
      - release-controller
      - release-webhook
      - release-mover
    if: ${{ github.event_name == 'release' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write # keyless Cosign signing of the published chart
      packages: write
    env:
      VERSION: ${{ github.event.release.tag_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Mise
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          cache: false
          experimental: true
          install_args: --locked

      - name: Check generated manifests
        run: cargo xtask gen-all --check

      # Pin all three component images to the exact digests the builder produced
      # — each build job's first-class `digest` output (the signed multi-arch
      # index) — so the released chart references immutable images instead of
      # floating tags. Fail closed if any digest is missing. Only the packaged
      # copy is rewritten; the repo keeps empty digests (floating tags for dev).
      - name: Pin the released image digests into the chart
        env:
          CONTROLLER_DIGEST: ${{ needs.release-controller.outputs.digest }}
          WEBHOOK_DIGEST: ${{ needs.release-webhook.outputs.digest }}
          MOVER_DIGEST: ${{ needs.release-mover.outputs.digest }}
        run: |
          for pair in "controller:${CONTROLLER_DIGEST}" "webhook:${WEBHOOK_DIGEST}" "mover:${MOVER_DIGEST}"; do
            comp="${pair%%:*}"
            digest="${pair#*:}"
            case "${digest}" in
              sha256:*) ;;
              *) echo "build produced no digest for ${comp} (got: '${digest}')"; exit 1 ;;
            esac
            yq -i ".image.${comp}.digest = \"${digest}\"" deploy/helm/kopiur/values.yaml
            echo "pinned ${comp} -> ${digest}"
          done

      - name: Package Helm chart
        run: |
          helm package deploy/helm/kopiur \
            --version "${VERSION}" \
            --app-version "${VERSION}"

      - name: Log in to Container Registry
        uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4 # v4.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Helm chart to GHCR
        run: |-
          helm push "kopiur-${VERSION}.tgz" "oci://ghcr.io/${{ github.repository_owner }}/charts"

      - name: Sign the published chart with Cosign
        run: |-
          cosign sign --yes "ghcr.io/${{ github.repository_owner }}/charts/kopiur:${VERSION}"

  # The kubectl plugin (kubectl-kopiur): one goreleaser run builds all four
  # targets, attaches archives + split sha256s + SBOMs + cosign signatures to
  # the release, commits the Homebrew cask to home-operations/homebrew-tap
  # (like flate/yayamlls), and commits the krew manifest to THIS repo's
  # plugins/ directory — the kopiur repository doubles as its own krew custom
  # index. The krew push uses GITHUB_TOKEN, which cannot retrigger workflows.
  #
  # Runs on macOS: goreleaser's rust builder links every target with zig via
  # cargo-zigbuild (musl keeps Linux fully static), and security-framework-sys
  # (in kube's dependency graph) emits `-framework Security` link flags that
  # only resolve against a real macOS SDK. mise provides the pinned toolchain:
  # rust (+ the four target stdlibs), zig, cargo-zigbuild, and cosign.
  goreleaser:
    name: GoReleaser
    if: ${{ github.event_name == 'release' }}
    runs-on: macos-15
    permissions:
      contents: write # attach artifacts to the release + push the krew manifest
      id-token: write # keyless Cosign signing of the artifacts
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Mise
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          cache: false
          experimental: true
          install_args: --locked

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0

      # One short-lived bot token scoped to exactly the two repos goreleaser
      # pushes to: the tap (Homebrew cask) and this repo (krew manifest into
      # plugins/). Bot-token pushes retrigger workflows — every on-push workflow
      # here ignores plugins/**, so the manifest commit fans out nothing.
      - name: Generate Bot Token
        id: bot-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.BOT_CLIENT_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: homebrew-tap,kopiur
          permission-contents: write

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@5daf1e915a5f0af01ddbcd89a43b8061ff4f1a89 # v7.2.2
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ steps.bot-token.outputs.token }}
          KREW_INDEX_TOKEN: ${{ steps.bot-token.outputs.token }}
