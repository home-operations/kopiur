---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Release

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "plugins/**"
  release:
    types:
      - published

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' }}

jobs:
  versions:
    name: Versions
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      kopia-version: ${{ steps.versions.outputs.kopia-version }}
      rust-version: ${{ steps.versions.outputs.rust-version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Mise
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          cache: false
          experimental: true
          install: false

      - name: Resolve versions
        id: versions
        run: |
          echo "kopia-version=$(mise config get tools.kopia)" >> "$GITHUB_OUTPUT"
          echo "rust-version=$(mise config get tools.rust.version)" >> "$GITHUB_OUTPUT"

  # Build each component image in its own job (not a matrix over the reusable
  # workflow). The chart pins all three image digests at release time, and a
  # matrix collapses needs.<job>.outputs.digest to a single value — three
  # separate jobs keep each builder's first-class `digest` output addressable.
  release-controller:
    name: Release (controller)
    needs: versions
    permissions:
      contents: read
      id-token: write
      packages: write
    uses: docker/github-builder/.github/workflows/build.yml@27ade872c1e2296e62ef15ab3b10d37665e57cf7 # v1.15.0
    with:
      build-args: |
        VERSION=${{ github.ref_name }}
        REVISION=${{ github.sha }}
        KOPIA_VERSION=${{ needs.versions.outputs.kopia-version }}
        RUST_VERSION=${{ needs.versions.outputs.rust-version }}
        BIN=kopiur-controller
      cache: true
      cache-scope: controller
      file: docker/Dockerfile
      meta-images: ghcr.io/${{ github.repository }}-controller
      meta-tags: |
        type=semver,pattern={{version}}
        type=semver,pattern={{major}}.{{minor}}
        type=raw,value=rolling,enable=${{ github.event_name == 'release' }}
        type=ref,event=branch
      output: image
      platforms: linux/amd64,linux/arm64
      push: true
      sbom: true
      set-meta-annotations: true
      set-meta-labels: true
      sign: true
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

  release-webhook:
    name: Release (webhook)
    needs: versions
    permissions:
      contents: read
      id-token: write
      packages: write
    uses: docker/github-builder/.github/workflows/build.yml@27ade872c1e2296e62ef15ab3b10d37665e57cf7 # v1.15.0
    with:
      build-args: |
        VERSION=${{ github.ref_name }}
        REVISION=${{ github.sha }}
        KOPIA_VERSION=${{ needs.versions.outputs.kopia-version }}
        RUST_VERSION=${{ needs.versions.outputs.rust-version }}
        BIN=kopiur-webhook
      cache: true
      cache-scope: webhook
      file: docker/Dockerfile
      meta-images: ghcr.io/${{ github.repository }}-webhook
      meta-tags: |
        type=semver,pattern={{version}}
        type=semver,pattern={{major}}.{{minor}}
        type=raw,value=rolling,enable=${{ github.event_name == 'release' }}
        type=ref,event=branch
      output: image
      platforms: linux/amd64,linux/arm64
      push: true
      sbom: true
      set-meta-annotations: true
      set-meta-labels: true
      sign: true
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

  release-mover:
    name: Release (mover)
    needs: versions
    permissions:
      contents: read
      id-token: write
      packages: write
    uses: docker/github-builder/.github/workflows/build.yml@27ade872c1e2296e62ef15ab3b10d37665e57cf7 # v1.15.0
    with:
      build-args: |
        VERSION=${{ github.ref_name }}
        REVISION=${{ github.sha }}
        KOPIA_VERSION=${{ needs.versions.outputs.kopia-version }}
        RUST_VERSION=${{ needs.versions.outputs.rust-version }}
      cache: true
      cache-scope: mover
      file: docker/Dockerfile.mover
      meta-images: ghcr.io/${{ github.repository }}-mover
      meta-tags: |
        type=semver,pattern={{version}}
        type=semver,pattern={{major}}.{{minor}}
        type=raw,value=rolling,enable=${{ github.event_name == 'release' }}
        type=ref,event=branch
      output: image
      platforms: linux/amd64,linux/arm64
      push: true
      sbom: true
      set-meta-annotations: true
      set-meta-labels: true
      sign: true
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

  helm:
    name: Helm
    needs:
      - release-controller
      - release-webhook
      - release-mover
    if: ${{ github.event_name == 'release' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write # keyless Cosign signing of the published chart
      packages: write
    env:
      VERSION: ${{ github.event.release.tag_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Mise
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          cache: false
          experimental: true
          install_args: --locked

      - name: Check generated manifests
        run: cargo xtask gen-all --check

      # Pin all three component images to the exact digests the builder produced
      # — each build job's first-class `digest` output (the signed multi-arch
      # index) — so the released chart references immutable images instead of
      # floating tags. Fail closed if any digest is missing. Only the packaged
      # copy is rewritten; the repo keeps empty digests (floating tags for dev).
      - name: Pin the released image digests into the chart
        env:
          CONTROLLER_DIGEST: ${{ needs.release-controller.outputs.digest }}
          WEBHOOK_DIGEST: ${{ needs.release-webhook.outputs.digest }}
          MOVER_DIGEST: ${{ needs.release-mover.outputs.digest }}
        run: |
          for pair in "controller:${CONTROLLER_DIGEST}" "webhook:${WEBHOOK_DIGEST}" "mover:${MOVER_DIGEST}"; do
            comp="${pair%%:*}"
            digest="${pair#*:}"
            case "${digest}" in
              sha256:*) ;;
              *) echo "build produced no digest for ${comp} (got: '${digest}')"; exit 1 ;;
            esac
            # Per-component image paths after the chart flatten: the controller is
            # the root `image`, the webhook and mover keep their named blocks.
            case "${comp}" in
              controller) path=".image.digest" ;;
              webhook)    path=".webhook.image.digest" ;;
              mover)      path=".mover.image.digest" ;;
              *) echo "unknown component ${comp}"; exit 1 ;;
            esac
            yq -i "${path} = \"${digest}\"" deploy/helm/kopiur/values.yaml
            echo "pinned ${comp} -> ${digest}"
          done

      - name: Package Helm chart
        run: |
          helm package deploy/helm/kopiur \
            --version "${VERSION}" \
            --app-version "${VERSION}"

      - name: Log in to Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Helm chart to GHCR
        run: |-
          helm push "kopiur-${VERSION}.tgz" "oci://ghcr.io/${{ github.repository_owner }}/charts"

      - name: Sign the published chart with Cosign
        run: |-
          cosign sign --yes "ghcr.io/${{ github.repository_owner }}/charts/kopiur:${VERSION}"

  # Native per-target builds of the plugin binary — see plugin-binaries.yaml.
  plugin:
    name: Plugin
    if: ${{ github.event_name == 'release' }}
    permissions:
      contents: read
    uses: $/.github/workflows/plugin-binaries.yaml
    with:
      version: ${{ github.event.release.tag_name }}

  # goreleaser Pro imports the matrix's prebuilt binaries: archives + split
  # sha256s + SBOMs + cosign to the release, cask to homebrew-tap, krew
  # manifest to this repo's plugins/ (its own krew custom index).
  goreleaser:
    name: GoReleaser
    if: ${{ github.event_name == 'release' }}
    needs: plugin
    runs-on: ubuntu-24.04
    permissions:
      contents: write # attach artifacts to the release + push the krew manifest
      id-token: write # keyless Cosign signing of the artifacts
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Mise
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          cache: false
          experimental: true
          install_args: --locked

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0

      - name: Download plugin binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: kopiur-*
          path: prebuilt

      # Workflow artifacts drop file modes.
      - name: Restore executable bits
        run: chmod +x prebuilt/kopiur-*/kopiur

      # One short-lived bot token scoped to exactly the two repos goreleaser
      # pushes to: the tap (Homebrew cask) and this repo (krew manifest into
      # plugins/). Bot-token pushes retrigger workflows — every on-push workflow
      # here ignores plugins/**, so the manifest commit fans out nothing.
      - name: Generate Bot Token
        id: bot-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.BOT_CLIENT_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: homebrew-tap,kopiur
          permission-contents: write

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser-pro # the prebuilt builder is a Pro feature
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_KEY: ${{ secrets.GORELEASER_KEY }}
          HOMEBREW_TAP_TOKEN: ${{ steps.bot-token.outputs.token }}
          KREW_INDEX_TOKEN: ${{ steps.bot-token.outputs.token }}
