---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Tests

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - ".release-please-manifest.json"
      # The release workflow's krew step pushes plugins/kopiur.yaml to main with
      # the bot app token, which (unlike GITHUB_TOKEN) retriggers workflows —
      # ignore it so a release doesn't re-run this workflow for a manifest bump.
      - "plugins/**"
  pull_request:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - ".release-please-manifest.json"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Full debuginfo overflows the standard runner disk: the all-features
  # compile-check links every gated e2e/integration test binary against the
  # whole dep tree, and with debug=2 that plus the restored cache exceeds the
  # ~14GB free ("No space left on device" → ld SIGBUS, 2026-07-24 twice).
  # line-tables-only keeps file:line backtraces for test failures.
  CARGO_PROFILE_DEV_DEBUG: "line-tables-only"
  # renovate: datasource=github-releases depName=helm-unittest/helm-unittest
  HELM_UNITTEST_VERSION: "v1.1.1"

jobs:
  rust-test:
    name: Rust Tests
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Mise
        uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea # v4.2.1
        with:
          experimental: true
          install_args: --locked

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          # -v2: the debuginfo profile changed (CARGO_PROFILE_DEV_DEBUG above);
          # a restored full-debug cache would double disk during the rebuild.
          shared-key: tests-v2

      - name: Build workspace
        run: mise run build

      - name: Run unit tests
        run: mise run test

      - name: Check generated manifests
        run: mise run gen-check

  integration-test:
    name: Integration Tests
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Mise
        uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea # v4.2.1
        with:
          experimental: true
          install_args: --locked

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          # -v2: see the tests cache note — debuginfo profile changed.
          shared-key: integration-v2

      - name: Create kind cluster
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
        with:
          cluster_name: kopiur-it

      - name: Apply CRDs
        # Server-side apply is required: the BackupConfig CRD embeds a full
        # JobSpec (runJob hook) and exceeds the 256KB last-applied-configuration
        # annotation that a client-side apply would create.
        run: |
          cargo xtask gen-crds
          kubectl apply --server-side -f deploy/crds/all-crds.yaml

      - name: Run integration tests
        run: cargo test --workspace --features integration --locked -- --include-ignored

  helm-test:
    name: Helm Unit Tests
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Mise
        uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea # v4.2.1
        with:
          experimental: true
          install_args: --locked

      - name: Run helm unit tests
        run: |
          helm plugin install https://github.com/helm-unittest/helm-unittest --version "${HELM_UNITTEST_VERSION}" --verify=false
          mise run helm-test
