# mise tasks + tooling for kopiur. `mise tasks` lists them; `mise run <task>`.
# Mise is the source of truth for Rust and project tools in developer shells and CI.

# Monorepo task mode: the e2e harness tasks are co-located with the crate they
# drive, in `crates/e2e/mise.toml`, and invoked as `mise run //crates/e2e:test`
# (or any sub-task, e.g. `//crates/e2e:cluster-create`). `settings.experimental`
# enables this persistently — no MISE_EXPERIMENTAL env var needed in CI or dev
# shells. Existing root tasks below stay invokable unprefixed (`mise run test`).
monorepo_root = true

[settings]
experimental = true

[monorepo]
config_roots = ["crates/e2e"]

# ADDING A TOOL? The `mise-lock` pre-commit hook (from the shared
# home-operations/.github config) runs `mise lock -p
# linux-x64,linux-arm64,macos-arm64` and `git add`s `.mise/mise.lock` for you —
# and on the pinned mise version that regeneration is NOT limited to your new
# tool. It also rewrites `uv` and `cargo-llvm-cov` from their `-linux-gnu`
# release artifacts to `-linux-musl` (new URLs and checksums on both linux
# platforms) and appends a duplicate `[[tools.node]]` entry with
# `backend = "core:node"`. That churn is a real behaviour change and must not
# ride along in an unrelated commit.
#
# So after touching this table: `git diff .mise/mise.lock` and confirm every
# added line belongs to YOUR tool. If it does not, restore the lockfile, insert
# only your tool's block (copy it verbatim from the `mise lock` run — the
# per-platform checksums cannot be hand-written), and commit with `--no-verify`
# so the hook cannot put the churn back. Verify with `mise install --locked
# <tool>`, which fails if a checksum is wrong. The `pnpm` entry below is the
# worked example: it was landed exactly this way.
[tools]
actionlint = "1.7.12"
rust = { version = "1.98.0", components = "rustfmt,clippy,llvm-tools" }
lefthook = "2.1.12"
# `oxfmt` is distributed only via the npm backend (`mise registry oxfmt` →
# `npm:oxfmt`), which needs a node/npm to install. Pin node explicitly so the
# npm backend uses mise's own node+npm and never falls through to a system
# `npm` on PATH (e.g. a stale/removed `/usr/bin/npm`), which silently breaks
# `mise install` with `Cannot find module '/usr/bin/npm'`.
node = "24.20.0"
# Package manager for the web UI SPA (`crates/ui/web`). Resolved from the `aqua`
# backend (`mise registry pnpm` → `aqua:pnpm/pnpm npm:pnpm`), i.e. a standalone
# signed binary rather than an npm install into the node above — so `ui-install`
# needs no global npm state and the lock entry carries a per-platform checksum.
pnpm = "12.3.4"
oxfmt = "0.66.0"
zizmor = "1.30.0"
helm = "4.2.4"
cosign = "3.1.3"
kubectl = "1.37.0"
# The shared pre-commit hooks (home-operations/.github lefthook config) run
# `shellcheck` on staged *.sh files; pin it so the hook resolves a binary.
shellcheck = "0.11.0"
kind = "0.33.0"
kopia = "v0.23.1"
"aqua:EmbarkStudios/cargo-deny" = "0.20.2"
"aqua:taiki-e/cargo-llvm-cov" = "0.9.0"
# Runs the e2e suite (crates/e2e `run` task) so individual flaky tests retry
# in-process-tree instead of failing the whole CI shard; see .config/nextest.toml.
"aqua:nextest-rs/nextest/cargo-nextest" = "0.9.140"
# Docs site toolchain. The docs are an MkDocs Material site (see `mise run docs`);
# the MkDocs + Material + pymdown-extensions versions are pinned in pyproject.toml
# / uv.lock and run via uv, so the only mise-managed tool here is uv itself (which
# creates the locked venv on first `uv run`). Material bundles mermaid.js and the
# admonition styling, so there are no separate preprocessor binaries or committed
# assets to manage. `uv lock` after bumping a docs dependency in pyproject.toml.
"aqua:astral-sh/uv" = "0.12.10"
helm-docs = "1.14.2"
"aqua:dadav/helm-schema" = "0.23.5"
yq = "4.53.6"
# `promtool` (the Prometheus rule/query test runner) ships inside the
# `prometheus/prometheus` aqua package; mise's `promtool` short-name maps to it
# (`mise registry promtool` → aqua:prometheus/prometheus) and exposes the
# promtool binary. Used by `scripts/test-alert-rules.sh` (wired into helm-test)
# to drive the bundled PrometheusRule through `promtool test rules` — the only
# tier that pins alert BEHAVIOR (issue #280), not just the rendered text.
promtool = "3.14.0"

[env]
CARGO_TERM_COLOR = "always"
RUST_BACKTRACE = "1"

[tasks.build]
description = "Compile the whole workspace (debug, locked deps)"
run = "cargo build --workspace --locked"

[tasks.build-release]
description = "Compile the release binaries we ship (controller, webhook, mover)"
run = "cargo build --release --locked -p kopiur-controller -p kopiur-webhook -p kopiur-mover"

[tasks.rust-components]
description = "Install Rust components required by project tasks"
run = "rustup component add rustfmt clippy llvm-tools"

[tasks.test]
# The second command compile-checks ALL feature-gated targets (integration/e2e)
# without running anything: gated tests are also #[ignore]d, but a default-features
# `cargo test` never even COMPILES them, so a stale struct literal in one slips
# past every local gate and breaks only in CI (bit us on PR #201).
description = "Hermetic test suite: unit + serde + validation (no cluster, no network); also compile-checks feature-gated targets"
run = [
  "cargo test --workspace --locked",
  "cargo test --no-run --workspace --all-features --locked",
]

[tasks.test-int]
description = "Cluster + kopia integration tests on an ephemeral kind cluster"
run = "scripts/with-kind.sh cargo test --workspace --features integration --locked -- --include-ignored"

[tasks.clippy]
# --all-features so the integration/e2e-gated test targets are linted too — the
# CI lint job runs this task, so gated code now fails the FAST lint job instead
# of the slow integration job (or a merged main).
description = "Clippy across the workspace incl. feature-gated targets, warnings are errors"
run = "cargo clippy --workspace --all-targets --all-features --locked -- -D warnings"

[tasks.complexity]
description = "Report every function above the cognitive-complexity threshold (clippy.toml; advisory)"
run = '''
set -eu
echo "==> functions above the cognitive-complexity threshold (see clippy.toml)"
cargo clippy --workspace --all-targets --all-features --locked -q -- -W clippy::cognitive_complexity 2>&1 \
  | grep -A2 'cognitive complexity of' \
  | grep -E 'cognitive complexity of|-->' \
  || echo "none — everything is under the threshold"
'''

[tasks.complexity-check]
description = "Ratchet gate: fail if the count of over-threshold functions grows"
run = '''
set -eu
# RATCHET: the count of functions above the cognitive-complexity threshold
# (clippy.toml, 25) must never GROW. This is a count budget with an
# aspirational per-function threshold — not a permissive threshold sized to
# the worst offender — so a NEW overly-complex function fails immediately
# even while the legacy offenders are still being paid down. Refactored one
# under the threshold? Lower BUDGET to match (the task reminds you).
BUDGET=28
COUNT=$(cargo clippy --workspace --all-targets --all-features --locked -q -- -W clippy::cognitive_complexity 2>&1 \
  | grep -A1 'cognitive complexity of' | grep -oE '[-]{2}> [^ ]+' | sort -u | wc -l)
echo "==> functions above the cognitive-complexity threshold: $COUNT (budget: $BUDGET)"
if [ "$COUNT" -gt "$BUDGET" ]; then
  echo "error: cognitive-complexity offenders grew ($COUNT > $BUDGET)." >&2
  echo "Run 'mise run complexity' to list them; simplify the new function (extract" >&2
  echo "pure, unit-testable helpers — the repo idiom) instead of raising BUDGET." >&2
  exit 1
fi
if [ "$COUNT" -lt "$BUDGET" ]; then
  echo "note: offenders dropped below the budget — ratchet BUDGET down to $COUNT in .mise/config.toml"
fi
'''

[tasks.fmt]
description = "Format the workspace in place"
run = "cargo fmt --all"

[tasks.fmt-check]
description = "Verify formatting without changing files (CI gate)"
run = "cargo fmt --all -- --check"

[tasks.gen]
description = "Regenerate deploy/crds + deploy/rbac + the SPA's TypeScript from the Rust types"
run = "cargo xtask gen-all"

[tasks.gen-check]
description = "Fail if checked-in CRDs/RBAC/SPA types are stale (CI drift guard)"
run = "cargo xtask gen-all --check"

[tasks.wiring-check]
description = "Fail if a CRD field is defined but read by no consumer crate (inert-field gate)"
run = '''
set -eu
# `gen-check` proves the checked-in YAML matches the Rust types. It says nothing
# about whether anything READS a field — and because every `crates/api` type is
# `pub`, `dead_code` can never fire on one either. That gap shipped twice:
# #346 (`pvcSelector` had no implementation at all) and #351
# (`files.ignoreIdenticalSnapshots` was never mapped to a kopia flag).
#
# Exemptions live in crates/xtask/wiring-allowlist.yaml, each with a written
# reason. The check fails in BOTH directions: a new inert field, and an
# allowlisted field that has since been wired (delete the entry).
cargo xtask check-wiring
'''

[tasks.phase-check]
description = "Fail if a phase branch is non-exhaustive or a gate condition is CLI-invisible"
run = '''
set -eu
# The compiler enforces exhaustiveness only where an exhaustive `match` was
# written. Four constructs opt out of it silently — `matches!` (an implicit
# `_ => false`), a `_ =>` arm (including the wrapper form `Some(_) =>`, which is
# how every phase here is actually read), `==`/`!=` against a single variant, and
# an `if let` naming one variant — and a fifth drift class has no construct at
# all: a gate condition the controller defines and the CLI never learns about.
# They shipped: #351's `SnapshotPhase::Unchanged` was swallowed by two `_ =>`
# arms, and #359 was `kubectl kopiur doctor` reporting all-green over a Snapshot
# parked on `MoverPermitted=False`.
#
# Exemptions live in crates/xtask/phase-allowlist.yaml, each with a written
# reason. The check fails in BOTH directions: a new non-exhaustive construct,
# and an exemption that matches nothing any more (delete the entry).
cargo xtask check-phases
'''

# ---------------------------------------------------------------------------
# Web UI (crates/ui/web) — the SPA served by `kopiur-ui`.
#
# `test` stays node-free on purpose: the hermetic Rust suite must run without a
# JavaScript toolchain. Everything below needs pnpm, so it lives in its own
# task group and its own CI job.
# ---------------------------------------------------------------------------

[tasks.ui-types]
description = "Regenerate the SPA's TypeScript wire types from crates/ui-model (ts-rs)"
# The same generator `gen`/`gen-check` drive; kept as its own task so a UI-only
# change need not rebuild the CRDs.
run = "cargo xtask gen-ui-types"

[tasks.ui-install]
description = "Install the SPA's node dependencies from the lockfile"
# Every other pnpm task `depends` on this one, so the manifest precondition
# below is the single place that check lives — and it runs no matter which task
# you invoke. It exits NON-ZERO on purpose. A `|| exit 0` skip-guard here would
# be permanent and would fail open: the day someone deletes or mis-paths
# `package.json`, the whole SPA gate would report success. A loud red until the
# scaffold lands is the cheaper failure, and the message says which gates a
# reader can still trust in the meantime.
dir = "crates/ui/web"
run = '''
set -eu
if [ ! -f package.json ]; then
  echo "error: crates/ui/web/package.json is absent — the SPA scaffold has not landed yet." >&2
  echo "       This gate is red by design until it does; nothing here is misconfigured." >&2
  echo "       Unaffected and still meaningful: mise run test, clippy, gen-check (which" >&2
  echo "       includes the SPA's generated TypeScript), wiring-check, phase-check." >&2
  exit 1
fi
pnpm install --frozen-lockfile
'''

[tasks.ui-dev]
description = "Run the SPA dev server (proxies /api to a local kopiur-ui on :8090)"
# `depends`, not a note in the description: mise runs a task's dependencies
# before its body, so this works from any entry point. Listing `ui-install` in
# `ci` instead would NOT order it first — `ci`'s depends run concurrently.
depends = ["ui-install"]
dir = "crates/ui/web"
run = "pnpm dev"

[tasks.ui-build]
description = "Build the SPA into crates/ui/web/dist (what crates/ui/build.rs embeds)"
depends = ["ui-install"]
dir = "crates/ui/web"
run = "pnpm build"

[tasks.ui-check]
description = "SPA gate: tsc + eslint + vitest, then fail if the generated types are not committed"
# `ui-types` is a dependency so the tree check below has something to check: on
# a clean tree with no preceding regeneration it would otherwise assert nothing.
depends = ["ui-install", "ui-types"]
# Runs from the workspace root rather than `crates/ui/web` so the path in the
# check is the one a reader recognises.
#
# This is NOT a different failure from gen-check's — gen-check catches an
# in-place hand-edit too. What it adds is (a) surfacing it in the job that owns
# the SPA, right next to the tsc/eslint output, and (b) `--porcelain` rather
# than `git diff`, which is blind to UNTRACKED files: a brand-new wire type
# whose `.ts` was generated but never `git add`ed would slip past a plain diff.
run = [
  "pnpm -C crates/ui/web check",
  '''
set -eu
dirty="$(git status --porcelain -- crates/ui/web/src/api/types)"
if [ -n "$dirty" ]; then
  echo "error: crates/ui/web/src/api/types is not in sync with git after regenerating:" >&2
  echo "$dirty" >&2
  echo "       fix: git add the generated types (or revert a hand-edit) and commit." >&2
  exit 1
fi
''',
]

[tasks.cov]
description = "Coverage over the hermetic suite -> lcov.info (report-only; no threshold)"
run = "cargo llvm-cov --workspace --locked --lcov --output-path lcov.info"

[tasks.cov-html]
description = "Coverage as a browsable HTML report under target/llvm-cov/html"
run = "cargo llvm-cov --workspace --locked --html"

[tasks.cov-summary]
description = "Coverage summary printed to the terminal"
run = "cargo llvm-cov --workspace --locked --summary-only"

[tasks.image-controller]
description = "Build the controller image locally"
run = '''
KOPIA_VERSION="${KOPIA_VERSION:-$(mise config get tools.kopia)}"
RUST_VERSION="${RUST_VERSION:-$(mise config get tools.rust.version)}"
docker build -f docker/Dockerfile \
  --build-arg BIN=kopiur-controller \
  --build-arg "KOPIA_VERSION=${KOPIA_VERSION}" \
  --build-arg "RUST_VERSION=${RUST_VERSION}" \
  -t "${KOPIUR_IMAGE_PREFIX:-ghcr.io/home-operations/kopiur}/controller:${KOPIUR_IMAGE_TAG:-dev}" .
'''

[tasks.image-webhook]
description = "Build the webhook image locally"
run = '''
KOPIA_VERSION="${KOPIA_VERSION:-$(mise config get tools.kopia)}"
RUST_VERSION="${RUST_VERSION:-$(mise config get tools.rust.version)}"
docker build -f docker/Dockerfile \
  --build-arg BIN=kopiur-webhook \
  --build-arg "KOPIA_VERSION=${KOPIA_VERSION}" \
  --build-arg "RUST_VERSION=${RUST_VERSION}" \
  -t "${KOPIUR_IMAGE_PREFIX:-ghcr.io/home-operations/kopiur}/webhook:${KOPIUR_IMAGE_TAG:-dev}" .
'''

[tasks.image-mover]
description = "Build the mover image locally (ships the kopia + rclone binaries too)"
run = '''
KOPIA_VERSION="${KOPIA_VERSION:-$(mise config get tools.kopia)}"
RUST_VERSION="${RUST_VERSION:-$(mise config get tools.rust.version)}"
# rclone is needed only by the rclone backend; pinned (default lives in the
# Dockerfile, overridable here for reproducible builds).
RCLONE_VERSION="${RCLONE_VERSION:-1.68.2}"
docker build -f docker/Dockerfile.mover \
  --build-arg "KOPIA_VERSION=${KOPIA_VERSION}" \
  --build-arg "RUST_VERSION=${RUST_VERSION}" \
  --build-arg "RCLONE_VERSION=${RCLONE_VERSION}" \
  -t "${KOPIUR_IMAGE_PREFIX:-ghcr.io/home-operations/kopiur}/mover:${KOPIUR_IMAGE_TAG:-dev}" .
'''

[tasks.image-ui]
description = "Build the web UI image locally (builds the SPA in-image; ships no kopia binary)"
run = '''
NODE_VERSION="${NODE_VERSION:-$(mise config get tools.node)}"
PNPM_VERSION="${PNPM_VERSION:-$(mise config get tools.pnpm)}"
RUST_VERSION="${RUST_VERSION:-$(mise config get tools.rust.version)}"
# No KOPIA_VERSION: kopiur-ui never invokes kopia (the browse session pods do),
# so docker/Dockerfile.ui has no kopia stage to feed.
docker build -f docker/Dockerfile.ui \
  --build-arg "NODE_VERSION=${NODE_VERSION}" \
  --build-arg "PNPM_VERSION=${PNPM_VERSION}" \
  --build-arg "RUST_VERSION=${RUST_VERSION}" \
  -t "${KOPIUR_IMAGE_PREFIX:-ghcr.io/home-operations/kopiur}/ui:${KOPIUR_IMAGE_TAG:-dev}" .
'''

[tasks.images]
description = "Build all four component images locally"
depends = ["image-controller", "image-webhook", "image-mover", "image-ui"]

[tasks.helm-lint]
description = "Lint the chart and check it renders in both install scopes"
run = """
helm lint deploy/helm/kopiur
for scope in namespaced cluster; do
  helm template kopiur deploy/helm/kopiur --set installScope="$scope" >/dev/null
done
"""

[tasks.helm-test]
description = "Run helm unit tests + PromQL alert-rule semantic tests"
run = ["helm unittest deploy/helm/kopiur", "scripts/test-alert-rules.sh"]

[tasks.helm-docs]
description = "Generate the chart README + values.schema.json from Chart.yaml + values.yaml"
run = """
helm-docs --chart-search-root=deploy/helm --log-level=warn
# required/additionalProperties are skipped so the schema stays permissive: values.yaml
# supplies every default and the free-form maps stay open. --append-newline gives a
# clean EOF; the file is .prettierignore'd (a generated artifact), so oxfmt skips it.
helm-schema --chart-search-root deploy/helm/kopiur --skip-auto-generation required,additionalProperties --append-newline
"""

[tasks.helm-docs-check]
description = "Fail if the generated chart README/schema are stale (CI gate)"
run = """
mise run helm-docs
git diff --exit-code deploy/helm/kopiur/README.md deploy/helm/kopiur/values.schema.json
"""

[tasks.kind-up]
description = "Create (or reuse) the ephemeral kind cluster and leave it running"
run = "KOPIUR_KEEP_KIND=1 scripts/with-kind.sh kubectl cluster-info"

[tasks.kind-down]
description = "Delete the ephemeral kind cluster"
run = 'kind delete cluster --name "${KOPIUR_KIND_CLUSTER:-kopiur-it}"'

[tasks.audit]
description = "Supply-chain + license audit"
run = "cargo deny check"

[tasks.docs]
description = "Build the full docs site (MkDocs user docs + workspace rustdoc) into site/"
run = "scripts/build-docs.sh"

[tasks.docs-serve]
description = "Serve the MkDocs user docs locally with live reload (no rustdoc nesting)"
run = "uv run mkdocs serve"

[tasks.ci]
description = "The full local gate: the hermetic Rust suite plus the SPA (needs network + node)"
# NOT hermetic, unlike `test`: `ui-install` fetches the SPA's dependencies from
# the network. `test` stays node-free and offline; this is the superset you run
# before pushing.
#
# `ui-install` and `ui-types` are absent from this list on purpose — they are
# `depends` of `ui-check`/`ui-build`, which is what actually ORDERS them.
# Entries here run concurrently, so listing `ui-install` alongside `ui-check`
# would not guarantee node_modules exists by the time `ui-check` starts.
depends = [
  "fmt-check",
  "clippy",
  "build",
  "test",
  "gen-check",
  "wiring-check",
  "phase-check",
  "ui-check",
  "ui-build",
]

[hooks]
postinstall = "lefthook install"
