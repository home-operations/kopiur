[package]
name = "kopiur-cli"
description = "kubectl kopiur — the kopiur kubectl plugin"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

# The binary ships as plain `kopiur` so Homebrew's PATH link and krew's
# install never collide: krew symlinks `kubectl-kopiur` (the name kubectl
# discovers) to this file itself, and brew links it as the standalone `kopiur`
# command. Manual installs get `kubectl kopiur` by naming their PATH
# copy/symlink `kubectl-kopiur`.
[[bin]]
name = "kopiur"
path = "src/main.rs"

[dependencies]
kopiur-api = { workspace = true }
# The pure VolSync→kopiur translation core for `migrate volsync` (kube-free);
# the kube IO lives in cmd/migrate/{mod,io}.rs and calls into this crate.
kopiur-migrate = { workspace = true }
# The browse data-plane reuses the mover's pure Job/work-spec builders (the
# session pod is a byte-identical mover Job) and the kopia client's typed
# session surface (`SessionCmd`, `DirManifest`) for both transports.
kopiur-kopia = { workspace = true }
kopiur-mover = { workspace = true }
# `runtime` powers the --wait watcher (kube::runtime::watcher); `ws` powers the
# browse session's pod-exec transport (WebSocket attach).
# `webpki-roots` compiles in Mozilla's root store as the TLS fallback for the
# rare kubeconfig without certificate-authority data (e.g. a cluster fronted by
# public-CA TLS); the normal path — the cluster CA embedded in kubeconfig — is
# unaffected. It also gives that fallback identical behavior on every platform
# (kube's native-roots path would consult each OS's own trust store).
kube = { workspace = true, features = ["client", "runtime", "rustls-tls", "webpki-roots", "ws"] }
futures = { workspace = true }
k8s-openapi = { workspace = true, features = ["v1_33"] }
rustls = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
# Workspace features + io-std (cat/browse stream snapshot bytes to stdout and
# read REPL lines from stdin) and fs (download writes local files).
tokio = { workspace = true, features = ["io-std", "fs"] }
thiserror = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
