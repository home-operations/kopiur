[package]
name = "kopiur-e2e"
description = "kopiur end-to-end tests: drive a Helm-deployed operator in kind through full CRD lifecycles"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
kopiur-api = { workspace = true }
# The console's wire types, so the web-UI e2e asserts against the SAME structs the
# backend serializes and the SPA consumes — a field rename cannot pass this suite
# by being spelled differently in a test's ad-hoc struct.
kopiur-ui-model = { workspace = true }
kube = { workspace = true, features = ["client", "runtime", "derive", "rustls-tls"] }
rustls = { workspace = true }
k8s-openapi = { workspace = true, features = ["v1_33"] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["sync"] }
anyhow = { workspace = true }
# Backdating Snapshot endTimes + computing expected GFS partitions in the
# retention e2e (the same DateTime type `kopiur_api::select_kept` consumes).
chrono = { workspace = true }
http = "1"
# Collecting a proxied console response body: the web-UI e2e needs the status,
# headers AND body of a REFUSAL, which kube's request_text throws away.
http-body-util = { workspace = true }
# Minting the throwaway CA + leaf cert for the TLS MinIO fixture (the
# `tls.caBundleRef` private-CA e2e) at test runtime.
rcgen = { workspace = true }

[features]
# e2e tests are gated so the hermetic `cargo test --workspace` never compiles
# kube-client-dependent test bodies into a cluster run. They are ALSO `#[ignore]`d,
# so even with the feature on they only run with `-- --include-ignored`.
e2e = []
