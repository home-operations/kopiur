# VolumeGroupSnapshotClass for the hostpath driver.
#
# kopiur resolves a group class the same way it resolves a per-volume one: by
# matching the source PVC's CSI driver, falling back to the unique
# default-annotated class. One class for one driver is unambiguous, so the
# annotation is belt-and-braces for a cluster that later grows a second.
#
# The annotation domain is `kubernetes.io`, NOT the API group's `k8s.io`
# (external-snapshotter pkg/utils/util.go IsDefaultGroupSnapshotClassAnnotation)
# — the two differ for group classes where they match for per-volume ones.
apiVersion: groupsnapshot.storage.k8s.io/v1beta1
kind: VolumeGroupSnapshotClass
metadata:
  name: csi-hostpath-groupsnapclass
  annotations:
    groupsnapshot.storage.kubernetes.io/is-default-class: "true"
driver: hostpath.csi.k8s.io
deletionPolicy: Delete
