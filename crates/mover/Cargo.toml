[package]
name = "kopiur-mover"
description = "Per-Backup/Restore Job binary: invokes kopia and reports status"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
kopiur-api = { workspace = true }
kopiur-kopia = { workspace = true }
kopiur-telemetry = { workspace = true }
kube = { workspace = true, features = ["client", "rustls-tls"] }
rustls = { workspace = true }
k8s-openapi = { workspace = true, features = ["v1_33"] }
serde = { workspace = true }
serde_json = { workspace = true }
opentelemetry = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true }

[dev-dependencies]
serial_test = { workspace = true }
tempfile = "3"
# Mock kube client for the KubeStatusReporter tests (`tower::service_fn` needs
# the `util` feature — the workspace `tower` is default-features, and relying on
# feature unification with kube-client would make `cargo test -p kopiur-mover`
# fragile on its own).
tower = { workspace = true, features = ["util"] }
http = "1"
http-body-util = "0.1"

[features]
integration = []
