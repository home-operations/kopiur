# pnpm settings live here, not in package.json (pnpm 10+).
# esbuild ships a postinstall that stages its native binary; no other
# dependency runs a lifecycle script, and any new one must be listed here
# before pnpm will run it.
allowBuilds:
  esbuild: true

# Deliberate version pins in package.json — JSON has no comments, so the
# reasons live here. Renovate auto-merges minor/patch bumps (.renovaterc.json5),
# so an undocumented pin gets silently re-attempted.
#
# - lucide-react 1.42.0: pnpm's supply-chain policy (minimumReleaseAge, enforced
#   once this file exists) refused the same-day 1.43.0 at pin time. Any release
#   less than about a day old fails `pnpm install` the same way — pick the
#   previous release or wait, do not disable the policy.
