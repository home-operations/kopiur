---
# yaml-language-server: $schema=https://goreleaser.com/static/schema-pro.json
version: 2
project_name: kubectl-kopiur

builds:
  # Binaries come from the plugin-binaries.yaml native matrix; prebuilt (Pro)
  # imports them so archives/checksums/SBOMs/signing/cask work unchanged.
  # `binary` must equal the crates/cli [[bin]] name: brew links the file as
  # the standalone `kopiur`, krew symlinks `kubectl-kopiur` to it — both
  # installable without PATH collision. No Windows: kopiur-mover is unix-only.
  - id: kubectl-kopiur
    builder: prebuilt
    binary: kopiur
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    prebuilt:
      path: prebuilt/kopiur-{{ .Os }}_{{ .Arch }}/kopiur

archives:
  - id: kubectl-kopiur
    ids:
      - kubectl-kopiur

# No upx: macOS kills upx-packed binaries, and shrinking only the Linux pair
# isn't worth the AV-false-positive cost.

checksum:
  algorithm: sha256
  split: true

sboms:
  - artifacts: archive
    documents:
      - "{{ .ArtifactName }}.sbom.json"

signs:
  - cmd: cosign
    signature: ${artifact}.sigstore.json
    args:
      - sign-blob
      - --bundle=${signature}
      - --yes
      - ${artifact}
    artifacts: all
    output: true

homebrew_casks:
  - name: kopiur
    ids:
      - kubectl-kopiur
    # brew installs the standalone `kopiur` command (the file's shipped name —
    # see the builds comment) while krew owns the `kubectl-kopiur` shim, so
    # installing via both never collides on PATH.
    # `brew install home-operations/tap/kopiur` mirrors
    # `kubectl krew install kopiur`.
    binaries:
      - kopiur
    repository:
      owner: home-operations
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: https://kopiur.home-operations.com/cli/
    description: Kubectl plugin operating the kopiur Kopia-native backup operator
    # Binaries aren't notarized — strip the quarantine bit so macOS doesn't
    # block the first run with "developer cannot be verified".
    hooks:
      post:
        install_steps: |
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/kopiur"]
          end

# No `krews:` block: krew-index needs a PR per release, which krew-release-bot
# opens from the repo-root `.krew.yaml` template (release.yaml, after this run
# has attached the archives).

# release-please creates the GitHub Release with the changelog; goreleaser
# attaches binaries/sboms/sigs to it.
release:
  mode: keep-existing
